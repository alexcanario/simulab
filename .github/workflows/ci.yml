name: ci

# F-62 BR8: build and test on every pull request and every push to main. No deploy step here:
# the deploy workflow is F-65 (ADR-0002).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Docker is on the runner: the integration tests start PostgreSQL and Redis containers.
      - name: Build
        run: dotnet build Simulab.slnx --configuration Debug --nologo

      - name: Test
        run: dotnet test Simulab.slnx --configuration Debug --no-build --nologo
