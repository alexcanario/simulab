<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-5 Sign-in and sign-out - mockup</title>
<style>
  :root {
    --primary: #2478C5; --primary-darken: #1858A0; --primary-lighten: #EBF3FD;
    --secondary: #1A9E8C; --background: #F2F5FB; --surface: #FFFFFF;
    --appbar: #0F3266;
    --text: #19243E; --text-2: #4A5A7A; --text-3: #8A96B0; --divider: #D0D8EA;
    --error: #BE3737; --error-bg: #FBECEC; --error-text: #7A1818;
    --warning: #D98B1A; --warning-bg: #FDF4E4; --warning-text: #7A4A00;
    --success: #1A9E8C; --success-bg: #E7F5F3; --success-text: #0D6056;
    --field: #FFFFFF;
  }
  .dark {
    --primary-lighten: #162540; --background: #0E1828; --surface: #172035;
    --text: #E0E8F8; --text-2: #7A8EB0; --text-3: #64789B; --divider: #263352;
    --error-bg: #3A1D1D; --error-text: #F0B4B4;
    --warning-bg: #3A2E14; --warning-text: #F0CE8C;
    --success-bg: #12302C; --success-text: #8FD8CE;
    --field: #101a2c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #d9dee8; color: #19243E; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ccd; font-size: 13px; position: sticky; top: 0; z-index: 50; }
  .controls label { font-weight: 600; margin-right: 4px; }
  .controls select, .controls button { font: inherit; padding: 4px 8px; }
  .note { padding: 8px 16px; font-size: 12px; color: #4A5A7A; }
  .stage { display: flex; justify-content: center; padding: 16px; }

  /* ---- AuthLayout ---- */
  .frame { background: var(--background); color: var(--text); border: 1px solid #99a; border-radius: 8px; overflow: auto; position: relative; height: 760px; transition: width .2s; }
  .frame.desktop { width: 1100px; max-width: 100%; }
  .frame.phone { width: 380px; }
  .auth { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 32px; }
  .topbar { width: 100%; max-width: 760px; display: flex; align-items: center; gap: 4px; margin-bottom: 18px; }
  .brand { color: var(--appbar); font-weight: 700; font-size: 1.25rem; text-decoration: none; }
  .dark .brand { color: #9cc8f2; }
  .spacer { flex: 1; }
  .iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .iconbtn:hover { background: rgba(36,120,197,.12); color: var(--primary); }
  .iconbtn:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .iconbtn[data-tip]:hover::after { content: attr(data-tip); position: absolute; top: 44px; right: 0; white-space: nowrap; background: #333; color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 4px; z-index: 40; }
  .langmenu { position: absolute; right: 16px; top: 62px; background: var(--surface); color: var(--text); border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.25); padding: 4px 0; z-index: 40; display: none; min-width: 180px; }
  .langmenu.open { display: block; }
  .langmenu button { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; padding: 10px 16px; font: inherit; cursor: pointer; }
  .langmenu button:hover { background: var(--primary-lighten); }
  .langmenu button[disabled] { opacity: .5; cursor: default; }
  .card { background: var(--surface); border: 1px solid var(--divider); border-radius: 10px; padding: 28px 26px; width: 100%; max-width: 440px; box-shadow: 0 2px 10px rgba(15,50,102,.06); }
  .authfoot { margin-top: 20px; font-size: .8125rem; color: var(--text-2); }
  .authfoot a { color: var(--primary); }
  h1 { font-size: 1.375rem; font-weight: 700; margin: 0 0 6px; line-height: 1.25; }
  .sub { font-size: .875rem; color: var(--text-2); margin: 0 0 22px; line-height: 1.55; }

  /* ---- kit: fields ---- */
  .fieldset { margin-bottom: 16px; }
  .lbl { display: block; font-size: .75rem; font-weight: 600; color: var(--text-2); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; }
  .req { color: var(--error); margin-left: 3px; }
  .ctl { position: relative; display: flex; }
  input[type=text], input[type=email], input[type=password] { width: 100%; font: inherit; font-size: .9375rem; padding: 10px 12px; border: 1px solid var(--divider); border-radius: 8px; background: var(--field); color: var(--text); }
  input::placeholder { color: var(--text-3); }
  input:hover:not(:disabled) { border-color: var(--text-3); }
  input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(36,120,197,.18); }
  input:disabled { opacity: .6; cursor: not-allowed; }
  .haserr input { border-color: var(--error); }
  .reveal { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
  .hint { display: block; font-size: .75rem; color: var(--text-3); margin-top: 5px; line-height: 1.45; }
  .err { display: block; font-size: .75rem; color: var(--error); margin-top: 5px; font-weight: 600; }
  .dark .err { color: #F0B4B4; }
  .btn { width: 100%; font: inherit; font-size: .9375rem; font-weight: 700; height: 44px; border: 0; border-radius: 8px; background: var(--primary); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; }
  .btn:hover:not(:disabled) { background: var(--primary-darken); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--divider); width: auto; padding: 0 14px; height: 32px; font-size: .8125rem; margin-top: 10px; }
  .btn.ghost:hover:not(:disabled) { background: var(--primary-lighten); }
  .spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ---- kit: alert ---- */
  .alert { display: flex; gap: 10px; padding: 12px 14px; border-radius: 8px; font-size: .8125rem; line-height: 1.5; margin-bottom: 18px; border-left: 4px solid; }
  .alert svg { width: 20px; height: 20px; flex: none; }
  .alert.error { background: var(--error-bg); color: var(--error-text); border-color: var(--error); }
  .alert.warning { background: var(--warning-bg); color: var(--warning-text); border-color: var(--warning); }
  .alert.success { background: var(--success-bg); color: var(--success-text); border-color: var(--success); }
  .alert .act { background: none; border: 0; font: inherit; font-weight: 700; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 4px; display: block; }

  /* ---- app bar preview ---- */
  .barwrap { padding: 16px; }
  .appbar { background: var(--appbar); color: #fff; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px 8px 0 0; }
  .appbar .name { font-weight: 700; }
  .appbar .spacer { flex: 1; }
  .appbar .iconbtn { color: #fff; }
  .appbar .iconbtn:hover { background: rgba(255,255,255,.14); color: #fff; }
  .signinlink { color: #fff; font-size: .875rem; font-weight: 600; text-decoration: none; padding: 8px 12px; border-radius: 6px; }
  .signinlink:hover { background: rgba(255,255,255,.14); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: var(--appbar); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 0; cursor: pointer; font-size: .9375rem; }
  .usermenu { position: absolute; right: 16px; top: 64px; background: var(--surface); color: var(--text); border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.25); min-width: 220px; z-index: 40; display: none; }
  .usermenu.open { display: block; }
  .usermenu .who { padding: 12px 16px; border-bottom: 1px solid var(--divider); }
  .usermenu .who strong { display: block; font-size: .875rem; }
  .usermenu .who span { font-size: .75rem; color: var(--text-2); }
  .usermenu button { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; padding: 10px 16px; font: inherit; cursor: pointer; }
  .usermenu button:hover { background: var(--primary-lighten); }
  .barbody { background: var(--background); height: 120px; border: 1px solid var(--divider); border-top: 0; border-radius: 0 0 8px 8px; }
</style>
</head>
<body>

<div class="controls">
  <span><label for="screen">Screen</label>
    <select id="screen">
      <option value="signin">/sign-in</option>
      <option value="appbar">App bar user menu</option>
    </select></span>
  <span><label for="state">State</label><select id="state"></select></span>
  <span><label for="size">Size</label>
    <select id="size"><option value="desktop">Desktop</option><option value="phone">Phone</option></select></span>
  <span><label for="lang">Language</label>
    <select id="lang"><option value="en">en</option><option value="pt-BR">pt-BR</option><option value="pt-PT">pt-PT</option></select></span>
  <span><label>Theme</label><button id="themeCtl" type="button">light / dark</button></span>
</div>
<div class="note">The bar above is not part of the app. Every text comes from the resource keys listed in the feature file. "App bar user menu" previews the `.app-user-menu` slot left empty by F-2.</div>

<div class="stage">
  <div class="frame desktop" id="frame">
    <div id="signinView" class="auth">
      <div class="topbar">
        <a class="brand" href="#" id="brand">Simulab</a>
        <span class="spacer"></span>
        <button class="iconbtn" id="themeBtn" type="button"></button>
        <button class="iconbtn" id="langBtn" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.92 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.99 7.99 0 0 1 5.08 16zm2.95-8H5.08a7.99 7.99 0 0 1 4.33-3.56A15.65 15.65 0 0 0 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
        </button>
        <div class="langmenu" id="langMenu" role="menu">
          <button type="button" data-lang="en" lang="en">English</button>
          <button type="button" data-lang="pt-BR" lang="pt-BR">Portugu&ecirc;s (Brasil)</button>
          <button type="button" data-lang="pt-PT" lang="pt-PT">Portugu&ecirc;s (Portugal)</button>
        </div>
      </div>
      <div class="card" id="card"></div>
      <div class="authfoot" id="authfoot"></div>
    </div>
    <div id="appbarView" class="barwrap" style="display:none">
      <div class="appbar">
        <span class="name">Simulab</span>
        <span class="spacer"></span>
        <button class="iconbtn" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.37 5.51A7.35 7.35 0 0 0 9.1 7.5c0 4.08 3.32 7.4 7.4 7.4.68 0 1.35-.09 1.99-.27A7.014 7.014 0 0 1 12 19c-3.86 0-7-3.14-7-7 0-2.93 1.81-5.45 4.37-6.49zM12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
        <button class="iconbtn" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2z"/></svg>
        </button>
        <div id="userSlot"></div>
      </div>
      <div class="barbody"></div>
      <div id="userMenu" class="usermenu"></div>
    </div>
  </div>
</div>

<script>
const LANGS = ["en", "pt-BR", "pt-PT"];
const T = {
  "Common.ThemeSwitch.ToDark": ["Switch to dark mode", "Mudar para o modo escuro", "Mudar para o modo escuro"],
  "Common.ThemeSwitch.ToLight": ["Switch to light mode", "Mudar para o modo claro", "Mudar para o modo claro"],
  "Layout.LanguageSwitch.Label": ["Language", "Idioma", "Idioma"],
  "Common.TryAgain": ["Try again", "Tentar de novo", "Tentar novamente"],

  "SignIn.Title": ["Sign in", "Entrar", "Iniciar sessão"],
  "SignIn.Subtitle": ["Welcome back. Keep practising.", "Bem-vindo de volta. Continue praticando.", "Bem-vindo de volta. Continue a praticar."],
  "SignIn.Email.Label": ["Email", "E-mail", "E-mail"],
  "SignIn.Email.Placeholder": ["you@example.com", "voce@exemplo.com", "voce@exemplo.com"],
  "SignIn.Email.Required": ["Enter your email.", "Informe seu e-mail.", "Indique o seu e-mail."],
  "SignIn.Password.Label": ["Password", "Senha", "Palavra-passe"],
  "SignIn.Password.Required": ["Enter your password.", "Informe sua senha.", "Indique a sua palavra-passe."],
  "SignIn.Password.Show": ["Show password", "Mostrar senha", "Mostrar palavra-passe"],
  "SignIn.Password.Hide": ["Hide password", "Ocultar senha", "Ocultar palavra-passe"],
  "SignIn.Submit": ["Sign in", "Entrar", "Iniciar sessão"],
  "SignIn.Submitting": ["Signing in...", "Entrando...", "A iniciar sessão..."],
  "SignIn.NoAccount": ["New here? {0}", "Novo por aqui? {0}", "Novo por aqui? {0}"],
  "SignIn.CreateAccount": ["Create an account", "Criar uma conta", "Criar uma conta"],

  "identity.invalid_credentials": ["Incorrect email or password.", "E-mail ou senha incorretos.", "E-mail ou palavra-passe incorretos."],
  "identity.email_not_verified": ["Confirm your email before signing in.", "Confirme seu e-mail antes de entrar.", "Confirme o seu e-mail antes de iniciar sessão."],
  "identity.email_not_verified.resend": ["Resend the verification email", "Reenviar o e-mail de verificação", "Reenviar o e-mail de verificação"],
  "identity.email_not_verified.sent": ["If the account is still pending, a new link is on its way.", "Se a conta ainda estiver pendente, um novo link está a caminho.", "Se a conta ainda estiver pendente, será enviada uma nova ligação."],
  "identity.account_locked": ["Too many attempts. Try again in {0}.", "Muitas tentativas. Tente de novo em {0}.", "Demasiadas tentativas. Tente novamente dentro de {0}."],
  "common.unexpected_error": ["Something went wrong on our side. Try again in a moment.", "Algo deu errado do nosso lado. Tente de novo em instantes.", "Algo correu mal do nosso lado. Tente novamente dentro de momentos."],

  "Layout.UserMenu.SignIn": ["Sign in", "Entrar", "Iniciar sessão"],
  "Layout.UserMenu.SignOut": ["Sign out", "Sair", "Terminar sessão"],
  "Layout.UserMenu.Label": ["Account menu for {0}", "Menu da conta de {0}", "Menu da conta de {0}"],
};

const STATES = {
  signin: [
    ["ready", "Ready"],
    ["validation", "Validation errors"],
    ["submitting", "Submitting"],
    ["invalid", "Invalid credentials"],
    ["unverified", "Email not verified"],
    ["unverifiedsent", "Email not verified - resend sent"],
    ["locked", "Account locked (countdown)"],
    ["error", "Server error"],
  ],
  appbar: [
    ["anon", "Anonymous"],
    ["signedin", "Signed in"],
    ["menuopen", "Signed in - menu open"],
  ],
};

const ICON = {
  moon: '<path d="M9.37 5.51A7.35 7.35 0 0 0 9.1 7.5c0 4.08 3.32 7.4 7.4 7.4.68 0 1.35-.09 1.99-.27A7.014 7.014 0 0 1 12 19c-3.86 0-7-3.14-7-7 0-2.93 1.81-5.45 4.37-6.49zM12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>',
  sun: '<path d="M12 9c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3m0-2c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>',
  eye: '<path d="M12 6c3.79 0 7.17 2.13 8.82 5.5C19.17 14.87 15.79 17 12 17s-7.17-2.13-8.82-5.5C4.83 8.13 8.21 6 12 6m0-2C7 4 2.73 7.11 1 11.5 2.73 15.89 7 19 12 19s9.27-3.11 11-7.5C21.27 7.11 17 4 12 4zm0 5a2.5 2.5 0 0 0 0 5 2.5 2.5 0 0 0 0-5z"/>',
  eyeoff: '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.8 11.8 0 0 0 1 12.5C2.73 16.89 7 20 12 20c1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65a3 3 0 0 0 3 3c.22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53a5 5 0 0 1-5-5c0-.79.2-1.53.53-2.2z"/>',
  check: '<path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>',
  clock: '<path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>',
  warn: '<path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>',
};

const s = { screen: "signin", state: "ready", size: "desktop", lang: "en", dark: false, showPwd: false, menuOpen: false };
const $ = id => document.getElementById(id);
const t = (k, ...a) => { let v = T[k][LANGS.indexOf(s.lang)]; a.forEach((x, i) => v = v.replace("{" + i + "}", x)); return v; };
const svg = (n, cls) => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="${cls || ""}">${ICON[n]}</svg>`;
const SAMPLE_EMAIL = "ana.ribeiro@exemplo.com";
const SAMPLE_NAME = "Ana Ribeiro";

function alertBox(kind, iconName, text, action) {
  return `<div class="alert ${kind}" role="${kind === "error" ? "alert" : "status"}">${svg(iconName)}<div>${text}${action ? `<button class="act" type="button">${action}</button>` : ""}</div></div>`;
}

function field(o) {
  const err = o.error ? `<span class="err">${o.error}</span>` : "";
  const reveal = o.reveal ? `<button class="iconbtn reveal" type="button" data-toggle="${o.id}" aria-label="${o.revealLabel}" data-tip="${o.revealLabel}">${svg(o.revealed ? "eyeoff" : "eye")}</button>` : "";
  return `<div class="fieldset ${o.error ? "haserr" : ""}">
    <label class="lbl" for="${o.id}">${o.label}${o.required ? '<span class="req" aria-hidden="true">*</span>' : ""}</label>
    <div class="ctl"><input id="${o.id}" type="${o.type}" value="${o.value || ""}" placeholder="${o.placeholder || ""}"
      ${o.required ? 'aria-required="true"' : ""} ${o.error ? 'aria-invalid="true"' : ""} ${o.disabled ? "disabled" : ""}
      aria-describedby="${o.id}-d" autocomplete="${o.autocomplete || "off"}" ${o.reveal ? 'style="padding-right:44px"' : ""}>${reveal}</div>
    <span id="${o.id}-d">${err}</span>
  </div>`;
}

function signIn(st) {
  const invalid = st === "validation";
  const submitting = st === "submitting";
  const locked = st === "locked";
  const dis = submitting || locked;
  let top = "";
  if (st === "invalid") top = alertBox("error", "warn", t("identity.invalid_credentials"));
  if (st === "unverified") top = alertBox("warning", "warn", t("identity.email_not_verified"), t("identity.email_not_verified.resend"));
  if (st === "unverifiedsent") top = alertBox("success", "check", t("identity.email_not_verified.sent"));
  if (locked) top = alertBox("error", "clock", t("identity.account_locked", "14:32"));
  if (st === "error") top = alertBox("error", "warn", t("common.unexpected_error"), t("Common.TryAgain"));

  const emailVal = invalid ? "" : SAMPLE_EMAIL;
  const pwdVal = st === "invalid" || st === "unverified" || st === "unverifiedsent" || locked ? "" : (invalid ? "" : "Estudar#2026!");

  return `<h1>${t("SignIn.Title")}</h1><p class="sub">${t("SignIn.Subtitle")}</p>
  ${top}
  ${field({ id: "email", type: "email", label: t("SignIn.Email.Label"), required: true, placeholder: t("SignIn.Email.Placeholder"),
    value: emailVal, error: invalid ? t("SignIn.Email.Required") : null, disabled: dis, autocomplete: "username" })}
  ${field({ id: "pwd", type: s.showPwd ? "text" : "password", label: t("SignIn.Password.Label"), required: true,
    value: pwdVal, error: invalid ? t("SignIn.Password.Required") : null,
    reveal: true, revealed: s.showPwd, revealLabel: s.showPwd ? t("SignIn.Password.Hide") : t("SignIn.Password.Show"),
    disabled: dis, autocomplete: "current-password" })}
  <button class="btn" type="button" ${dis ? "disabled" : ""}>
    ${submitting ? `<span class="spin"></span>${t("SignIn.Submitting")}` : t("SignIn.Submit")}
  </button>`;
}

function appbarUserSlot(st) {
  if (st === "anon") return `<a class="signinlink" href="#">${t("Layout.UserMenu.SignIn")}</a>`;
  const label = t("Layout.UserMenu.Label", SAMPLE_NAME);
  return `<button class="avatar" type="button" aria-label="${label}" aria-haspopup="true" aria-expanded="${st === "menuopen" ? "true" : "false"}">A</button>`;
}

function userMenuBody() {
  return `<div class="who"><strong>${SAMPLE_NAME}</strong><span>${SAMPLE_EMAIL}</span></div>
    <button type="button">${t("Layout.UserMenu.SignOut")}</button>`;
}

function render() {
  const frame = $("frame");
  frame.className = "frame " + s.size + (s.dark ? " dark" : "");
  document.documentElement.lang = s.lang;

  $("signinView").style.display = s.screen === "signin" ? "flex" : "none";
  $("appbarView").style.display = s.screen === "appbar" ? "block" : "none";

  if (s.screen === "signin") {
    const themeLabel = s.dark ? t("Common.ThemeSwitch.ToLight") : t("Common.ThemeSwitch.ToDark");
    const themeBtn = $("themeBtn");
    themeBtn.innerHTML = svg(s.dark ? "sun" : "moon");
    themeBtn.dataset.tip = themeLabel; themeBtn.setAttribute("aria-label", themeLabel);
    const langBtn = $("langBtn");
    langBtn.dataset.tip = t("Layout.LanguageSwitch.Label"); langBtn.setAttribute("aria-label", t("Layout.LanguageSwitch.Label"));
    document.querySelectorAll("#langMenu button").forEach(b => b.disabled = b.dataset.lang === s.lang);

    $("card").innerHTML = signIn(s.state);
    $("authfoot").innerHTML = t("SignIn.NoAccount", `<a href="#">${t("SignIn.CreateAccount")}</a>`);
  } else {
    $("userSlot").innerHTML = appbarUserSlot(s.state === "menuopen" ? "menuopen" : (s.state === "anon" ? "anon" : "signedin"));
    $("userMenu").className = "usermenu" + (s.state === "menuopen" ? " open" : "");
    $("userMenu").innerHTML = s.state === "menuopen" ? userMenuBody() : "";
  }
}

function fillStates() {
  const sel = $("state");
  sel.innerHTML = STATES[s.screen].map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
  s.state = STATES[s.screen][0][0];
  sel.value = s.state;
}

$("screen").onchange = e => { s.screen = e.target.value; s.showPwd = false; fillStates(); render(); };
$("state").onchange = e => { s.state = e.target.value; render(); };
$("size").onchange = e => { s.size = e.target.value; render(); };
$("lang").onchange = e => { s.lang = e.target.value; render(); };
$("themeCtl").onclick = () => { s.dark = !s.dark; render(); };
$("themeBtn").onclick = () => { s.dark = !s.dark; render(); };
$("langBtn").onclick = () => $("langMenu").classList.toggle("open");
$("langMenu").onclick = e => {
  const b = e.target.closest("button[data-lang]"); if (!b || b.disabled) return;
  s.lang = b.dataset.lang; $("lang").value = s.lang; $("langMenu").classList.remove("open"); render();
};
$("card").onclick = e => {
  const b = e.target.closest("button[data-toggle]"); if (!b) return;
  s.showPwd = !s.showPwd;
  render();
};
document.addEventListener("keydown", e => { if (e.key === "Escape") $("langMenu").classList.remove("open"); });

fillStates();
render();
</script>
</body>
</html>
