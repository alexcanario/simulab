<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-105 - Review before publishing (mockup)</title>
<style>
/* ===========================================================================
   F-105 mockup - the review queue (/admin/questions/review), the review screen
   (/admin/questions/review/{id}), the question form's Publication and Review history
   cards (/admin/questions/{id}) and the question list (/admin/questions).
   Every colour is a token of docs/design/identity.tokens.json (light and dark); the
   white on a filled info alert is MudBlazor's default contrast text (DESIGN.md, Info).
   Classes mirror the kit (app.css): app-page-header, app-data-table, app-row-actions,
   app-section-card, app-form-layout, app-form-aside, app-status-chip, app-chip,
   app-alert, app-state, app-question-*, app-preview-*, app-form-actions, app-dialog.
   No new kit component, no new colour, no new token. New AppIcons constants only.
   No external request: no web font, no icon font, no image.
   =========================================================================== */
:root {
  --app-font-xs: 0.75rem; --app-font-sm: 0.8125rem; --app-font-md: 0.9375rem;
  --app-font-lg: 1.0625rem; --app-font-xl: 1.25rem; --app-font-xxl: 1.75rem;
  --app-space-1: 4px; --app-space-2: 8px; --app-space-3: 12px; --app-space-4: 16px; --app-space-5: 24px; --app-space-6: 32px;
  --app-radius-md: 10px; --app-radius-pill: 999px;

  /* tokens, light */
  --primary: #216DB5; --primary-darken: #1858A0; --primary-lighten: #EBF3FD; --primary-contrast: #FFFFFF;
  --success: #1A9E8C; --success-contrast: #19243E;
  --warning: #D98B1A; --warning-contrast: #19243E;
  --info: #2478C5; --info-contrast: #FFFFFF;
  --error: #BE3737; --error-contrast: #FFFFFF;
  --background: #F2F5FB; --surface: #FFFFFF;
  --drawer: #0F3266; --drawer-text: rgba(255,255,255,0.918); --appbar: #0F3266; --appbar-text: #FFFFFF;
  --text-primary: #19243E; --text-secondary: #4A5A7A; --action-default: #4A5A7A;
  --lines-inputs: #7E8AA1; --table-lines: #D0D8EA; --divider: #D0D8EA;
}
[data-theme="dark"] {
  --primary: #64A2E3; --primary-darken: #5096DC; --primary-lighten: #162540; --primary-contrast: #19243E;
  --success: #1A9E8C; --success-contrast: #19243E;
  --warning: #D98B1A; --warning-contrast: #19243E;
  --info: #2478C5; --info-contrast: #FFFFFF;
  --error: #E06C6C; --error-contrast: #19243E;
  --background: #0E1828; --surface: #172035;
  --drawer: #091422; --drawer-text: rgba(255,255,255,0.498); --appbar: #091422; --appbar-text: rgba(255,255,255,0.7);
  --text-primary: #E0E8F8; --text-secondary: #7A8EB0; --action-default: #7A8EB0;
  --lines-inputs: #61718F; --table-lines: #263352; --divider: #263352;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: var(--app-font-md); line-height: 1.65;
  background: var(--background); color: var(--text-primary);
  display: flex; flex-direction: column;
}
svg { display: inline-block; flex-shrink: 0; vertical-align: middle; fill: currentColor; }
button { font: inherit; color: inherit; }
:is(a, button, input, select, textarea, [tabindex]):focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.app-visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }

/* ---- demo chrome (not part of the product) ---- */
.demo { display: flex; flex-wrap: wrap; align-items: center; gap: var(--app-space-2); padding: var(--app-space-2) var(--app-space-4);
  background: var(--surface); border-bottom: 1px dashed var(--divider); font-size: var(--app-font-xs); }
.demo-label { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin-left: var(--app-space-2); }
.demo button { font-size: var(--app-font-xs); font-weight: 600; padding: 3px 10px; border-radius: 20px; cursor: pointer;
  border: 1px solid var(--lines-inputs); background: var(--surface); color: var(--text-primary); }
.demo button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-contrast); }
.demo-states { display: contents; }
.demo-note { width: 100%; color: var(--text-secondary); }

/* ---- app shell (F-2) ---- */
.appbar { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: var(--app-space-3); padding: 0 var(--app-space-4); background: var(--appbar); color: var(--appbar-text); }
.brand { font-weight: 700; letter-spacing: .09em; }
.spacer { flex: 1; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--success); color: var(--success-contrast); display: flex; align-items: center; justify-content: center; font-size: var(--app-font-xs); font-weight: 700; }
.lay { flex: 1; display: flex; min-height: 0; }
.drawer { width: 260px; flex-shrink: 0; background: var(--drawer); color: var(--drawer-text); padding: var(--app-space-3) var(--app-space-2); }
.nav-section { display: block; padding: var(--app-space-4) var(--app-space-3) var(--app-space-1); font-size: var(--app-font-xs); text-transform: uppercase; letter-spacing: .06em; opacity: .8; }
.nav-link { display: flex; align-items: center; gap: var(--app-space-3); padding: var(--app-space-2) var(--app-space-3); border-left: 3px solid transparent; border-radius: 6px; font-size: var(--app-font-sm); cursor: pointer; color: inherit; text-decoration: none; }
.nav-link:hover { background: rgba(255,255,255,.08); }
.nav-link[aria-current="page"] { background: rgba(255,255,255,.14); border-left-color: var(--primary); font-weight: 600; }
.main { flex: 1; overflow-y: auto; padding: var(--app-space-5); min-width: 0; }
@media (max-width: 959.98px) { .drawer { display: none; } .main { padding: var(--app-space-4); } }
/* demo: the "narrow width" state squeezes the page to a phone-like column */
.is-narrow .drawer { display: none; }
.is-narrow .main { max-width: 412px; margin: 0 auto; padding: var(--app-space-3); border-left: 1px dashed var(--lines-inputs); border-right: 1px dashed var(--lines-inputs); }
.is-narrow .app-form-layout { grid-template-columns: minmax(0, 1fr); }

/* ---- AppLink (B-6) ---- */
.app-link { color: var(--text-primary); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.app-link:hover { text-decoration-thickness: 2px; }

/* ---- AppPageHeader ---- */
.app-page-header { margin-bottom: var(--app-space-5); }
.app-breadcrumbs { font-size: var(--app-font-sm); color: var(--text-secondary); padding-bottom: var(--app-space-1); overflow-wrap: anywhere; }
.app-breadcrumbs .app-link { color: var(--text-secondary); }
.app-page-header-row { display: flex; align-items: center; justify-content: space-between; gap: var(--app-space-3); flex-wrap: wrap; }
.app-page-title { font-size: var(--app-font-xxl); font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; min-width: 0; }

/* ---- buttons (MudButton variants) ---- */
.app-button { font-size: var(--app-font-sm); font-weight: 600; cursor: pointer; min-height: 38px; padding: 0 var(--app-space-4); border-radius: var(--app-radius-md);
  display: inline-flex; align-items: center; gap: var(--app-space-2); border: 1px solid transparent; background: transparent; text-transform: none; }
.app-button-filled { background: var(--primary); color: var(--primary-contrast); }
.app-button-filled:hover { background: var(--primary-darken); }
.app-button-outlined { border-color: var(--primary); color: var(--primary); }
.app-button-outlined:hover { background: var(--primary-lighten); }
.app-button-outlined-error { border-color: var(--error); color: var(--error); }
.app-button-text { color: var(--text-primary); }
.app-button-text:hover { background: var(--primary-lighten); }
.app-button-error { background: var(--error); color: var(--error-contrast); }
.app-button[disabled] { opacity: .45; cursor: not-allowed; }
.app-icon-button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: var(--action-default); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.app-icon-button:hover { background: var(--primary-lighten); }
.app-icon-button.is-error { color: var(--error); }
.app-icon-button[disabled] { opacity: .4; cursor: not-allowed; }
.app-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin .9s linear infinite; }
.app-spinner-lg { width: 36px; height: 36px; border-width: 3px; color: var(--primary); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- AppDataTable ---- */
.app-data-table { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); overflow: hidden; }
.app-table-toolbar { display: flex; align-items: flex-end; gap: var(--app-space-3); padding: var(--app-space-3) var(--app-space-4); flex-wrap: wrap; }
.app-table-search { flex: 1 1 18rem; margin: 0 !important; }
.app-table-filters { display: flex; gap: var(--app-space-3); flex-wrap: wrap; }
.app-table-filters .app-field { width: 15rem; margin: 0; }
.app-table-wrap { overflow-x: auto; }
.app-table { width: 100%; border-collapse: collapse; font-size: var(--app-font-sm); }
.app-table caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.app-table th { text-align: left; font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); padding: var(--app-space-2) var(--app-space-4); border-bottom: 1px solid var(--table-lines); }
.app-table td { padding: var(--app-space-2) var(--app-space-4); border-bottom: 1px solid var(--table-lines); vertical-align: middle; }
.app-table tbody tr:hover { background: var(--primary-lighten); }
.app-cell-actions { text-align: right; white-space: nowrap; width: 1%; }
.app-cell-secondary { display: block; color: var(--text-secondary); font-size: var(--app-font-xs); }
.app-cell-nowrap { white-space: nowrap; }
.app-truncate { display: inline-block; max-width: 26rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
.app-truncate-sm { max-width: 14rem; }
.app-truncate-md { max-width: 16rem; }
.app-truncate-reason { max-width: 24rem; }
.app-row-actions { display: inline-flex; gap: 2px; }
.app-pager { display: flex; justify-content: flex-end; align-items: center; gap: var(--app-space-4); padding: var(--app-space-2) var(--app-space-4); font-size: var(--app-font-xs); color: var(--text-secondary); }
.app-pager select { font: inherit; color: inherit; background: transparent; border: 0; }

/* ---- AppStatusChip / AppChip ---- */
.app-status-chip { display: inline-flex; align-items: center; gap: var(--app-space-2); padding: 2px 10px; border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-pill); background: var(--surface); color: var(--text-primary); font-size: var(--app-font-xs); font-weight: 600; white-space: nowrap; }
.app-status-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-secondary); }
.app-status-chip-success .app-status-chip-dot { background: var(--success); }
.app-status-chip-error .app-status-chip-dot { background: var(--error); }
.app-status-chip-warning .app-status-chip-dot { background: var(--warning); }
.app-status-chip-info .app-status-chip-dot { background: var(--info); }
.app-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 2px 10px; border: 1px solid var(--divider); border-radius: 12px; font-size: var(--app-font-xs); background: var(--surface); }

/* ---- states ---- */
.app-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--app-space-3); padding: var(--app-space-6) var(--app-space-4); text-align: center; color: var(--text-secondary); }
.app-state-card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); }
.app-state-title { font-size: var(--app-font-xl); font-weight: 700; color: var(--text-primary); }
.app-state-error svg { color: var(--error); }

/* ---- AppAlert (MudAlert, Filled, Dense) ---- */
.app-alert { display: flex; gap: var(--app-space-3); align-items: flex-start; padding: var(--app-space-3) var(--app-space-4); border-radius: var(--app-radius-md); margin-bottom: var(--app-space-4); font-size: var(--app-font-sm); overflow-wrap: anywhere; }
.app-alert-content { flex: 1; min-width: 0; }
.app-alert-error { background: var(--error); color: var(--error-contrast); }
.app-alert-info { background: var(--info); color: var(--info-contrast); }
.app-alert-warning { background: var(--warning); color: var(--warning-contrast); }
.app-alert-success { background: var(--success); color: var(--success-contrast); }

/* ---- form layout ---- */
.app-form-layout { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: var(--app-space-4); align-items: start; }
@media (max-width: 1279.98px) { .app-form-layout { grid-template-columns: minmax(0, 1fr); } }
.app-form-card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-5); min-width: 0; display: block; }
.mt-4 { margin-top: var(--app-space-4); }
.mb-4 { margin-bottom: var(--app-space-4); }
.app-section-card { border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-4); min-width: 0; }
.app-section-card + .app-section-card { margin-top: var(--app-space-4); }
.app-section-card-head { display: flex; align-items: flex-start; gap: var(--app-space-3); margin-bottom: var(--app-space-4); }
.app-section-card-icon { color: var(--primary); margin-top: 3px; }
.app-section-card-title { font-size: var(--app-font-lg); font-weight: 600; color: var(--primary); }
.app-section-card-subtitle { font-size: var(--app-font-xs); color: var(--text-secondary); margin-top: var(--app-space-1); }
.app-form-note { font-size: var(--app-font-xs); color: var(--text-secondary); border: 1px dashed var(--lines-inputs); border-radius: var(--app-radius-md); padding: var(--app-space-2) var(--app-space-3); margin-bottom: var(--app-space-4); }

/* ---- fields ---- */
.app-field { margin-bottom: var(--app-space-4); min-width: 0; }
.app-field-label { display: block; font-size: var(--app-font-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--app-space-1); }
.app-field-required { color: var(--error); margin-left: 3px; }
.app-field-value { display: block; }
.app-field-input { display: flex; align-items: flex-start; gap: var(--app-space-2); padding: var(--app-space-2) var(--app-space-3); border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-md); background: var(--surface); color: var(--text-primary); }
.app-field-input:focus-within { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.app-field-input textarea { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--text-primary); font: inherit; font-size: var(--app-font-md); resize: vertical; min-height: 4.5rem; }
.app-field-error .app-field-input { border-color: var(--error); }
.app-field-description { display: block; font-size: var(--app-font-xs); line-height: 1.45; margin-top: var(--app-space-1); min-height: 1.1em; overflow-wrap: anywhere; }
/* AppTextField Counter (F-105, OQ1 → B): the count sits at the end of the description line, after the hint or the error text */
.app-field-description.has-counter { display: flex; justify-content: space-between; gap: var(--app-space-3); align-items: flex-start; }
.app-field-description.has-counter > :first-child { flex: 1; min-width: 0; }
.app-field-counter { flex: none; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
.app-field-error .app-field-counter { color: var(--error); font-weight: 600; }
.app-field-hint { color: var(--text-secondary); }
.app-field-error-text { color: var(--error); font-weight: 600; }
.app-rich-text-frame { border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-md); background: var(--surface); overflow: hidden; }
.app-rt-editor { padding: var(--app-space-2) var(--app-space-3); min-height: 5rem; outline: none; font-size: var(--app-font-md); overflow-wrap: anywhere; }
.app-field-disabled .app-rich-text-frame, .app-field-disabled .app-field-input { opacity: .55; }

/* ---- publication card ---- */
.app-publication-row { display: flex; align-items: center; gap: var(--app-space-3); flex-wrap: wrap; font-size: var(--app-font-sm); }
.app-publication-actions { display: flex; gap: var(--app-space-2); margin-top: var(--app-space-4); flex-wrap: wrap; }
.app-publication-reason { font-size: var(--app-font-xs); color: var(--text-secondary); margin-top: var(--app-space-2); }

/* ---- AppFormActions / AppFormAside ---- */
.app-form-actions { display: flex; justify-content: flex-end; align-items: center; gap: var(--app-space-2); margin-top: var(--app-space-5); flex-wrap: wrap; }
.app-form-aside { position: sticky; top: var(--app-space-4); background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-4) var(--app-space-4) var(--app-space-3); }
.app-form-aside-title { font-size: var(--app-font-md); font-weight: 700; margin-bottom: var(--app-space-2); }
.app-form-aside-row { display: flex; justify-content: space-between; gap: var(--app-space-3); padding: var(--app-space-2) 0; border-bottom: 1px solid var(--divider); font-size: var(--app-font-sm); }
.app-form-aside-row:last-of-type { border-bottom: 0; }
.app-form-aside-row-label { color: var(--text-secondary); font-weight: 600; flex: none; }
.app-form-aside-row-value { text-align: right; overflow-wrap: anywhere; min-width: 0; }
.app-form-aside-row-empty { color: var(--text-secondary); font-style: italic; }
.app-form-aside-checklist-title { font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin: var(--app-space-4) 0 var(--app-space-2); }
.app-form-aside-checklist { list-style: none; display: flex; flex-direction: column; gap: var(--app-space-2); }
.app-form-aside-checklist li { display: flex; align-items: center; gap: var(--app-space-2); font-size: var(--app-font-sm); }
.app-checklist-done svg { color: var(--success); }
.app-checklist-pending svg { color: var(--text-secondary); }

/* ---- question paper (QuestionPreviewDialog content, F-95/F-97/F-104) ---- */
.app-question-source { display: flex; justify-content: space-between; gap: var(--app-space-3); flex-wrap: wrap; font-size: var(--app-font-sm); color: var(--text-secondary); margin-bottom: var(--app-space-3); }
.app-question-content { overflow-wrap: anywhere; }
.app-question-content p + p { margin-top: var(--app-space-2); }
.app-question-content a { color: var(--text-primary); }
.app-question-base { padding: var(--app-space-3) var(--app-space-4); border: 1px solid var(--divider); border-radius: var(--app-radius-md); margin-bottom: var(--app-space-4); font-size: var(--app-font-sm); }
.app-question-select-count { margin-top: var(--app-space-3); font-size: var(--app-font-sm); color: var(--text-secondary); }
.app-question-options { list-style: none; margin-top: var(--app-space-4); display: flex; flex-direction: column; gap: var(--app-space-2); }
.app-question-option { display: flex; gap: var(--app-space-3); align-items: flex-start; padding: var(--app-space-2) var(--app-space-3); border: 1px solid var(--divider); border-radius: var(--app-radius-md); }
.app-question-option.is-correct { border: 2px solid var(--success); }
.app-option-letter { font-weight: 700; min-width: 1.25rem; }
.app-question-option-body { flex: 1; min-width: 0; }
.app-correct-label { display: inline-flex; align-items: center; gap: 4px; font-size: var(--app-font-xs); font-weight: 700; margin-top: var(--app-space-1); }
.app-correct-label svg { color: var(--success); }
.app-preview-answer { margin-top: var(--app-space-4); border-top: 1px solid var(--divider); padding-top: var(--app-space-4); }
.app-preview-heading { font-size: var(--app-font-sm); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); margin-bottom: var(--app-space-2); }
.app-preview-heading + .app-preview-heading, .app-question-content + .app-preview-heading, p + .app-preview-heading { margin-top: var(--app-space-3); }
.app-muted { color: var(--text-secondary); }

/* ---- dialog (MudDialog) ---- */
.app-dialog-backdrop { position: fixed; inset: 0; background: rgba(14,24,40,.55); display: flex; align-items: flex-start; justify-content: center; padding: 12vh var(--app-space-4) var(--app-space-4); z-index: 40; overflow-y: auto; }
.app-dialog { background: var(--surface); color: var(--text-primary); border-radius: var(--app-radius-md); width: 100%; max-width: 30rem; box-shadow: 0 8px 32px rgba(10,20,40,.35); }
.app-dialog-title { font-size: var(--app-font-xl); font-weight: 600; padding: var(--app-space-4) var(--app-space-5) var(--app-space-2); }
.app-dialog-content { padding: 0 var(--app-space-5) var(--app-space-2); font-size: var(--app-font-md); overflow-wrap: anywhere; }
.app-dialog-content .app-field { margin-bottom: 0; }
.app-dialog-actions { display: flex; justify-content: flex-end; gap: var(--app-space-2); padding: var(--app-space-3) var(--app-space-5) var(--app-space-4); flex-wrap: wrap; }

/* ---- snackbar ---- */
.app-snackbar { position: fixed; right: var(--app-space-5); bottom: var(--app-space-5); z-index: 50; display: flex; align-items: center; gap: var(--app-space-2); padding: var(--app-space-3) var(--app-space-4); border-radius: var(--app-radius-md); background: var(--success); color: var(--success-contrast); font-weight: 600; font-size: var(--app-font-sm); box-shadow: 0 4px 16px rgba(20,40,100,.25); max-width: 28rem; }
</style>
</head>
<body>

<!-- ===================== demo chrome (not part of the product) ===================== -->
<div class="demo" id="demo">

/* The question as QuestionPreviewDialog renders it, with the key always shown (BR9). */
function questionPaper(q) {
  let h = "";
  if (sourceLine(q)) h += `<p class="app-question-source" id="review-source"><span>${esc(sourceLine(q))}</span><span>${esc(t("Questions.Preview.Number", q.number))}</span></p>`;
  h += `<div lang="${q.lang}">`;
  if (q.baseText) h += `<div class="app-question-base app-question-content" id="review-base-text">${q.baseText}</div>`;
  h += `<div class="app-question-content" id="review-statement">${q.statement}</div>`;
  if (q.type === "TrueFalse") {
    h += `<ul class="app-question-options" aria-label="${esc(t("Questions.Preview.Answers"))}">` + [true, false].map(v => {
      const marked = q.trueFalseKey === v;
      return `<li class="app-question-option${marked ? " is-correct" : ""}"><div class="app-question-option-body"><div class="app-question-content">${esc(t(v ? "Questions.TrueFalse.True" : "Questions.TrueFalse.False"))}</div>${marked ? `<span class="app-correct-label">${ic("verified", 16)}${esc(t("Questions.Preview.CorrectAnswer"))}</span>` : ""}</div></li>`;
    }).join("") + `</ul>`;
  } else {
    const correct = q.options.filter(o => o.correct).length;
    if (q.type === "MultipleAnswer" && correct > 0) h += `<p class="app-question-select-count">${esc(t("Questions.Preview.SelectCount", correct))}</p>`;
    h += `<ol class="app-question-options" aria-label="${esc(t("Questions.Preview.Options"))}">` + q.options.map((o, i) =>
      `<li class="app-question-option${o.correct ? " is-correct" : ""}"><span class="app-option-letter">${letter(i)}</span><div class="app-question-option-body"><div class="app-question-content">${o.html}</div>${o.correct ? `<span class="app-correct-label">${ic("verified", 16)}${esc(t("Questions.Preview.CorrectAnswer"))}</span>` : ""}</div></li>`).join("") + `</ol>`;
  }
  h += `</div>`;
  const key = q.type === "TrueFalse" ? t(q.trueFalseKey ? "Questions.TrueFalse.True" : "Questions.TrueFalse.False") : q.options.map((o, i) => o.correct ? letter(i) : null).filter(Boolean).join(", ");
  h += `<section class="app-preview-answer" aria-labelledby="review-answer-heading"><h2 class="app-preview-heading" id="review-answer-heading">${esc(t("Questions.Preview.Answer"))}</h2><p><strong>${esc(key)}</strong></p>` +
    `<h2 class="app-preview-heading">${esc(t("Questions.Preview.Explanation"))}</h2>` +
    (plain(q.explanation) ? `<div class="app-question-content" lang="${q.lang}" id="review-explanation">${q.explanation}</div>` : `<p class="app-muted">${esc(t("Questions.Preview.NoExplanation"))}</p>`) + `</section>`;
  return h;
}

function queueRows() {

}
function queueBody() {
  if (state === "loading") return loadingState(false);
  if (state === "error") return errorState(false);
  if (state === "empty") return emptyState(t("ReviewQueue.Empty"));
  const rows = queueRows();
  const body = rows.map(q => {
    const excerpt = plain(q.statement);
    const name = t("Questions.Row.Name", cut(excerpt, 60));
    return `<tr><td>${truncated(excerpt, "", q.lang, "review:" + reviewStateOf(q))}</td>` +

      `<td class="app-cell-actions"><span class="app-row-actions" role="group" aria-label="${esc(t("Common.Actions"))}">${iconButton("review", t("Common.ActionOnItem", t("ReviewQueue.Action.Review"), name), t("ReviewQueue.Action.Review"), { go: "review:" + reviewStateOf(q) })}</span></td></tr>`;

  return `<div class="app-table-wrap"><table class="app-table"><caption>${esc(t("ReviewQueue.Title"))}</caption><thead><tr>` +

}
const reviewStateOf = q => q.id === Q_TRUE_FALSE.id ? "trueFalse" : q.id === Q_MULTIPLE.id ? "multiple" : q.id === Q_LONG.id ? "long" : "ready";

function queueBodyAfterDecision() {

/* QuestionStatusReasonDialog: Required=true (Reject) or Required=false (Approve); AppTextField Counter="true" (OQ1 → B) */
const MAX_REASON = 500;
const counterText = n => `<span class="app-field-counter" id="question-status-reason-counter" aria-hidden="true">${esc(t("Common.Counter", fmtNum(n), fmtNum(MAX_REASON)))}</span>`;
function reasonDialog(o) {

    `<div class="app-field-input"><textarea id="${id}" rows="3" maxlength="${MAX_REASON}" aria-describedby="${descId}"${o.required ? ' aria-required="true"' : ""}${o.error ? ' aria-invalid="true"' : ""}${o.busy ? " disabled" : ""}>${esc(o.value || "")}</textarea></div>` +

}
function reviewOverlay() {
  const approve = v => reasonDialog(Object.assign({ title: t("Review.Approve.Dialog.Title"), message: t("Review.Approve.Dialog.Message"), label: t("Review.Note.Label"), hint: t("Review.Note.Hint"), required: false, confirm: t("Review.Action.Approve") }, v));
  const reject = v => reasonDialog(Object.assign({ title: t("Review.Reject.Dialog.Title"), message: t("Review.Reject.Dialog.Message"), label: t("Questions.StatusReason.Label"), hint: t("Questions.StatusReason.Hint"), required: true, destructive: true, confirm: t("Review.Action.Reject") }, v));
  switch (state) {
    case "approveDialog": return approve({ value: "" });
    case "approveTyping": return approve({ value: NOTE_APPROVE });
    case "approveAtLimit": return approve({ value: AT_LIMIT });
    case "approveTooLong": return approve({ value: TOO_LONG, error: t("question.review_reason_too_long") });
    case "approveBusy": return approve({ value: NOTE_APPROVE, busy: true });
    case "rejectDialog": return reject({ value: "" });
    case "rejectTyping": return reject({ value: REASON_REJECT });
    case "rejectAtLimit": return reject({ value: AT_LIMIT });
    case "rejectValidation": return reject({ value: "", error: t("question.review_reason_required") });
    case "rejectTooLong": return reject({ value: TOO_LONG, error: t("question.review_reason_too_long") });
    case "rejectBusy": return reject({ value: REASON_REJECT, busy: true });

const ENTRIES = {
  inReview: [{ kind: "Submitted", at: "2026-10-16T14:02", reason: null }],
  rejectedDraft: [{ kind: "Submitted", at: "2026-10-16T14:02", reason: null }, { kind: "Rejected", at: "2026-10-17T09:15", reason: REASON_REJECT }],
  resent: [{ kind: "Submitted", at: "2026-10-16T14:02", reason: null }, { kind: "Rejected", at: "2026-10-17T09:15", reason: REASON_REJECT }, { kind: "Submitted", at: "2026-10-17T10:30", reason: null }],
  approvedPublished: [{ kind: "Submitted", at: "2026-10-16T14:02", reason: null }, { kind: "Withdrawn", at: "2026-10-16T16:45", reason: null }, { kind: "Submitted", at: "2026-10-16T17:10", reason: null }, { kind: "Approved", at: "2026-10-17T11:02", reason: NOTE_APPROVE }],
  long: [{ kind: "Submitted", at: "2026-10-16T14:02", reason: null }, { kind: "Rejected", at: "2026-10-17T09:15", reason: REASON_LONG }]
};
function formModel() {
  const m = { status: "Draft", unsaved: false, complete: true, busy: null, entries: [], historyError: false, refused: false, long: false };
  switch (state) {
    case "draftUnsaved": m.unsaved = true; break;
    case "draftIncomplete": m.complete = false; break;
    case "sending": m.busy = "send"; break;
    case "sent": case "inReview": m.status = "InReview"; m.entries = ENTRIES.inReview; break;
    case "withdrawing": m.status = "InReview"; m.entries = ENTRIES.inReview; m.busy = "withdraw"; break;
    case "withdrawn": m.entries = [{ kind: "Submitted", at: "2026-10-16T14:02", reason: null }, { kind: "Withdrawn", at: "2026-10-16T16:45", reason: null }]; break;
    case "rejectedDraft": m.entries = ENTRIES.rejectedDraft; break;
    case "resent": m.status = "InReview"; m.entries = ENTRIES.resent; break;
    case "approvedPublished": m.status = "Published"; m.entries = ENTRIES.approvedPublished; break;
    case "historyError": m.status = "InReview"; m.historyError = true; break;
    case "refused": m.refused = true; break;
    case "long": m.entries = ENTRIES.long; m.long = true; break;
  }
  return m;
}
function publicationCard(m) {
  const frozen = m.status === "InReview";
  const latest = m.entries.length ? m.entries[m.entries.length - 1] : null;
  const reason = m.unsaved ? t("Questions.Publication.Publish.DisabledUnsaved") : !m.complete ? t("Questions.Publication.Publish.DisabledIncomplete") : null;
  let body = "";
  if (m.refused) body += alertBox("error", t("Questions.Publication.Publish.DisabledIncomplete"));
  if (m.status === "Draft" && latest && latest.kind === "Rejected") body += alertBox("info", t("Questions.Publication.Rejected", fmtDateTime(latest.at), latest.reason), "question-rejected");
  const sentence = frozen ? t("Questions.Publication.InReview", fmtDateTime(latest.at)) : m.status === "Published" ? t("Questions.Publication.Published") : t("Questions.Publication.Draft");
  body += `<div class="app-publication-row">${statusChip(m.status)}<span>${esc(sentence)}</span></div><div class="app-publication-actions">`;
  body += button("outlined", "view", t("Questions.Action.Preview"), { id: "question-preview", disabled: !!m.busy });
  if (frozen) {
    body += button("outlined", m.busy === "withdraw" ? null : "withdraw", t("Questions.Action.Withdraw"), { id: "question-withdraw", disabled: !!m.busy, busy: m.busy === "withdraw", action: "withdraw" });
  } else if (m.status === "Published") {
    body += button("outlined", "unpublish", t("Questions.Action.Unpublish"), { id: "question-unpublish" });
  } else {
    const dis = !!m.busy || reason !== null;
    body += button("outlined", m.busy === "send" ? null : "send", t("Questions.Action.SendForReview"), { id: "question-submit", disabled: dis, busy: m.busy === "send", describedBy: reason ? "question-publication-reason" : null, action: "send" });
    body += button("outlined", "publish", t("Questions.Action.Publish"), { id: "question-publish", disabled: dis, describedBy: reason ? "question-publication-reason" : null });
  }
  body += `</div>`;
  if (!frozen && m.status === "Draft" && reason) body += `<p id="question-publication-reason" class="app-publication-reason">${esc(reason)}</p>`;
  return `<div class="app-form-card mt-4">${sectionCard("question-section-publication", "publish", t("Questions.Section.Publication"), t("Questions.Section.Publication.Subtitle"), body)}</div>`;
}
function reviewHistoryCard(m) {

function formOverlay() {
  if (state === "sent") return snack(t("Questions.SentForReview"));
  if (state === "withdrawn") return snack(t("Questions.Withdrawn"));
  return "";
}

/* ===========================================================================
   Screen 4 - /admin/questions
   =========================================================================== */
function renderList() {
  if (state === "denied") return deniedState();
  let rows = LIST.slice();
  if (state === "filtered") rows = rows.filter(r => r.status === "InReview");
  if (state === "long") rows = [{ q: Q_LONG, status: "InReview" }].concat(rows);
  const deleteReason = s => s === "Published" ? t("Questions.Delete.DisabledPublished") : s === "Annulled" ? t("Questions.Delete.DisabledAnnulled") : s === "InReview" ? t("Questions.Delete.DisabledInReview") : null;
  const body = rows.map(r => {
    const q = r.q, excerpt = plain(q.statement), name = t("Questions.Row.Name", cut(excerpt, 60));
    const reason = deleteReason(r.status);
    let actions = iconButton("edit", t("Common.ActionOnItem", t("Common.Edit"), name), t("Common.Edit"), { go: "form:" + (r.status === "InReview" ? "inReview" : "draft") }) +
      iconButton("delete", t("Common.ActionOnItem", t("Common.Delete"), name), reason || t("Common.Delete"), { error: true, disabled: !!reason });
    if (r.status === "Published") actions += iconButton("unpublish", t("Common.ActionOnItem", t("Questions.Action.Unpublish"), name), t("Questions.Action.Unpublish"));
    else if (r.status === "Draft") actions += iconButton("publish", t("Common.ActionOnItem", t("Questions.Action.Publish"), name), t("Questions.Action.Publish"));
    return `<tr><td>${truncated(excerpt, "", q.lang)}</td>` +
      `<td>${truncated(q.topic, "app-truncate-sm")}<span class="app-cell-secondary">${truncated(q.subject, "app-truncate-sm")}</span></td>` +
      `<td>${q.source ? truncated(q.source, "app-truncate-md") + `<span class="app-cell-secondary">${esc(t("Questions.Source.Number", q.number))}</span>` : dash(t("Questions.Source.Authored"))}</td>` +
      `<td style="text-align:right">${q.difficulty == null ? dash(t("Questions.Difficulty.NotSet")) : fmtNum(q.difficulty)}</td>` +
      `<td><span lang="${q.lang}">${esc(LANG_NAMES[q.lang])}</span></td>` +
      `<td>${statusChip(r.status)}</td><td><span class="app-cell-nowrap">${labelChip(typeName(q.type))}</span></td>` +
      `<td class="app-cell-actions"><span class="app-row-actions" role="group" aria-label="${esc(t("Common.Actions"))}">${actions}</span></td></tr>`;
  }).join("");
  const filterChip = state === "filtered" ? `<span class="app-status-chip app-status-chip-warning"><span class="app-status-chip-dot" aria-hidden="true"></span>${esc(t("Questions.Status.InReview"))}<button type="button" class="app-icon-button" style="width:22px;height:22px" aria-label="${esc(t("Common.Delete"))}: ${esc(t("Questions.Status.InReview"))}" data-go="list:ready">${ic("close", 14)}</button></span>` : "";
  return `<header class="app-page-header"><nav class="app-breadcrumbs" aria-label="Breadcrumb"><span>${esc(t("Nav.Section.Content"))}</span> <span aria-hidden="true">/</span> <span>${esc(t("Questions.Title"))}</span></nav><div class="app-page-header-row"><h1 class="app-page-title">${esc(t("Questions.Title"))}</h1><button type="button" class="app-button app-button-filled">${ic("add")}<span>${esc(t("Common.Add"))}</span></button></div></header>` +
    `<div class="app-data-table"><div class="app-table-toolbar">` +
    `<div class="app-field app-table-search"><label class="app-visually-hidden" for="questions-search">${esc(t("Common.Search"))}</label><div class="app-field-input" style="align-items:center;padding:0 12px;height:40px"><span style="color:var(--primary);display:inline-flex">${ic("search")}</span><input id="questions-search" type="search" autocomplete="off" placeholder="${esc(t("Questions.Search.Placeholder"))}" style="flex:1;border:0;outline:none;background:transparent;color:inherit;font:inherit"></div></div>` +
    `<div class="app-table-filters"><div class="app-field" style="width:15rem"><span class="app-field-label">${esc(t("Questions.Filter.Status"))}</span><div class="app-field-input" style="align-items:center;min-height:40px;padding:2px 8px;gap:4px;flex-wrap:wrap">${filterChip}<span class="spacer"></span><button type="button" class="app-icon-button" aria-label="${esc(t("Questions.Filter.Status"))}" aria-expanded="false" data-go="list:filtered" style="width:26px;height:26px"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg></button></div></div></div>` +
    `</div><div class="app-table-wrap"><table class="app-table"><caption>${esc(t("Questions.Title"))}</caption><thead><tr>` +
    ["Questions.Column.Statement", "Questions.Column.Topic", "Questions.Column.Source"].map(k => `<th scope="col">${esc(t(k))}</th>`).join("") +
    `<th scope="col" style="text-align:right">${esc(t("Questions.Column.Difficulty"))}</th>` +
    ["Questions.Column.Language", "Questions.Column.Status", "Questions.Column.Type"].map(k => `<th scope="col">${esc(t(k))}</th>`).join("") +
    `<th scope="col" class="app-cell-actions"><span class="app-visually-hidden">${esc(t("Common.Actions"))}</span></th></tr></thead><tbody>${body}</tbody></table></div>${pager(1, rows.length, rows.length)}</div>`;
}

/* ===========================================================================
   render
   =========================================================================== */
function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-screen]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.screen === screen)));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("demo-states").innerHTML = STATES[screen].map(s => `<button type="button" data-state="${s[0]}" aria-pressed="${s[0] === state}">${esc(s[1])}</button>`).join("");
  document.getElementById("demo-note").textContent = NOTES[screen];

  /* the drawer follows the permissions: questions.review shows the queue; questions.manage shows Questions and Base texts */
  const denied = state === "denied";
  const reviewScreen = screen === "queue" || screen === "review";
  const hasReview = !(reviewScreen && denied);
  const hasManage = !((screen === "form" || screen === "list") && denied) && !(screen === "queue" && state === "reviewOnly");
  const nav = id => document.getElementById(id);
  nav("nav-questions").hidden = !hasManage; nav("nav-base-texts").hidden = !hasManage; nav("nav-review-queue").hidden = !hasReview;
  ["nav-questions", "nav-review-queue", "nav-base-texts"].forEach(id => nav(id).removeAttribute("aria-current"));
  if (!denied) nav(reviewScreen ? "nav-review-queue" : "nav-questions").setAttribute("aria-current", "page");

  document.getElementById("main").innerHTML = { queue: renderQueue, review: renderReview, form: renderForm, list: renderList }[screen]();

  const overlay = screen === "review" ? reviewOverlay() : screen === "form" ? formOverlay() : "";
  document.getElementById("overlay").innerHTML = overlay;
  const field = document.getElementById("question-status-reason");
  if (field && !field.disabled) field.focus();
}

/* ===========================================================================
   events
   =========================================================================== */
document.querySelectorAll("svg[data-icon]").forEach(el => { el.innerHTML = `<path d="${ICONS[el.dataset.icon]}"/>`; });

document.addEventListener("click", e => {
  const el = e.target.closest("[data-screen],[data-state],[data-lang],[data-theme-btn],[data-go],[data-action],[data-dlg],a[href='#']");
  if (!el) return;
  if (el.dataset.screen) { screen = el.dataset.screen; setState(STATES[screen][0][0]); return; }
  if (el.dataset.state) { setState(el.dataset.state); return; }
  if (el.dataset.lang) { lang = el.dataset.lang; render(); return; }
  if (el.dataset.themeBtn) {
    document.documentElement.dataset.theme = el.dataset.themeBtn;
    document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", String(b === el)));
    return;
  }
  if (el.dataset.go) { e.preventDefault(); const p = el.dataset.go.split(":"); screen = p[0]; setState(p[1]); return; }
  if (el.dataset.action) {
    if (el.dataset.action === "approve") setState("approveDialog");
    if (el.dataset.action === "reject") setState("rejectDialog");
    if (el.dataset.action === "send") setState("sent");
    if (el.dataset.action === "withdraw") setState("withdrawn");
    return;
  }
  if (el.dataset.dlg) {
    const confirmed = el.dataset.dlg === "confirm";
    const approving = state.startsWith("approve");
    if (!confirmed) { setState("ready"); document.getElementById(approving ? "review-approve" : "review-reject").focus(); return; }
    if (state === "rejectTooLong" || state === "approveTooLong") { setState(state); return; }
    const field = document.getElementById("question-status-reason");
    if (!approving && field && !field.value.trim()) { setState("rejectValidation"); return; }
    setState(approving ? "approved" : "rejected");
    return;
  }
  if (el.matches("a[href='#']")) e.preventDefault();
});
/* the counter follows what is typed; the live text is refreshed too (the kit debounces it so a pause, not a keystroke, is announced) */
document.addEventListener("input", e => {
  if (e.target.id !== "question-status-reason") return;
  const n = e.target.value.length;
  document.getElementById("question-status-reason-counter").textContent = t("Common.Counter", fmtNum(n), fmtNum(MAX_REASON));
  clearTimeout(window.__counterTimer);
  window.__counterTimer = setTimeout(() => { const live = document.getElementById("question-status-reason-spoken"); if (live) live.textContent = t("Common.Counter.Spoken", fmtNum(n), fmtNum(MAX_REASON)); }, 600);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const cancel = document.querySelector("[data-dlg='cancel']");
  if (cancel && !cancel.disabled) cancel.click();
});

render();
</script>
</body>
</html>
