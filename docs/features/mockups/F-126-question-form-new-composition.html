<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-126 - Question form in the new composition (mockup)</title>
<style>
/* ===========================================================================
   F-126 mockup - the question form (/admin/questions/{id}, /new, /transcribe) in the new
   composition: numbered section cards (AppSectionCard + Number) and the aside (AppFormAside +
   content slot) holding the publication block, with Publish as the screen's one amber action
   (AppActionButton, compact).
   Every colour is a token of docs/design/identity.tokens.json, light and dark; the keycap edges are
   the --app-keycap-*-edge values of DESIGN.md. No new colour. Sizes follow app.css (space, type and
   radius scales). Fonts: the Bricolage Grotesque stack; the mockup loads no font file, so it shows
   the system fallback unless the font is installed. No external request of any kind.
   The option rows keep today's look: keycap rows are F-149.
   =========================================================================== */
:root {
  --app-font-xs: 0.75rem; --app-font-sm: 0.8125rem; --app-font-md: 0.875rem; --app-font-base: 0.9375rem;
  --app-font-lg: 1rem; --app-font-xl: 1.375rem;
  --app-space-1: 0.25rem; --app-space-2: 0.5rem; --app-space-3: 0.75rem; --app-space-4: 1rem;
  --app-space-5: 1.5rem; --app-space-6: 2rem; --app-space-7: 2.5rem;
  --app-radius-sm: 6px; --app-radius-md: 12px; --app-radius-lg: 20px;
  --app-keycap-depth: 4px; --app-keycap-press: 2px;
  --main-h: 656px;
}
[data-theme="light"] {
  --primary: #0F3266; --primary-text: #FFFFFF; --primary-darken: #10366E; --primary-lighten: #DCE8F5;
  --secondary: #1A9E8C; --secondary-text: #0B1B2E;
  --tertiary: #F5A020; --tertiary-text: #0B1B2E; --tertiary-darken: #FFAD23;
  --info: #2478C5; --info-text: #FFFFFF;
  --success: #1A9E8C; --success-text: #0B1B2E;
  --warning: #D98B1A; --warning-text: #0B1B2E;
  --error: #B83232; --error-text: #FFFFFF;
  --text-primary: #0B1B2E; --text-secondary: #52647A; --action-default: #52647A;
  --background: #F2F5FB; --background-gray: #E6ECF5; --surface: #FFFFFF;
  --drawer: #0F3266; --drawer-text: #FFFFFFEB; --appbar: #FFFFFF; --appbar-text: #0B1B2E;
  --lines-inputs: #6B7C91; --divider: #D9E1EE; --link: #1D64A8; --brand-name: #0F3266;
  --edge-primary: #6B7C91; --edge-secondary: #107264; --edge-tertiary: #B87410; --edge-info: #17528A; --edge-error: #842424;
}
[data-theme="dark"] {
  --primary: #47A0EB; --primary-text: #0B1B2E; --primary-darken: #4DADFE; --primary-lighten: #1A4583;
  --secondary: #1A9E8C; --secondary-text: #0B1B2E;
  --tertiary: #F5A020; --tertiary-text: #0B1B2E; --tertiary-darken: #FFAD23;
  --info: #47A0EB; --info-text: #0B1B2E;
  --success: #1A9E8C; --success-text: #0B1B2E;
  --warning: #D98B1A; --warning-text: #0B1B2E;
  --error: #FF9C94; --error-text: #0B1B2E;
  --text-primary: #F2F5FB; --text-secondary: #B8C4D2; --action-default: #B8C4D2;
  --background: #0B2149; --background-gray: #081938; --surface: #12386F;
  --drawer: #081938; --drawer-text: #B8C4D2; --appbar: #12386F; --appbar-text: #F2F5FB;
  --lines-inputs: #7F9BC0; --divider: #24497F; --link: #8CC4F5; --brand-name: #F2F5FB;
  --edge-primary: #1F6FB5; --edge-secondary: #107264; --edge-tertiary: #B87410; --edge-info: #1F6FB5; --edge-error: #A66560;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 500;
  font-size: var(--app-font-base); line-height: 1.375rem;
  background: var(--background); color: var(--text-primary);
  display: flex; flex-direction: column;
}
h1, h2, h3, p, dl, dd, ul { margin: 0; }
svg { display: inline-block; flex-shrink: 0; vertical-align: middle; fill: currentColor; width: 20px; height: 20px; }
button { font: inherit; color: inherit; }
a, button, [role="button"] { cursor: pointer; }
:is(a, button, input, select, textarea, [tabindex]):focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
.app-drawer :focus-visible { outline-color: var(--drawer-text); }
.app-visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }

/* ---- demo chrome (not part of the product) ---- */
.demo { flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 12px;
  background: var(--surface); border-bottom: 1px dashed var(--lines-inputs); font-size: 12px; line-height: 16px; }
.demo-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.demo-label { font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); margin: 0 4px 0 8px; }
.demo button { font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--lines-inputs);
  background: var(--surface); color: var(--text-primary); }
.demo button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
.demo-readout { width: 100%; color: var(--text-secondary); font-family: ui-monospace, Consolas, monospace; }
.stage { flex: 1; min-height: 0; overflow: auto; background: var(--background-gray); }

/* ---- app frame: the viewport being simulated ---- */
.frame { position: relative; display: grid; grid-template-rows: 64px minmax(0, 1fr); grid-template-columns: 240px minmax(0, 1fr);
  background: var(--background); overflow: hidden; margin: 0 auto; }
.frame.vp-1280 { width: 1280px; height: 720px; }
.frame.vp-1024 { width: 1024px; height: 720px; }
.frame.vp-fluid { width: 100%; height: 100%; }
.appbar { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--app-space-3); padding: 0 var(--app-space-4);
  background: var(--appbar); color: var(--appbar-text); border-bottom: 1px solid var(--divider); }
.brand-symbol { display: inline-flex; gap: 3px; }
.brand-symbol span { width: 12px; height: 12px; border-radius: 3px; }
.brand-symbol span:nth-child(1) { background: var(--secondary); }
.brand-symbol span:nth-child(2) { background: var(--info); }
.brand-symbol span:nth-child(3) { background: var(--tertiary); }
.brand-name { font-weight: 800; color: var(--brand-name); line-height: 1.1; }
.brand-company { display: block; font-size: var(--app-font-xs); font-weight: 500; color: var(--text-secondary); }
.spacer { flex: 1; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--secondary); color: var(--secondary-text);
  display: inline-flex; align-items: center; justify-content: center; font-size: var(--app-font-xs); font-weight: 800; }
.app-drawer { background: var(--drawer); color: var(--drawer-text); border-right: 1px solid var(--divider); padding: var(--app-space-3) var(--app-space-2); overflow-y: auto; }
.nav-section { display: block; padding: var(--app-space-4) var(--app-space-3) var(--app-space-1); font-size: var(--app-font-xs); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.nav-link { display: flex; align-items: center; gap: var(--app-space-3); padding: var(--app-space-2) var(--app-space-3); border-left: 3px solid transparent;
  border-radius: var(--app-radius-sm); font-size: var(--app-font-md); color: inherit; text-decoration: none; }
.nav-link[aria-current="page"] { border-left-color: var(--drawer-text); font-weight: 800; }
.main { overflow-y: auto; min-width: 0; position: relative; }
.container { max-width: 1280px; margin: 0 auto; padding: var(--app-space-5); }

/* ---- AppPageHeader ---- */
.app-page-header { margin-bottom: var(--app-space-5); }
.app-breadcrumbs { font-size: var(--app-font-sm); color: var(--text-secondary); padding-bottom: var(--app-space-1); }
.app-breadcrumbs a { color: var(--link); }
.app-page-title { font-size: 1.75rem; line-height: 2rem; font-weight: 800; letter-spacing: -0.02em; }

/* ---- buttons (MudButton variants as the kit styles them, F-125/F-148) ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--app-space-2); min-height: 44px; padding: 6px var(--app-space-4);
  border-radius: var(--app-radius-md); border: 0; background: transparent; font-size: var(--app-font-md); font-weight: 800; line-height: 1.25rem; text-align: center; }
.btn svg { width: 18px; height: 18px; }
.btn-filled { background: var(--primary); color: var(--primary-text); box-shadow: 0 var(--app-keycap-depth) 0 var(--edge-primary); margin-bottom: var(--app-keycap-depth); }
.btn-filled:hover:not(:disabled) { background: var(--primary-darken); }
.btn-filled:active:not(:disabled) { transform: translateY(var(--app-keycap-press)); box-shadow: 0 var(--app-keycap-press) 0 var(--edge-primary); }
.btn-filled:disabled { background: var(--background-gray); color: var(--text-secondary); box-shadow: none; }
.btn-outlined { background: var(--surface); border: 2px solid var(--lines-inputs); color: var(--text-primary); }
.btn-outlined.is-error { border-color: var(--error); color: var(--error); }
.btn-outlined:disabled { border-color: var(--background-gray); color: var(--text-secondary); cursor: default; }
.btn-text { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { cursor: default; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin .9s linear infinite; display: inline-block; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.5s; } }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; color: var(--action-default); display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:disabled { opacity: .5; }

/* ---- AppActionButton, compact (F-148 + F-126: Icon, Id, Busy, DescribedBy) ---- */
.app-action { display: inline-flex; align-items: center; gap: var(--app-space-2); padding-bottom: var(--app-keycap-depth); }
.app-action-key { display: inline-flex; align-items: center; justify-content: center; gap: var(--app-space-2); min-height: 44px; padding: 6px var(--app-space-5);
  border: 0; border-radius: var(--app-radius-md); background: var(--tertiary); color: var(--tertiary-text);
  box-shadow: 0 var(--app-keycap-depth) 0 var(--edge-tertiary); font-weight: 800; font-size: var(--app-font-md); line-height: 1.25rem;
  transition: background-color 150ms ease, transform 80ms ease, box-shadow 80ms ease; }
.app-action-key:hover:not(:disabled) { background: var(--tertiary-darken); }
.app-action-key:active:not(:disabled) { transform: translateY(var(--app-keycap-press)); box-shadow: 0 var(--app-keycap-press) 0 var(--edge-tertiary); }
.app-action-key:disabled { background: var(--background-gray); color: var(--text-secondary); box-shadow: none; cursor: default; }
.app-action-icon { display: inline-flex; transition: transform .4s ease; }
.app-action-icon svg { width: 18px; height: 18px; }
.app-action-key:active:not(:disabled) .app-action-icon { transform: rotate(200deg); }
/* Publish: the arrow rests pointing down and turns up while the key is pressed (owner, 2026-10-23). */
.app-action-icon.is-flipped { transform: rotate(180deg); }
.app-action-key:active:not(:disabled) .app-action-icon.is-flipped { transform: rotate(360deg); }
@media (prefers-reduced-motion: reduce) { .app-action-key, .app-action-icon { transition: none; } }

/* ---- surfaces ---- */
.app-form-card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-lg); padding: var(--app-space-5); }
.mt-4 { margin-top: var(--app-space-4); }
.mb-4 { margin-bottom: var(--app-space-4); }

/* ---- AppSectionCard + Number (F-126, BR1/BR2) ---- */
.app-section-card { border: 1px solid var(--divider); border-radius: var(--app-radius-lg); padding: var(--app-space-4); }
.app-section-card + .app-section-card { margin-top: var(--app-space-4); }
.app-section-card-head { display: flex; align-items: flex-start; gap: var(--app-space-3); margin-bottom: var(--app-space-4); }
.app-section-card-icon { color: var(--primary); }
.app-section-card-number { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 28px; height: 28px;
  border-radius: var(--app-radius-sm); background: var(--primary-lighten); color: var(--brand-name); font-size: var(--app-font-md); font-weight: 800; line-height: 1; }
.app-section-card-heading { flex: 1 1 auto; min-width: 0; }
.app-section-card-title { font-size: var(--app-font-lg); line-height: 1.75rem; font-weight: 600; color: var(--brand-name); }
.app-section-card-subtitle { margin-top: var(--app-space-1); font-size: var(--app-font-xs); line-height: 1rem; color: var(--text-secondary); }

/* ---- fields ---- */
.app-form-grid { display: grid; gap: var(--app-space-4); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.app-field { display: flex; flex-direction: column; gap: var(--app-space-1); min-width: 0; }
.app-field-label { font-size: var(--app-font-sm); font-weight: 800; }
.app-field-required { color: var(--error); }
.app-input { display: flex; align-items: center; gap: var(--app-space-2); min-height: 44px; padding: 6px var(--app-space-3);
  border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-md); background: var(--surface); font-size: var(--app-font-md); min-width: 0; }
.app-input > span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.app-input svg { color: var(--action-default); width: 18px; height: 18px; }
.app-input.is-empty > span { color: var(--text-secondary); }
.app-input.is-disabled { border-color: var(--divider); color: var(--text-secondary); }
.app-input.is-error { border: 2px solid var(--error); }
.app-input.is-multiline { align-items: flex-start; min-height: 88px; }
.app-field-hint { font-size: var(--app-font-xs); line-height: 1rem; color: var(--text-secondary); }
.app-field-error-text { font-size: var(--app-font-xs); line-height: 1rem; color: var(--error); font-weight: 800; }
.app-field-value { font-size: var(--app-font-md); }
.app-rte { border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-md); background: var(--surface); }
.app-rte.is-disabled { border-color: var(--divider); color: var(--text-secondary); }
.app-rte-toolbar { display: flex; gap: 2px; padding: 2px var(--app-space-2); border-bottom: 1px solid var(--divider); }
.app-rte-toolbar .icon-btn { width: 32px; height: 32px; }
.app-rte-body { padding: var(--app-space-3); font-size: var(--app-font-md); min-height: 72px; }
.app-radio-cards { display: grid; gap: var(--app-space-3); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.app-radio-card { display: flex; align-items: center; gap: var(--app-space-3); padding: var(--app-space-3); border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-md); font-size: var(--app-font-md); font-weight: 600; }
.app-radio-card.is-selected { border-color: var(--primary); background: var(--primary-lighten); }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--action-default); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.radio.is-on { border-color: var(--primary); }
.radio.is-on::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.radio.is-disabled { border-color: var(--divider); }
.check { width: 20px; height: 20px; border-radius: 4px; border: 2px solid var(--action-default); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.check.is-on { border-color: var(--primary); background: var(--primary); }
.check.is-on::after { content: ""; width: 5px; height: 10px; border: solid var(--primary-text); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.check.is-disabled { border-color: var(--divider); }
.check.is-disabled.is-on { background: var(--text-secondary); border-color: var(--text-secondary); }
.radio.is-disabled.is-on::after { background: var(--text-secondary); }

/* option rows: today's look (keycap rows are F-149) */
.app-item-rows { list-style: none; padding: 0; margin: 0; }
.app-item-row { display: flex; align-items: center; gap: var(--app-space-3); padding: var(--app-space-2) var(--app-space-3); border: 1px solid var(--divider); border-radius: var(--app-radius-md); }
.app-item-row + .app-item-row { margin-top: var(--app-space-2); }
.app-option-letter { width: 20px; font-weight: 800; text-align: center; }
.app-option-text { flex: 1; min-width: 0; padding: 6px var(--app-space-3); border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-md); font-size: var(--app-font-md); }
.app-option-text.is-disabled { border-color: var(--divider); color: var(--text-secondary); }
.app-options-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--app-space-3); margin-top: var(--app-space-3); }
.app-options-count { font-size: var(--app-font-xs); color: var(--text-secondary); }
.app-match { display: grid; grid-template-columns: 1fr 1fr; gap: var(--app-space-3); }

/* ---- AppFormActions ---- */
.app-form-actions { display: flex; justify-content: flex-end; align-items: center; gap: var(--app-space-2); margin-top: var(--app-space-5); }

/* ---- AppAlert (MudAlert filled, dense) ---- */
.app-alert { display: flex; align-items: flex-start; gap: var(--app-space-3); padding: var(--app-space-2) var(--app-space-3); border-radius: var(--app-radius-md);
  font-size: var(--app-font-md); line-height: 1.25rem; overflow-wrap: anywhere; }
.app-alert svg { margin-top: 1px; }
.app-alert-info { background: var(--info); color: var(--info-text); }
.app-alert-warning { background: var(--warning); color: var(--warning-text); }
.app-alert-error { background: var(--error); color: var(--error-text); }
.app-alert-success { background: var(--success); color: var(--success-text); }

/* ---- AppErrorSummary ---- */
.app-error-summary { display: flex; align-items: flex-start; gap: var(--app-space-3); padding: var(--app-space-3) var(--app-space-4); margin-bottom: var(--app-space-4);
  border: 1px solid var(--error); border-radius: var(--app-radius-md); }
.app-error-summary > svg { color: var(--error); }
.app-error-summary-title { font-weight: 600; font-size: var(--app-font-base); }
.app-error-summary ul { margin-top: var(--app-space-2); padding-left: var(--app-space-4); font-size: var(--app-font-md); }
.app-error-summary a { color: var(--link); }

/* ---- AppStatusChip ---- */
.app-status-chip { display: inline-flex; align-items: center; gap: var(--app-space-2); padding: var(--app-space-1) var(--app-space-3); border-radius: var(--app-radius-sm);
  border: 1px solid var(--lines-inputs); font-size: var(--app-font-xs); line-height: 1rem; white-space: nowrap; }
.app-status-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-secondary); }
.tone-success .app-status-chip-dot { background: var(--success); }
.tone-warning .app-status-chip-dot { background: var(--warning); }
.tone-error .app-status-chip-dot { background: var(--error); }
.tone-info .app-status-chip-dot { background: var(--info); }

/* ---- form + aside layout (F-43), with the F-126 cap ---- */
.app-form-layout { display: grid; gap: var(--app-space-4); align-items: start; grid-template-columns: minmax(0, 1fr); }
.is-wide .app-form-layout { grid-template-columns: minmax(0, 1fr) 20rem; }

/* AppFormAside: no background of its own (it sits on the page colour: the amber key may sit there, F-148 BR8). */
.app-form-aside { border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-4); }
/* F-126 fallback: beside the form the aside stays sticky and is capped at the room under the app bar; its content
   scrolls inside it. In the app: max-height: calc(100dvh - <app bar height> - 2 * space-4). Here --main-h is the
   frame's main area, so the cap follows the simulated viewport. Stacked: neither sticky nor capped. */
.is-wide .app-form-aside { position: sticky; top: var(--app-space-4); max-height: calc(var(--main-h) - 2 * var(--app-space-4)); overflow-y: auto; overscroll-behavior: contain; }
.app-form-aside-title { margin: 0 0 var(--app-space-3); font-size: var(--app-font-md); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); }
.app-form-aside-row + .app-form-aside-row { margin-top: var(--app-space-3); }
.app-form-aside-row-label { font-size: var(--app-font-xs); line-height: 1rem; color: var(--text-secondary); }
.app-form-aside-row-value { font-size: var(--app-font-sm); line-height: 1.125rem; overflow-wrap: anywhere; }
.app-form-aside-row-empty { color: var(--text-secondary); font-style: italic; }
.app-form-aside-checklist-title { margin: var(--app-space-4) 0 var(--app-space-2); font-size: var(--app-font-xs); color: var(--text-secondary); }
.app-form-aside-checklist { list-style: none; padding: 0; }
.app-form-aside-checklist li { display: flex; align-items: center; gap: var(--app-space-2); font-size: var(--app-font-sm); line-height: 1.125rem; }
.app-form-aside-checklist li + li { margin-top: var(--app-space-1); }
.app-form-aside-checklist svg { width: 18px; height: 18px; color: var(--action-default); }
.app-form-aside-checklist .is-done svg { color: var(--success); }

/* F-126 content slot: a divider, then the block. */
.app-form-aside-content { margin-top: var(--app-space-4); padding-top: var(--app-space-4); border-top: 1px solid var(--divider); }
.app-form-aside-subtitle { margin: calc(-1 * var(--app-space-2)) 0 var(--app-space-3); font-size: var(--app-font-xs); line-height: 1rem; color: var(--text-secondary); }
.app-publication-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--app-space-2) var(--app-space-3); font-size: var(--app-font-sm); line-height: 1.125rem; }
.app-publication-annulment { margin-top: var(--app-space-3); font-size: var(--app-font-sm); line-height: 1.125rem; overflow-wrap: anywhere; }
.app-publication-annulment p + p { margin-top: var(--app-space-1); }
.app-form-aside-content .app-alert { margin-bottom: 0; margin-top: var(--app-space-3); }
.app-form-aside-content .app-alert.is-first { margin-top: 0; margin-bottom: var(--app-space-3); }
.app-publication-actions { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--app-space-2); margin-top: var(--app-space-4); }
/* Beside the form: one button per line, full width, 12px apart (room for the amber key's 4px edge). */
.is-wide .app-publication-actions { flex-direction: column; align-items: stretch; gap: var(--app-space-3); }
.is-wide .app-publication-actions .btn,
.is-wide .app-publication-actions .app-action,
.is-wide .app-publication-actions .app-action-key { width: 100%; }
.app-publication-reason { margin-top: var(--app-space-2); font-size: var(--app-font-xs); line-height: 1rem; color: var(--text-secondary); }
.app-publication-change-reason { margin-top: var(--app-space-4); }

/* ---- tables (history cards) ---- */
.app-table { width: 100%; border-collapse: collapse; font-size: var(--app-font-md); }
.app-table th { text-align: left; font-size: var(--app-font-xs); font-weight: 800; color: var(--text-secondary); padding: var(--app-space-2) var(--app-space-3); border-bottom: 1px solid var(--divider); }
.app-table td { padding: var(--app-space-2) var(--app-space-3); border-bottom: 1px solid var(--divider); vertical-align: top; overflow-wrap: anywhere; }
.app-empty { font-size: var(--app-font-md); color: var(--text-secondary); }

/* ---- states ---- */
.app-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--app-space-3); padding: var(--app-space-7) var(--app-space-4); text-align: center; }
.app-state .spinner { width: 36px; height: 36px; border-width: 3px; color: var(--primary); }
.app-link { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }

/* ---- transcription header ---- */
.transcribe-head { display: flex; align-items: center; gap: var(--app-space-4); flex-wrap: wrap; }
.transcribe-head > div { flex: 1; min-width: 0; }
.transcribe-edition { font-weight: 800; }
.transcribe-counter { font-size: var(--app-font-md); color: var(--text-secondary); }

/* ---- snackbar (bottom right) ---- */
.snackbar { position: absolute; right: var(--app-space-5); bottom: var(--app-space-5); display: flex; align-items: center; gap: var(--app-space-3);
  min-width: 280px; max-width: 420px; padding: var(--app-space-2) var(--app-space-2) var(--app-space-2) var(--app-space-4); border-radius: var(--app-radius-md);
  background: var(--success); color: var(--success-text); font-size: var(--app-font-md); z-index: 5; }
.snackbar span { flex: 1; }
.snackbar .icon-btn { color: var(--success-text); }

    : (o.hint ? `<span class="app-field-hint" id="${o.id}-desc">${esc(o.hint)}</span>` : '');
  return `<div class="app-field">
    <label class="app-field-label" for="${o.id}">${esc(o.label)}${o.required ? ' <span class="app-field-required" aria-hidden="true">*</span>' : ''}</label>
    <div class="${cls.join(' ')}" id="${o.id}" tabindex="${o.disabled ? -1 : 0}" role="${o.kind === 'text' ? 'textbox' : 'combobox'}" aria-disabled="${!!o.disabled}" aria-describedby="${o.id}-desc">${lead}<span>${esc(o.value || o.placeholder || '')}</span>${tail}</div>
    ${desc}
  </div>`;
}
function rte(o) {
  return `<div class="app-field">
    <span class="app-field-label" id="${o.id}-label">${esc(o.label)}${o.required ? ' <span class="app-field-required" aria-hidden="true">*</span>' : ''}</span>
    <div class="app-rte${o.disabled ? ' is-disabled' : ''}">
      <div class="app-rte-toolbar" aria-hidden="true"><span class="icon-btn">${ic('bold')}</span><span class="icon-btn">${ic('italic')}</span><span class="icon-btn">${ic('list')}</span></div>
      <div class="app-rte-body" lang="pt-BR" role="textbox" aria-multiline="true" aria-labelledby="${o.id}-label" tabindex="${o.disabled ? -1 : 0}">${esc(o.value)}</div>
    </div>
    <span class="app-field-hint">${esc(o.hint)}</span>
  </div>`;
}
function btn(o) {
  const cls = ['btn', o.variant === 'filled' ? 'btn-filled' : o.variant === 'text' ? 'btn-text' : 'btn-outlined'];
  if (o.error) cls.push('is-error');
  const lead = o.busy ? '<span class="spinner" aria-hidden="true"></span>' : (o.icon ? ic(o.icon) : '');
  return `<button type="button" class="${cls.join(' ')}"${o.id ? ` id="${o.id}"` : ''}${o.disabled ? ' disabled' : ''}${o.describedBy ? ` aria-describedby="${o.describedBy}"` : ''}>${lead}<span>${esc(o.label)}</span></button>`;
}
function actionKey(o) {
  const icon = o.busy ? '<span class="spinner" aria-hidden="true"></span>' : `<span class="app-action-icon${o.flip ? ' is-flipped' : ''}" aria-hidden="true">${ic(o.icon)}</span>`;
  return `<span class="app-action app-action-compact${o.disabled ? ' app-action-disabled' : ''}">
    <button type="button" class="app-action-key" id="${o.id}"${o.disabled ? ' disabled' : ''}${o.describedBy ? ` aria-describedby="${o.describedBy}"` : ''}>${icon}<span>${esc(o.label)}</span></button>
  </span>`;
}
function alert(kind, text, extra) {
  const icon = kind === 'error' ? 'error' : kind === 'warning' ? 'warning' : kind === 'success' ? 'check' : 'info';
  return `<div class="app-alert app-alert-${kind}${extra && extra.cls ? ' ' + extra.cls : ''}" role="${kind === 'error' ? 'alert' : 'status'}"${extra && extra.id ? ` id="${extra.id}"` : ''}>${ic(icon)}<span>${esc(text)}</span></div>`;
}
function chip(status) {
  const tone = { Draft: '', Published: 'tone-success', InReview: 'tone-warning', Annulled: 'tone-error' }[status];
  return `<span class="app-status-chip ${tone}"><span class="app-status-chip-dot" aria-hidden="true"></span>${esc(t('Questions.Status.' + status))}</span>`;
}

/* ---- the page ---- */
function renderDrawer() {
  const link = (icon, key, current) => `<a class="nav-link" href="#" onclick="return false"${current ? ' aria-current="page"' : ''}>${ic(icon)}<span>${esc(t(key))}</span></a>`;
  document.getElementById('drawer').innerHTML =
    link('home', 'Nav.Home') +
    `<span class="nav-section">${esc(t('Nav.Section.Content'))}</span>` +
    link('quiz', 'Nav.Exams') + link('quiz', 'Nav.Subjects') + link('quiz', 'Nav.Questions', true) + link('quiz', 'Nav.BaseTexts') + link('quiz', 'Nav.ReviewQueue') +
    `<span class="nav-section">${esc(t('Nav.Section.Administration'))}</span>` + link('quiz', 'Nav.Users');
}

function checklistItems(c) {
  const d = !c.saved && !c.transcribe ? false : true;   // new question: nothing filled yet
  const topicDone = d && !c.validation;
  const base = [['Questions.Checklist.Topic', topicDone], ['Questions.Checklist.Language', d], ['Questions.Checklist.Statement', d]];
  const keyDone = d && c.complete;
  const ty = S.type;
  if (ty === 'TrueFalse') return base.concat([['Questions.Checklist.TrueFalseKey', keyDone]]);
  if (ty === 'Matching') return base.concat([['Questions.Checklist.Matching.ItemsCount', d], ['Questions.Checklist.Matching.MatchesCount', d], ['Questions.Checklist.Matching.Key', keyDone]]);
  if (ty === 'FillInTheBlanks') return base.concat([['Questions.Checklist.Blanks.Count', d], ['Questions.Checklist.Blanks.Answers', keyDone]]);
  const multiple = ty === 'MultipleAnswer';
  return base.concat([[multiple ? 'Questions.Checklist.OptionsCount.Multiple' : 'Questions.Checklist.OptionsCount', d],
    ['Questions.Checklist.OptionsText', d], [multiple ? 'Questions.Checklist.Key.Multiple' : 'Questions.Checklist.Key', keyDone]]);
}

function asideRows(c) {
  const filled = c.saved || c.transcribe;
  const L = c.long ? DATA.long : DATA;
  const rows = [
    ['Questions.Field.Subject', filled ? (c.long ? L.subject : DATA.subject) : null],
    ['Questions.Field.Topic', filled && !c.validation ? (c.long ? L.topic : DATA.topic) : null],
    ['Questions.Field.ContentLanguage', filled ? DATA.language : null],
    ['Questions.Field.Difficulty', filled ? DATA.difficulty : null],
    ['Questions.Field.BaseText', null],
    ['Questions.Form.Aside.Source', filled ? (c.long ? L.edition : DATA.edition) : t('Questions.Source.Authored')]
  ];
  const ty = S.type;
  if (ty === 'TrueFalse' || ty === 'Matching' || ty === 'FillInTheBlanks') rows.push(['Questions.Form.Aside.Type', t('Questions.Type.' + ty)]);
  else rows.push(['Questions.Form.Aside.Options', t('Questions.Options.Count', filled ? '4' : '2')]);
  if (ty === 'MultipleAnswer') rows.push(['Questions.Form.Aside.Type', t('Questions.Type.' + ty)]);
  return rows;
}

function publicationBlock(c) {
  let h = `<div class="app-form-aside-content">
    <section id="question-section-publication" aria-labelledby="question-section-publication-title">
      <h2 class="app-form-aside-title" id="question-section-publication-title">${esc(t('Questions.Section.Publication'))}</h2>
      <p class="app-form-aside-subtitle">${esc(t('Questions.Section.Publication.Subtitle'))}</p>`;
  if (!c.saved) {
    h += `<p class="app-publication-row">${esc(t('Questions.Publication.SaveFirst'))}</p></section></div>`;
    return h;
  }
  if (c.pubError) h += alert('error', t('question.already_published'), { cls: 'is-first' });
  const statusText = c.status === 'Annulled' ? t('Questions.Publication.Annulled')
    : c.status === 'InReview' ? t('Questions.Publication.InReview', DATES[S.lang].sentReview)
    : c.status === 'Published' ? t('Questions.Publication.Published') : t('Questions.Publication.Draft');
  h += `<div class="app-publication-row">${chip(c.status)}<span>${esc(statusText)}</span></div>`;
  if (c.status === 'Annulled') {
    h += `<div class="app-publication-annulment"><p id="question-annulment-date">${esc(t('Questions.Annulment.Date', DATES[S.lang].annulled))}</p>
      <p id="question-annulment-reason">${esc(t('Questions.Annulment.Reason', DATA.annulment))}</p></div>`;
  }
  if (c.status === 'Draft' && c.rejected) {
    h += `<div id="question-rejected-alert">${alert('info', t('Questions.Publication.Rejected', DATES[S.lang].rejected, c.long ? DATA.rejectionLong : DATA.rejection))}</div>`;
  }
  const reason = c.hasChanges ? t('Questions.Publication.Publish.DisabledUnsaved') : (!c.complete ? t('Questions.Publication.Publish.DisabledIncomplete') : null);
  /* Owner decision (open point 4): the change-reason field sits above the buttons, so the reason is written before Publish. */
  if (c.status === 'Draft' && c.reasonAsked) {
    h += `<div class="app-publication-change-reason">${field({ id: 'question-publish-reason', kind: 'text', label: t('Questions.ChangeReason.Label'), required: true,
      value: '', placeholder: ' ', error: t('question.key_change_reason_required') }).replace('class="app-input', 'class="app-input is-multiline')}
      <span class="app-field-hint">${esc(t('Questions.ChangeReason.Hint'))}</span></div>`;
  }
  h += '<div class="app-publication-actions">';
  h += btn({ id: 'question-preview', icon: 'view', label: t('Questions.Action.Preview'), disabled: c.busy });
  if (c.status === 'Annulled') {
    h += btn({ id: 'question-reinstate', icon: 'retry', label: t('Questions.Action.Reinstate') });
  } else if (c.status === 'InReview') {
    h += btn({ id: 'question-withdraw', icon: 'undo', label: t('Questions.Action.Withdraw') });
  } else if (c.status === 'Published') {
    h += btn({ id: 'question-unpublish', icon: 'unpublish', label: t('Questions.Action.Unpublish') });
    h += btn({ id: 'question-annul', icon: 'archive', label: t('Questions.Action.Annul'), error: true, disabled: c.hasChanges, describedBy: c.hasChanges ? 'question-annul-reason-hint' : null });
  } else {
    const off = c.busy || reason !== null;
    h += btn({ id: 'question-send-for-review', icon: 'send', label: t('Questions.Action.SendForReview'), disabled: off, describedBy: reason ? 'question-publication-reason' : null });
    h += actionKey({ id: 'question-publish', icon: 'publish', flip: true, label: t('Questions.Action.Publish'), disabled: off, busy: c.busy, describedBy: reason ? 'question-publication-reason' : null });
  }
  h += '</div>';
  if (c.status === 'Draft' && reason) h += `<p id="question-publication-reason" class="app-publication-reason">${esc(reason)}</p>`;
  else if (c.status === 'Published' && c.hasChanges) h += `<p id="question-annul-reason-hint" class="app-publication-reason">${esc(t('Questions.Publication.Publish.DisabledUnsaved'))}</p>`;
  h += '</section></div>';
  return h;
}

function aside(c) {
  const rows = asideRows(c).map(([k, v]) => `<div class="app-form-aside-row"><dt class="app-form-aside-row-label">${esc(t(k))}</dt>
    <dd class="app-form-aside-row-value${v ? '' : ' app-form-aside-row-empty'}">${esc(v || t('Common.Summary.NotFilled'))}</dd></div>`).join('');
  const items = checklistItems(c).map(([k, done]) => `<li class="${done ? 'is-done' : ''}">${ic(done ? 'check' : 'pending')}<span>${esc(t(k))}</span>
    <span class="app-visually-hidden">${esc(t(done ? 'Common.Checklist.Done' : 'Common.Checklist.Pending'))}</span></li>`).join('');
  return `<aside class="app-form-aside" id="form-aside" aria-labelledby="app-form-aside-title">
    <h2 class="app-form-aside-title" id="app-form-aside-title">${esc(t('Questions.Form.Aside.Title'))}</h2>
    <dl class="app-form-aside-rows">${rows}</dl>
    <p class="app-form-aside-checklist-title">${esc(t('Questions.Form.Aside.Checklist'))}</p>
    <ul class="app-form-aside-checklist">${items}</ul>
    ${c.transcribe ? '' : publicationBlock(c)}
  </aside>`;
}

function keySection(c, frozen) {
  const ty = S.type;
  const filled = c.saved || c.transcribe;
  if (ty === 'TrueFalse') {
    const body = frozen
      ? `<div class="app-field"><span class="app-field-label">${esc(t('Questions.TrueFalseKey.Label'))}</span><span class="app-field-value">${esc(t('Questions.TrueFalse.False'))}</span></div>`
      : `<div class="app-field"><span class="app-field-label">${esc(t('Questions.TrueFalseKey.Label'))}</span><div class="app-radio-cards" role="radiogroup">
          <div class="app-radio-card" role="radio" aria-checked="false" tabindex="-1"><span class="radio"></span>${esc(t('Questions.TrueFalse.True'))}</div>
          <div class="app-radio-card${c.complete ? ' is-selected' : ''}" role="radio" aria-checked="${c.complete}" tabindex="0"><span class="radio${c.complete ? ' is-on' : ''}"></span>${esc(t('Questions.TrueFalse.False'))}</div></div></div>`;
    return sectionCard('question-section-true-false-key', 5, 'Questions.Section.TrueFalseKey', t('Questions.Section.TrueFalseKey.Subtitle'), body);
  }
  if (ty === 'Matching') {
    const left = ['1 — Mandado de segurança', '2 — Habeas data', '3 — Mandado de injunção'];
    const right = ['A — Direito líquido e certo', 'B — Informações pessoais', 'C — Falta de norma regulamentadora'];
    const col = (arr) => `<ul class="app-item-rows">${arr.map(x => `<li class="app-item-row"><span class="app-option-text${frozen ? ' is-disabled' : ''}">${esc(x)}</span></li>`).join('')}</ul>`;
    return sectionCard('question-section-matching', 5, 'Questions.Section.Matching', t('Questions.Section.Matching.Subtitle'), `<div class="app-match">${col(left)}${col(right)}</div>`);
  }
  if (ty === 'FillInTheBlanks') {
    const rows = [['1', 'paramilitar'], ['2', 'lícitos']];
    return sectionCard('question-section-blanks', 5, 'Questions.Section.Blanks', t('Questions.Section.Blanks.Subtitle'),
      `<ul class="app-item-rows">${rows.map(([n, a]) => `<li class="app-item-row"><span class="app-option-letter">${n}</span><span class="app-option-text${frozen ? ' is-disabled' : ''}">${esc(a)}</span></li>`).join('')}</ul>`);
  }
  const multiple = ty === 'MultipleAnswer';
  const opts = filled ? DATA.options : ['', ''];
  const rows = opts.map((o, i) => {
    const letter = String.fromCharCode(65 + i);
    const on = filled && c.complete && (multiple ? (i === 1 || i === 3) : i === DATA.correct);
    const actions = frozen ? '' : `<span class="icon-btn" aria-hidden="true">${ic('up')}</span><span class="icon-btn" aria-hidden="true">${ic('down')}</span><span class="icon-btn" aria-hidden="true">${ic('del')}</span>`;
    return `<li class="app-item-row"><span class="app-option-letter">${letter}</span><span class="${multiple ? 'check' : 'radio'}${on ? ' is-on' : ''}${frozen ? ' is-disabled' : ''}" aria-hidden="true"></span>
      <span class="app-option-text${frozen ? ' is-disabled' : ''}" lang="pt-BR">${esc(o || t('Questions.Options.Field.Placeholder'))}</span>${actions}</li>`;
  }).join('');
  const footer = `<div class="app-options-footer">${frozen ? '<span></span>' : btn({ id: 'question-option-add', icon: 'add', label: t('Questions.Options.Add') })}
    <span class="app-options-count">${esc(t('Questions.Options.Count', String(opts.length)))}</span></div>`;
  return sectionCard('question-section-options', 5, 'Questions.Section.Options',
    t(multiple ? 'Questions.Section.Options.Multiple.Subtitle' : 'Questions.Section.Options.Subtitle'), `<ul class="app-item-rows">${rows}</ul>${footer}`);
}

function formCard(c) {
  const frozen = c.status === 'InReview' || c.status === 'Annulled';
  const filled = c.saved || c.transcribe;
  const L = c.long ? DATA.long : DATA;
  let h = '<div class="app-form-card">';
  if (c.validation) {
    h += `<div class="app-error-summary" role="alert" tabindex="-1">${ic('error')}<div><p class="app-error-summary-title">${esc(t('Common.ErrorSummary.Title'))}</p>
      <ul><li><a href="#question-topic" onclick="return false">${esc(t('Questions.Field.Topic'))}: ${esc(t('Questions.Field.Topic.Required'))}</a></li></ul></div></div>`;
  }
  if (c.status === 'Annulled') h += `<div id="question-annulled-alert" class="mb-4">${alert('warning', t('Questions.Annulled.Alert'))}</div>`;
  if (c.status === 'InReview') h += `<div id="question-in-review-alert" class="mb-4">${alert('warning', t('Questions.InReview.Alert'))}</div>`;

  /* 1 Classification */
  let s1 = '';
  if (filled && !c.transcribe) {
    s1 += `<div class="app-field mb-4"><span class="app-field-label">${esc(t('Questions.Field.Type'))}</span><span class="app-field-value">${esc(t('Questions.Type.' + S.type))}</span>
      <span class="app-field-hint">${esc(t('Questions.Type.ReadOnlyHint'))}</span></div>`;
  } else {
    s1 += `<div class="app-field mb-4"><span class="app-field-label">${esc(t('Questions.Field.Type'))} <span class="app-field-required" aria-hidden="true">*</span></span>
      <div class="app-radio-cards" role="radiogroup">${TYPES.map(([k]) => `<div class="app-radio-card${k === S.type ? ' is-selected' : ''}" role="radio" aria-checked="${k === S.type}" tabindex="${k === S.type ? 0 : -1}"><span class="radio${k === S.type ? ' is-on' : ''}"></span>${esc(t('Questions.Type.' + k))}</div>`).join('')}</div></div>`;
  }
  s1 += `<div class="app-form-grid">
    ${field({ id: 'question-subject', kind: 'lookup', label: t('Questions.Field.Subject'), required: true, value: filled ? L.subject : '', hint: t('Questions.Field.Subject.Hint'), disabled: frozen })}
    ${field({ id: 'question-topic', kind: 'lookup', label: t('Questions.Field.Topic'), required: true, value: filled && !c.validation ? L.topic : '', hint: t('Questions.Field.Topic.Hint'), disabled: frozen || !filled, error: c.validation ? t('Questions.Field.Topic.Required') : null })}
    ${field({ id: 'question-content-language', kind: 'select', label: t('Questions.Field.ContentLanguage'), required: true, value: filled ? DATA.language : '', hint: t('Questions.Field.ContentLanguage.Hint'), disabled: frozen })}
    ${field({ id: 'question-difficulty', kind: 'select', label: t('Questions.Field.Difficulty'), value: filled ? DATA.difficulty : '', hint: t('Questions.Field.Difficulty.Hint'), disabled: frozen })}
  </div>`;
  h += sectionCard('question-section-classification', 1, 'Questions.Section.Classification', t('Questions.Section.Classification.Subtitle'), s1);

  /* 2 Origin */
  const s2 = `<div class="app-form-grid">
    ${field({ id: 'question-edition', kind: 'lookup', label: t('Questions.Field.Edition'), value: filled ? L.edition : '', hint: c.transcribe ? t('Questions.Transcribe.EditionLocked') : t('Questions.Field.Edition.Hint'), disabled: frozen || c.transcribe })}
    ${field({ id: 'question-paper-number', kind: 'text', label: t('Questions.Field.PaperNumber'), required: filled, value: filled ? DATA.paperNumber : '', hint: t('Questions.Field.PaperNumber.Hint'), disabled: frozen || !filled })}
    ${field({ id: 'question-notice-subject', kind: 'select', label: t('Questions.Field.NoticeSubject'), value: filled ? DATA.noticeSubject : '', hint: t('Questions.Field.NoticeSubject.Hint'), disabled: frozen || !filled })}
  </div>`;
  h += sectionCard('question-section-origin', 2, 'Questions.Section.Origin', t('Questions.Section.Origin.Subtitle'), s2);

  /* 3 Statement */
  h += sectionCard('question-section-statement', 3, 'Questions.Section.Statement', t('Questions.Section.Statement.Subtitle'),
    rte({ id: 'question-statement', label: t('Questions.Field.Statement'), required: true, value: filled ? DATA.statement : '', hint: t('Questions.Field.Statement.Hint'), disabled: frozen }));

  /* 4 Base text */
  h += sectionCard('question-section-base-text', 4, 'Questions.Section.BaseText', t('Questions.Section.BaseText.Subtitle'),
    field({ id: 'question-base-text', kind: 'lookup', label: t('Questions.Field.BaseText'), value: '', disabled: frozen }));

  /* 5 key section */
  h += keySection(c, frozen);

  /* 6 Explanation */
  h += sectionCard('question-section-explanation', 6, 'Questions.Section.Explanation', t('Questions.Section.Explanation.Subtitle'),
    rte({ id: 'question-explanation', label: t('Questions.Field.Explanation'), value: filled ? DATA.explanation : '', hint: t('Questions.Field.Explanation.Hint'), disabled: frozen }));

  if (!frozen) {
    const saveLabel = c.transcribe ? t('Questions.Transcribe.SaveAndContinue') : t('Common.Save');
    h += `<div class="app-form-actions">${btn({ variant: 'text', label: t('Common.Cancel'), disabled: c.saving })}
      <button type="button" class="btn btn-filled"${c.saving ? ' disabled' : ''}>${c.saving ? `<span class="spinner" aria-hidden="true"></span><span role="status">${esc(t('Common.Saving'))}</span>` : `<span>${esc(saveLabel)}</span>`}</button></div>`;
  }
  h += '</div>';
  return h;
}

function histories(c) {
  if (!c.saved || c.transcribe) return '';
  const d = DATES[S.lang];
  let reviews = [];
  if (c.status === 'Draft' && c.rejected) reviews = [[d.rejected, 'Rejected', c.long ? DATA.rejectionLong : DATA.rejection], [d.sent, 'Submitted', '—']];
  if (c.status === 'InReview') reviews = [[d.sentReview, 'Submitted', '—']];
  if (c.status === 'Published' || c.status === 'Annulled') reviews = [[d.approved, 'Approved', '—'], [d.sent, 'Submitted', '—']];
  let h = '';
  if (reviews.length) {
    const tone = { Rejected: 'tone-error', Approved: 'tone-success', Submitted: 'tone-info' };
    const rows = reviews.map(([date, kind, reason]) => `<tr><td style="white-space:nowrap">${esc(date)}</td>
      <td><span class="app-status-chip ${tone[kind]}"><span class="app-status-chip-dot" aria-hidden="true"></span>${esc(t('Questions.ReviewHistory.Kind.' + kind))}</span></td><td lang="pt-BR">${esc(reason)}</td></tr>`).join('');
    h += `<div class="app-form-card mt-4"><section class="app-section-card" aria-labelledby="question-section-review-history-title">
      <header class="app-section-card-head"><span class="app-section-card-icon">${ic('check')}</span><div class="app-section-card-heading">
      <h2 class="app-section-card-title" id="question-section-review-history-title">${esc(t('Questions.Section.ReviewHistory'))}</h2>
      <p class="app-section-card-subtitle">${esc(t('Questions.Section.ReviewHistory.Subtitle'))}</p></div></header>
      <table class="app-table"><thead><tr><th>${esc(t('Questions.ReviewHistory.Column.Date'))}</th><th>${esc(t('Questions.ReviewHistory.Column.Event'))}</th><th>${esc(t('Questions.ReviewHistory.Column.Reason'))}</th></tr></thead><tbody>${rows}</tbody></table></section></div>`;
  }
  const published = c.status === 'Published' || c.status === 'Annulled';
  const vbody = published
    ? `<table class="app-table"><thead><tr><th>${esc(t('Questions.History.Column.Version'))}</th><th>${esc(t('Questions.History.Column.Date'))}</th><th>${esc(t('Questions.History.Column.Reason'))}</th></tr></thead>
       <tbody><tr><td>1</td><td>${esc(d.v1)}</td><td>—</td></tr></tbody></table>`
    : `<p class="app-empty">${esc(t('Questions.History.Empty'))}</p>`;
  h += `<div class="app-form-card mt-4"><section class="app-section-card" aria-labelledby="question-section-history-title">
    <header class="app-section-card-head"><span class="app-section-card-icon">${ic('retry')}</span><div class="app-section-card-heading">
    <h2 class="app-section-card-title" id="question-section-history-title">${esc(t('Questions.Section.History'))}</h2>
    <p class="app-section-card-subtitle">${esc(t('Questions.Section.History.Subtitle'))}</p></div></header>${vbody}</section></div>`;
  return h;
}

function render() {
  const c = cfg(S.state);
  document.documentElement.lang = S.lang;
  document.documentElement.setAttribute('data-theme', S.theme);
  document.querySelectorAll('[data-k]').forEach(el => { el.textContent = t(el.getAttribute('data-k')); });
  document.getElementById('menu-btn').setAttribute('aria-label', 'Menu');
  renderDrawer();

  const titleKey = c.transcribe ? 'Questions.Transcribe.Title' : (c.saved || c.page !== 'form' ? 'Questions.Form.EditTitle' : 'Questions.Form.AddTitle');
  let h = `<div class="app-page-header"><nav class="app-breadcrumbs" aria-label="Breadcrumb"><a href="#" onclick="return false">${esc(t('Questions.Title'))}</a> › <span aria-current="page">${esc(t(titleKey))}</span></nav>
    <h1 class="app-page-title" tabindex="-1">${esc(t(titleKey))}</h1></div>`;

  if (c.page === 'loading') {
    h += `<div class="app-state" role="status"><span class="spinner" aria-hidden="true"></span><span>${esc(t('Common.Loading'))}</span></div>`;
  } else if (c.page === 'error') {
    h += `<div class="app-state">${ic('error', 'style="width:36px;height:36px;color:var(--error)"')}<p>${esc(t('Error.Title'))}</p>${btn({ icon: 'retry', label: t('Common.TryAgain') })}</div>`;
  } else if (c.page === 'notfound') {
    h += `<div class="app-form-card">${alert('error', t('question.not_found'), { cls: 'mb-4' })}<p class="mt-4"><a class="app-link" href="#" onclick="return false">${esc(t('Questions.BackToList'))}</a></p></div>`;
  } else if (c.page === 'denied') {
    h = `<div class="app-state"><h1 class="app-page-title">${esc(t('NotFound.Title'))}</h1><p>${esc(t('NotFound.Message'))}</p></div>`;
  } else {
    if (c.transcribe) {
      h += `<div class="app-form-card mb-4" id="question-transcribe-header"><div class="transcribe-head"><div>
        <p class="transcribe-edition" id="question-transcribe-edition">${esc(DATA.edition)}</p>
        <p class="transcribe-counter" id="question-transcribe-counter">${esc(t('Questions.Transcribe.Counter', '3'))}</p></div>
        ${btn({ id: 'question-transcribe-finish', label: t('Questions.Transcribe.Finish') })}</div></div>`;
    }
    h += `<div class="app-form-layout">${formCard(c)}${aside(c)}</div>`;
    h += histories(c);
  }
  document.getElementById('page').innerHTML = h;

  document.getElementById('snackbar-host').innerHTML = c.snackbar
    ? `<div class="snackbar" role="status">${ic('check')}<span>${esc(t('Questions.Published'))}</span><button type="button" class="icon-btn" aria-label="${esc(t('Common.Close'))}">${ic('close')}</button></div>` : '';

  renderDemo();
  requestAnimationFrame(layout);
}

/* ---- viewport simulation and the measured aside ---- */
function layout() {
  const frame = document.getElementById('frame');
  const main = document.getElementById('main');
  frame.className = 'frame vp-' + S.vp;
  const wide = frame.clientWidth >= 1280;
  frame.classList.toggle('is-wide', wide);
  frame.classList.toggle('is-narrow', !wide);
  frame.style.setProperty('--main-h', main.clientHeight + 'px');
  requestAnimationFrame(() => {
    const a = document.getElementById('form-aside');
    const out = document.getElementById('demo-readout');
    if (!a) { out.textContent = 'No aside in this state.'; return; }
    if (wide) {
      const room = main.clientHeight - 32;
      out.textContent = `Frame ${frame.clientWidth}×${frame.clientHeight}: beside the form, sticky. Aside content ${a.scrollHeight}px, room under the app bar ${room}px → ` +
        (a.scrollHeight > a.clientHeight + 1 ? `capped at ${a.clientHeight}px, scrolls inside (fallback).` : 'fits, no inner scroll.');
    } else {
      out.textContent = `Frame ${frame.clientWidth}×${frame.clientHeight}: below 1280px, the aside is stacked under the form, before the histories; not sticky, not capped (aside ${a.scrollHeight}px).`;
    }
  });
}

function renderDemo() {
  const group = (id, items, key) => {
    const el = document.getElementById(id);
    el.querySelectorAll('button').forEach(b => b.remove());
    items.forEach(([v, label]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label; b.setAttribute('aria-pressed', String(S[key] === v));
      b.addEventListener('click', () => { S[key] = v; render(); });
      el.appendChild(b);
    });
  };
  group('demo-states', STATES, 'state');
  group('demo-type', TYPES, 'type');
  group('demo-vp', VPS, 'vp');
  group('demo-theme', [['light', 'Light'], ['dark', 'Dark']], 'theme');
  group('demo-lang', [['pt-BR', 'pt-BR'], ['pt-PT', 'pt-PT'], ['en', 'en']], 'lang');
}

window.addEventListener('resize', () => requestAnimationFrame(layout));
render();
</script>
