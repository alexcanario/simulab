<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-95 - Single-choice questions in the back office (mockup)</title>
<style>
/* ===========================================================================
   F-95 mockup - /admin/questions, /admin/questions/new|{id}, kit AppRichTextField
   Every colour is a token of docs/design/identity.tokens.json (light and dark).
   Classes mirror the kit (app.css): app-page-header, app-data-table, app-row-actions,
   app-section-card, app-form-grid, app-field, app-item-rows, app-form-aside, app-status-chip,
   app-state, app-alert, app-error-summary, app-form-actions. New: app-rich-text, app-option-*.
   No external request: no web font, no icon font, no image, no script.
   =========================================================================== */
:root {
  --app-font-xs: 0.75rem; --app-font-sm: 0.8125rem; --app-font-md: 0.9375rem;
  --app-font-lg: 1.0625rem; --app-font-xl: 1.25rem; --app-font-xxl: 1.75rem;
  --app-space-1: 4px; --app-space-2: 8px; --app-space-3: 12px; --app-space-4: 16px; --app-space-5: 24px; --app-space-6: 32px;
  --app-radius-md: 10px; --app-radius-pill: 999px;

  /* tokens, light */
  --primary: #216DB5; --primary-darken: #1858A0; --primary-lighten: #EBF3FD; --primary-contrast: #FFFFFF;
  --success: #1A9E8C; --success-contrast: #19243E;
  --warning: #D98B1A; --info: #2478C5;
  --error: #BE3737; --error-contrast: #FFFFFF;
  --background: #F2F5FB; --surface: #FFFFFF;
  --drawer: #0F3266; --drawer-text: rgba(255,255,255,0.918); --appbar: #0F3266; --appbar-text: #FFFFFF;
  --text-primary: #19243E; --text-secondary: #4A5A7A; --action-default: #4A5A7A;
  --lines-inputs: #7E8AA1; --table-lines: #D0D8EA; --divider: #D0D8EA;
}
[data-theme="dark"] {
  --primary: #64A2E3; --primary-darken: #5096DC; --primary-lighten: #162540; --primary-contrast: #19243E;
  --success: #1A9E8C; --success-contrast: #19243E;
  --warning: #D98B1A; --info: #2478C5;
  --error: #E06C6C; --error-contrast: #19243E;
  --background: #0E1828; --surface: #172035;
  --drawer: #091422; --drawer-text: rgba(255,255,255,0.498); --appbar: #091422; --appbar-text: rgba(255,255,255,0.7);
  --text-primary: #E0E8F8; --text-secondary: #7A8EB0; --action-default: #7A8EB0;
  --lines-inputs: #61718F; --table-lines: #263352; --divider: #263352;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: var(--app-font-md); line-height: 1.65;
  background: var(--background); color: var(--text-primary);
  display: flex; flex-direction: column;
}
svg { display: inline-block; flex-shrink: 0; vertical-align: middle; fill: currentColor; }
a { color: var(--primary); }
button { font: inherit; color: inherit; }
:is(a, button, input, select, textarea, [tabindex], [contenteditable]):focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.app-visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }
.app-muted { color: var(--text-secondary); }

/* ---- demo chrome (not part of the product) ---- */
.demo { display: flex; flex-wrap: wrap; align-items: center; gap: var(--app-space-2); padding: var(--app-space-2) var(--app-space-4);
  background: var(--surface); border-bottom: 1px dashed var(--divider); font-size: var(--app-font-xs); }
.demo-label { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin-left: var(--app-space-2); }
.demo button { font-size: var(--app-font-xs); font-weight: 600; padding: 3px 10px; border-radius: 20px; cursor: pointer;
  border: 1px solid var(--lines-inputs); background: var(--surface); color: var(--text-primary); }
.demo button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-contrast); }
.demo-note { width: 100%; color: var(--text-secondary); }

/* ---- app shell (F-2) ---- */
.appbar { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: var(--app-space-3); padding: 0 var(--app-space-4); background: var(--appbar); color: var(--appbar-text); }
.brand { font-weight: 700; letter-spacing: .09em; }
.spacer { flex: 1; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--success); color: var(--success-contrast); display: flex; align-items: center; justify-content: center; font-size: var(--app-font-xs); font-weight: 700; }
.lay { flex: 1; display: flex; min-height: 0; }
.drawer { width: 260px; flex-shrink: 0; background: var(--drawer); color: var(--drawer-text); padding: var(--app-space-3) var(--app-space-2); }
.nav-section { display: block; padding: var(--app-space-4) var(--app-space-3) var(--app-space-1); font-size: var(--app-font-xs); text-transform: uppercase; letter-spacing: .06em; opacity: .8; }
.nav-link { display: flex; align-items: center; gap: var(--app-space-3); padding: var(--app-space-2) var(--app-space-3); border-left: 3px solid transparent; border-radius: 6px; font-size: var(--app-font-sm); cursor: pointer; color: inherit; text-decoration: none; }
.nav-link:hover { background: rgba(255,255,255,.08); }
.nav-link[aria-current="page"] { background: rgba(255,255,255,.14); border-left-color: var(--primary); font-weight: 600; }
.main { flex: 1; overflow-y: auto; padding: var(--app-space-5); min-width: 0; }
@media (max-width: 959.98px) { .drawer { display: none; } .main { padding: var(--app-space-4); } }

/* ---- AppPageHeader ---- */
.app-page-header { margin-bottom: var(--app-space-5); }
.app-breadcrumbs { font-size: var(--app-font-sm); color: var(--text-secondary); padding-bottom: var(--app-space-1); }
.app-page-header-row { display: flex; align-items: center; justify-content: space-between; gap: var(--app-space-3); flex-wrap: wrap; }
.app-page-title { font-size: var(--app-font-xxl); font-weight: 700; line-height: 1.2; }

/* ---- buttons (MudButton variants) ---- */
.app-button { font-size: var(--app-font-sm); font-weight: 600; cursor: pointer; min-height: 38px; padding: 0 var(--app-space-4); border-radius: var(--app-radius-md);
  display: inline-flex; align-items: center; gap: var(--app-space-2); border: 1px solid transparent; background: transparent; text-transform: none; }
.app-button-filled { background: var(--primary); color: var(--primary-contrast); }
.app-button-filled:hover { background: var(--primary-darken); }
.app-button-outlined { border-color: var(--primary); color: var(--primary); }
.app-button-outlined:hover { background: var(--primary-lighten); }
.app-button-text { color: var(--text-primary); }
.app-button-text:hover { background: var(--primary-lighten); }
.app-button-error { background: var(--error); color: var(--error-contrast); }
.app-button[disabled], .app-button[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.app-icon-button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: var(--action-default); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.app-icon-button:hover { background: var(--primary-lighten); }
.app-icon-button.is-error { color: var(--error); }
.app-icon-button[disabled] { opacity: .4; cursor: not-allowed; }
.app-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin .9s linear infinite; }
.app-spinner-lg { width: 36px; height: 36px; border-width: 3px; color: var(--primary); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- AppDataTable ---- */
.app-data-table { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); overflow: hidden; }
.app-table-toolbar { display: flex; align-items: flex-end; gap: var(--app-space-3); padding: var(--app-space-3) var(--app-space-4); flex-wrap: wrap; }
.app-table-search { flex: 1 1 18rem; }
.app-table-filters { display: flex; gap: var(--app-space-3); }
.app-table-filters .app-field { width: 12rem; margin: 0; }
.app-table { width: 100%; border-collapse: collapse; font-size: var(--app-font-sm); }
.app-table th { text-align: left; font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); padding: var(--app-space-2) var(--app-space-4); border-bottom: 1px solid var(--table-lines); }
.app-table td { padding: var(--app-space-2) var(--app-space-4); border-bottom: 1px solid var(--table-lines); vertical-align: middle; }
.app-table tbody tr:hover { background: var(--primary-lighten); }
.app-cell-number, th.app-cell-number { text-align: right; font-variant-numeric: tabular-nums; }
.app-cell-actions { text-align: right; white-space: nowrap; width: 1%; }
.app-cell-secondary { display: block; color: var(--text-secondary); font-size: var(--app-font-xs); }
.app-truncate { display: inline-block; max-width: 26rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
.app-truncate-sm { max-width: 14rem; }
.app-row-actions { display: inline-flex; gap: 2px; }
.app-pager { display: flex; justify-content: flex-end; align-items: center; gap: var(--app-space-4); padding: var(--app-space-2) var(--app-space-4); font-size: var(--app-font-xs); color: var(--text-secondary); }
.app-pager select { font: inherit; color: inherit; background: transparent; border: 0; }

/* ---- AppStatusChip ---- */
.app-status-chip { display: inline-flex; align-items: center; gap: var(--app-space-2); padding: 2px 10px; border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-pill); background: var(--surface); color: var(--text-primary); font-size: var(--app-font-xs); font-weight: 600; white-space: nowrap; }
.app-status-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-secondary); }
.app-status-chip-success .app-status-chip-dot { background: var(--success); }

/* ---- states ---- */
.app-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--app-space-3); padding: var(--app-space-6) var(--app-space-4); text-align: center; color: var(--text-secondary); }
.app-state-card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); }
.app-state-title { font-size: var(--app-font-xl); font-weight: 700; color: var(--text-primary); }
.app-state-error svg { color: var(--error); }

/* ---- AppAlert / AppErrorSummary ---- */
.app-alert { display: flex; gap: var(--app-space-3); align-items: flex-start; padding: var(--app-space-3) var(--app-space-4); border-radius: var(--app-radius-md); margin-bottom: var(--app-space-4); font-size: var(--app-font-sm); }
.app-alert-error { background: var(--error); color: var(--error-contrast); }
.app-alert-info { border: 1px solid var(--info); color: var(--text-primary); background: var(--surface); }
.app-alert-info svg { color: var(--info); }
.app-alert-title { font-weight: 700; }
.app-error-summary-list { margin: var(--app-space-1) 0 0; padding-left: var(--app-space-5); }
.app-error-summary-list a { color: inherit; }

/* ---- form layout ---- */
.app-form-layout { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: var(--app-space-4); align-items: start; }
@media (max-width: 1279.98px) { .app-form-layout { grid-template-columns: minmax(0, 1fr); } }
.app-form-card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-5); min-width: 0; }
.mt-4 { margin-top: var(--app-space-4); }
.app-section-card { border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-4); }
.app-section-card + .app-section-card { margin-top: var(--app-space-4); }
.app-section-card-head { display: flex; align-items: flex-start; gap: var(--app-space-3); margin-bottom: var(--app-space-4); }
.app-section-card-icon { color: var(--primary); margin-top: 3px; }
.app-section-card-title { font-size: var(--app-font-lg); font-weight: 600; color: var(--primary); }
.app-section-card-subtitle { font-size: var(--app-font-xs); color: var(--text-secondary); margin-top: var(--app-space-1); }
.app-form-grid { display: grid; gap: var(--app-space-3) var(--app-space-4); }
.app-form-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 599.98px) { .app-form-grid-2 { grid-template-columns: minmax(0, 1fr); } }

/* ---- fields ---- */
.app-field { margin-bottom: var(--app-space-4); min-width: 0; }
.app-form-grid .app-field { margin-bottom: 0; }
.app-field-label { display: block; font-size: var(--app-font-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--app-space-1); }
.app-field-required { color: var(--error); margin-left: 3px; }
.app-field-input { display: flex; align-items: center; gap: var(--app-space-2); height: 40px; padding: 0 var(--app-space-3); border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-md); background: var(--surface); color: var(--text-primary); }
.app-field-input:focus-within { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.app-field-input input, .app-field-input select { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; color: var(--text-primary); font: inherit; font-size: var(--app-font-md); }
.app-field-input input::placeholder { color: var(--text-secondary); }
.app-field-icon { color: var(--primary); }
.app-field-error .app-field-input { border-color: var(--error); }
.app-field-disabled .app-field-input { opacity: .55; }
.app-field-description { display: block; font-size: var(--app-font-xs); line-height: 1.45; margin-top: var(--app-space-1); min-height: 1.1em; }
.app-field-hint { color: var(--text-secondary); }
.app-field-error-text { color: var(--error); font-weight: 600; }

/* ---- AppRichTextField (new, F-95) ---- */
.app-rich-text-frame { border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-md); background: var(--surface); overflow: hidden; }
.app-rich-text-frame:focus-within, .app-rich-text-frame.is-focused { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.app-field-error .app-rich-text-frame { border-color: var(--error); }
.app-rich-text-disabled .app-rich-text-frame { opacity: .55; }
.app-rt-toolbar { display: flex; flex-wrap: wrap; gap: 2px; padding: var(--app-space-1) var(--app-space-2); border-bottom: 1px solid var(--divider); }
.app-rt-btn { width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--action-default); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.app-rt-btn:hover { background: var(--primary-lighten); }
.app-rt-btn[aria-pressed="true"] { background: var(--primary-lighten); color: var(--primary); }
.app-rt-sep { width: 1px; background: var(--divider); margin: 4px var(--app-space-1); }
.app-rt-editor { padding: var(--app-space-2) var(--app-space-3); min-height: 7.5rem; outline: none; font-size: var(--app-font-md); overflow-wrap: anywhere; }
.app-rich-text-compact .app-rt-editor { min-height: 2.5rem; padding: 6px var(--app-space-3); }
.app-rt-editor:empty::before, .app-rt-editor.is-empty::before { content: attr(data-placeholder); color: var(--text-secondary); }
.app-rt-editor p + p, .app-rt-editor ul, .app-rt-editor ol { margin-top: var(--app-space-2); }
.app-rt-editor ul, .app-rt-editor ol { padding-left: var(--app-space-5); }
.app-rt-editor blockquote { border-left: 3px solid var(--lines-inputs); padding-left: var(--app-space-3); color: var(--text-secondary); margin-top: var(--app-space-2); }
.app-rt-editor table { border-collapse: collapse; margin-top: var(--app-space-2); }
.app-rt-editor th, .app-rt-editor td { border: 1px solid var(--divider); padding: 2px 8px; }
.app-rt-editor th { color: var(--text-secondary); font-size: var(--app-font-sm); }

/* ---- option rows (AppItemRows + letter badge + MudRadio + compact editor + AppRowActions) ---- */
.app-item-rows-list { list-style: none; }
.app-item-row { display: flex; align-items: flex-start; gap: var(--app-space-3); padding: var(--app-space-2) 0; border-bottom: 1px solid var(--table-lines); }
.app-item-row:last-child { border-bottom: 0; }
.app-item-row-content { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: var(--app-space-2); }
.app-item-row-actions { flex: none; padding-top: 2px; }
.app-item-rows-empty { color: var(--text-secondary); font-size: var(--app-font-sm); padding: var(--app-space-2) 0; }
.app-option-letter { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--primary-lighten); color: var(--text-primary); font-weight: 700; font-size: var(--app-font-sm); display: inline-flex; align-items: center; justify-content: center; margin-top: 6px; }
.app-option-radio { flex: none; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; }
.app-option-radio input { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; margin: 0; }
.app-option-row .app-field { flex: 1; margin: 0; }
.app-options-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--app-space-3); margin-top: var(--app-space-3); flex-wrap: wrap; }
.app-options-count { font-size: var(--app-font-sm); color: var(--text-secondary); }
@media (max-width: 699.98px) { .app-item-row { flex-wrap: wrap; } .app-item-row-actions { width: 100%; text-align: right; } }

/* ---- AppFormActions ---- */
.app-form-actions { display: flex; justify-content: flex-end; align-items: center; gap: var(--app-space-2); margin-top: var(--app-space-5); }

/* ---- AppFormAside ---- */
.app-form-aside { position: sticky; top: var(--app-space-4); background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-4) var(--app-space-4) var(--app-space-3); }
.app-form-aside-title { font-size: var(--app-font-md); font-weight: 700; margin-bottom: var(--app-space-2); }
.app-form-aside-row { display: flex; justify-content: space-between; gap: var(--app-space-3); padding: var(--app-space-2) 0; border-bottom: 1px solid var(--divider); font-size: var(--app-font-sm); }
.app-form-aside-row:last-of-type { border-bottom: 0; }
.app-form-aside-row-label { color: var(--text-secondary); font-weight: 600; flex: none; }
.app-form-aside-row-value { text-align: right; overflow-wrap: anywhere; }
.app-form-aside-row-empty { color: var(--text-secondary); font-style: italic; }
.app-form-aside-checklist-title { font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin: var(--app-space-4) 0 var(--app-space-2); }
.app-form-aside-checklist { list-style: none; display: flex; flex-direction: column; gap: var(--app-space-2); }
.app-form-aside-checklist li { display: flex; align-items: center; gap: var(--app-space-2); font-size: var(--app-font-sm); }
.app-checklist-done svg { color: var(--success); }
.app-checklist-pending svg { color: var(--text-secondary); }

/* ---- publication card ---- */
.app-publication-row { display: flex; align-items: center; gap: var(--app-space-3); flex-wrap: wrap; font-size: var(--app-font-sm); }
.app-publication-actions { display: flex; gap: var(--app-space-2); margin-top: var(--app-space-4); flex-wrap: wrap; }
.app-publication-reason { font-size: var(--app-font-xs); color: var(--text-secondary); margin-top: var(--app-space-2); }

/* ---- preview dialog (MudDialog) and content ---- */
.app-dialog-backdrop { position: fixed; inset: 0; background: rgba(14,24,40,.55); display: flex; align-items: flex-start; justify-content: center; padding: var(--app-space-6) var(--app-space-4); z-index: 40; overflow-y: auto; }
.app-dialog { background: var(--surface); color: var(--text-primary); border-radius: var(--app-radius-md); width: 100%; max-width: 48rem; box-shadow: 0 8px 32px rgba(10,20,40,.35); }
.app-dialog-title { font-size: var(--app-font-xl); font-weight: 600; padding: var(--app-space-4) var(--app-space-5); border-bottom: 1px solid var(--divider); }
.app-dialog-content { padding: var(--app-space-5); }
.app-dialog-actions { display: flex; justify-content: flex-end; gap: var(--app-space-2); padding: var(--app-space-3) var(--app-space-5); border-top: 1px solid var(--divider); }
.app-question-content { overflow-wrap: anywhere; }
.app-question-content p + p { margin-top: var(--app-space-2); }
.app-question-content blockquote { border-left: 3px solid var(--lines-inputs); padding-left: var(--app-space-3); color: var(--text-secondary); margin: var(--app-space-2) 0; }
.app-question-content table { border-collapse: collapse; margin: var(--app-space-2) 0; }
.app-question-content th, .app-question-content td { border: 1px solid var(--divider); padding: 2px 8px; }
.app-question-content th { color: var(--text-secondary); font-size: var(--app-font-sm); }
.app-question-base { padding: var(--app-space-3) var(--app-space-4); border: 1px solid var(--divider); border-radius: var(--app-radius-md); margin-bottom: var(--app-space-4); font-size: var(--app-font-sm); }
.app-question-options { list-style: none; margin-top: var(--app-space-4); display: flex; flex-direction: column; gap: var(--app-space-2); }
.app-question-option { display: flex; gap: var(--app-space-3); align-items: flex-start; padding: var(--app-space-2) var(--app-space-3); border: 1px solid var(--divider); border-radius: var(--app-radius-md); }
.app-question-option.is-correct { border: 2px solid var(--success); }
.app-question-option .app-option-letter { margin-top: 0; }
.app-question-option-body { flex: 1; min-width: 0; }
.app-correct-label { display: inline-flex; align-items: center; gap: 4px; font-size: var(--app-font-xs); font-weight: 700; margin-top: var(--app-space-1); }
.app-correct-label svg { color: var(--success); }
.app-preview-answer { margin-top: var(--app-space-4); border-top: 1px solid var(--divider); padding-top: var(--app-space-4); }
.app-preview-heading { font-size: var(--app-font-sm); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); margin-bottom: var(--app-space-2); }

/* ---- snackbar ---- */
.app-snackbar { position: fixed; right: var(--app-space-5); bottom: var(--app-space-5); z-index: 50; display: flex; align-items: center; gap: var(--app-space-2); padding: var(--app-space-3) var(--app-space-4); border-radius: var(--app-radius-md); background: var(--success); color: var(--success-contrast); font-weight: 600; font-size: var(--app-font-sm); box-shadow: 0 4px 16px rgba(20,40,100,.25); }

/* ---- kit panel (gallery section) ---- */
.kit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); gap: var(--app-space-4); }
.kit-caption { font-size: var(--app-font-xs); color: var(--text-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: var(--app-space-2); }
</style>
</head>
<body>

<!-- ===================== demo chrome (not part of the product) ===================== -->
<div class="demo" id="demo">
  <span class="demo-label">Screen</span>
  <button type="button" data-screen="list" aria-pressed="true">List</button>
  <button type="button" data-screen="form">Form</button>
  <button type="button" data-screen="kit">Kit: AppRichTextField</button>
  <span class="demo-label">State</span>
  <span id="demo-states" style="display:contents"></span>
  <span class="demo-label">Language</span>
  <button type="button" data-lang="pt-BR" aria-pressed="true">pt-BR</button>
  <button type="button" data-lang="pt-PT">pt-PT</button>
  <button type="button" data-lang="en">en</button>
  <span class="demo-label">Theme</span>
  <button type="button" data-theme-btn="light" aria-pressed="true">Light</button>
  <button type="button" data-theme-btn="dark">Dark</button>
  <span class="demo-note" id="demo-note"></span>
</div>

<header class="appbar">
  <button type="button" class="app-icon-button" style="color:inherit" aria-label="Menu"><svg data-icon="menu" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"></svg></button>
  <span class="brand">SIMULAB</span>
  <span class="spacer"></span>
  <span class="avatar" aria-hidden="true">AC</span>
</header>

<div class="lay">
  <nav class="drawer" aria-label="Main">
    <span class="nav-section" data-i18n="Nav.Section.Content"></span>
    <a class="nav-link" href="#"><svg data-icon="exams" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"></svg><span data-i18n="Nav.Exams"></span></a>
    <a class="nav-link" href="#"><svg data-icon="subjects" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"></svg><span data-i18n="Nav.Subjects"></span></a>
    <!-- F-95: shown only with questions.manage -->
    <a class="nav-link" href="#" aria-current="page" id="nav-questions"><svg data-icon="questions" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"></svg><span data-i18n="Nav.Questions"></span></a>
  </nav>

  <main class="main" id="main">

    <!-- Permission denied: the not-found page (F-2 BR7), shared by both screens -->
    <div id="block-denied" hidden>
      <div class="app-state app-state-card">
        <svg data-icon="error" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"></svg>
        <h1 class="app-state-title" data-i18n="NotFound.Title"></h1>
        <p data-i18n="NotFound.Message"></p>
      </div>
    </div>

    <!-- =================================================================== -->
    <!-- SCREEN 1: /admin/questions                                           -->
    <!-- =================================================================== -->
    <section id="screen-list">
      <header class="app-page-header">
        <div class="app-breadcrumbs"><span data-i18n="Nav.Section.Content"></span> <span aria-hidden="true">/</span> <span data-i18n="Questions.Title"></span></div>
        <div class="app-page-header-row">
          <h1 class="app-page-title" data-i18n="Questions.Title"></h1>
          <button type="button" class="app-button app-button-filled"><svg data-icon="add" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"></svg><span data-i18n="Common.Add"></span></button>
        </div>
      </header>

      <div class="app-alert app-alert-error" role="alert" id="list-alert" hidden>
        <svg data-icon="error" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"></svg>
        <span data-i18n="question.delete_requires_draft"></span>
      </div>

      <div class="app-data-table">
        <div class="app-table-toolbar">
          <div class="app-field app-table-search">
            <label class="app-visually-hidden" for="list-search" data-i18n="Common.Search"></label>
            <div class="app-field-input"><svg class="app-field-icon" data-icon="search" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"></svg><input id="list-search" type="search" data-i18n-ph="Questions.Search.Placeholder" autocomplete="off"></div>
          </div>
          <div class="app-table-filters">
            <div class="app-field">
              <label class="app-field-label" for="questions-filter-status" data-i18n="Questions.Filter.Status"></label>
              <div class="app-field-input">
                <select id="questions-filter-status">
                  <option value="" data-i18n="Common.Filter.All"></option>
                  <option value="Draft" data-i18n="Questions.Status.Draft"></option>
                  <option value="Published" data-i18n="Questions.Status.Published"></option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div id="list-loading" hidden><div class="app-state" role="status" aria-live="polite"><span class="app-spinner app-spinner-lg" aria-hidden="true"></span><span data-i18n="Common.Loading"></span></div></div>
        <div id="list-error" hidden><div class="app-state app-state-error" role="alert"><svg data-icon="error" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"></svg><p data-i18n="Common.LoadFailed"></p><button type="button" class="app-button app-button-outlined"><svg data-icon="refresh" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"></svg><span data-i18n="Common.TryAgain"></span></button></div></div>
        <div id="list-empty" hidden><div class="app-state"><svg data-icon="inbox" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"></svg><p id="list-empty-text"></p><button type="button" class="app-button app-button-outlined" id="list-empty-action"><svg data-icon="add" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"></svg><span data-i18n="Common.Add"></span></button></div></div>

        <div id="list-ready">
          <table class="app-table">
            <thead>
              <tr>
                <th scope="col" data-i18n="Questions.Column.Statement"></th>
                <th scope="col" data-i18n="Questions.Column.Topic"></th>
                <th scope="col" class="app-cell-number" data-i18n="Questions.Column.Difficulty"></th>
                <th scope="col" data-i18n="Questions.Column.Language"></th>
                <th scope="col" data-i18n="Questions.Column.Status"></th>
                <th scope="col" class="app-cell-actions" data-i18n="Common.Actions"></th>
              </tr>
            </thead>
            <tbody id="list-rows"></tbody>
          </table>
          <div class="app-pager"><span><span data-i18n="Common.Table.RowsPerPage"></span> <select aria-label="Rows per page"><option>10</option><option selected>25</option><option>50</option></select></span><span id="list-pageinfo"></span></div>
        </div>
      </div>
      <div class="app-visually-hidden" role="status" aria-live="polite" id="list-live"></div>
    </section>

    <!-- =================================================================== -->
    <!-- SCREEN 2: /admin/questions/new and /admin/questions/{id}             -->
    <!-- =================================================================== -->
    <section id="screen-form" hidden>
      <header class="app-page-header">
        <div class="app-breadcrumbs"><span data-i18n="Nav.Section.Content"></span> <span aria-hidden="true">/</span> <a href="#" data-i18n="Questions.Title"></a> <span aria-hidden="true">/</span> <span id="form-crumb"></span></div>
        <div class="app-page-header-row"><h1 class="app-page-title" id="form-title"></h1></div>
      </header>

      <div id="f-loading" hidden><div class="app-state app-state-card" role="status" aria-live="polite"><span class="app-spinner app-spinner-lg" aria-hidden="true"></span><span data-i18n="Common.Loading"></span></div></div>

      <div id="f-notfound" hidden>
        <div class="app-form-card">
          <div class="app-alert app-alert-error" role="alert"><svg data-icon="error" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"></svg><span data-i18n="question.not_found"></span></div>
          <a href="#" data-i18n="Questions.BackToList"></a>
        </div>
      </div>

      <div id="f-body">
        <div class="app-form-layout">
          <form class="app-form-card" id="question-form" novalidate>

            <!-- AppErrorSummary -->
            <div class="app-alert app-alert-error" id="question-error-summary" role="alert" tabindex="-1" hidden>
              <svg data-icon="error" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"></svg>
              <div><div class="app-alert-title" data-i18n="Common.ErrorSummary.Title"></div><ul class="app-error-summary-list" id="error-summary-list"></ul></div>
            </div>
            <!-- AppAlert: a refusal that belongs to no field -->
            <div class="app-alert app-alert-error" id="f-server-alert" role="alert" hidden>
              <svg data-icon="error" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"></svg><span data-i18n="common.unexpected_error"></span>
            </div>

            <!-- 1. Classification -->
            <section class="app-section-card" aria-labelledby="question-section-classification-title">
              <header class="app-section-card-head">
                <svg class="app-section-card-icon" data-icon="topics" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"></svg>
                <div><h2 class="app-section-card-title" id="question-section-classification-title" data-i18n="Questions.Section.Classification"></h2><p class="app-section-card-subtitle" data-i18n="Questions.Section.Classification.Subtitle"></p></div>
              </header>
              <div class="app-form-grid app-form-grid-2">
                <div class="app-field" id="field-subject">
                  <label class="app-field-label" for="question-subject"><span data-i18n="Questions.Field.Subject"></span><span class="app-field-required" aria-hidden="true">*</span></label>
                  <div class="app-field-input"><svg class="app-field-icon" data-icon="subjects" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"></svg><input type="text" id="question-subject" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-haspopup="listbox" aria-required="true" aria-describedby="question-subject-description" autocomplete="off" data-i18n-ph="Questions.Field.Subject.Placeholder"></div>
                  <span class="app-field-description" id="question-subject-description"><span class="app-field-hint" data-i18n="Questions.Field.Subject.Hint"></span></span>
                </div>
                <div class="app-field" id="field-topic">
                  <label class="app-field-label" for="question-topic"><span data-i18n="Questions.Field.Topic"></span><span class="app-field-required" aria-hidden="true">*</span></label>
                  <div class="app-field-input"><svg class="app-field-icon" data-icon="topics" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"></svg><input type="text" id="question-topic" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-haspopup="listbox" aria-required="true" aria-describedby="question-topic-description" autocomplete="off" data-i18n-ph="Questions.Field.Topic.Placeholder"></div>
                  <span class="app-field-description" id="question-topic-description"><span class="app-field-hint" id="topic-hint"></span><span class="app-field-error-text" id="topic-error" hidden></span></span>
                </div>
                <div class="app-field" id="field-language">
                  <label class="app-field-label" for="question-content-language"><span data-i18n="Questions.Field.ContentLanguage"></span><span class="app-field-required" aria-hidden="true">*</span></label>
                  <div class="app-field-input"><svg class="app-field-icon" data-icon="language" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"></svg>
                    <select id="question-content-language" aria-required="true" aria-describedby="question-content-language-description">
                      <option value="pt-BR" lang="pt-BR">Português (Brasil)</option>
                      <option value="pt-PT" lang="pt-PT">Português (Portugal)</option>
                      <option value="en" lang="en">English</option>
                    </select></div>
                  <span class="app-field-description" id="question-content-language-description"><span class="app-field-hint" data-i18n="Questions.Field.ContentLanguage.Hint"></span></span>
                </div>
                <div class="app-field" id="field-difficulty">
                  <label class="app-field-label" for="question-difficulty"><span data-i18n="Questions.Field.Difficulty"></span></label>
                  <div class="app-field-input">
                    <select id="question-difficulty" aria-describedby="question-difficulty-description">
                      <option value="" data-i18n="Questions.Difficulty.NotSet"></option>
                      <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                    </select></div>
                  <span class="app-field-description" id="question-difficulty-description"><span class="app-field-hint" data-i18n="Questions.Field.Difficulty.Hint"></span></span>
                </div>
              </div>
            </section>

            <!-- 2. Statement -->
            <section class="app-section-card" aria-labelledby="question-section-statement-title">
              <header class="app-section-card-head">
                <svg class="app-section-card-icon" data-icon="questions" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"></svg>
                <div><h2 class="app-section-card-title" id="question-section-statement-title" data-i18n="Questions.Section.Statement"></h2><p class="app-section-card-subtitle" data-i18n="Questions.Section.Statement.Subtitle"></p></div>
              </header>
              <div id="rt-statement"></div>
            </section>

            <!-- 3. Base text -->
            <section class="app-section-card" aria-labelledby="question-section-base-text-title">
              <header class="app-section-card-head">
                <svg class="app-section-card-icon" data-icon="basetext" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"></svg>
                <div><h2 class="app-section-card-title" id="question-section-base-text-title" data-i18n="Questions.Section.BaseText"></h2><p class="app-section-card-subtitle" data-i18n="Questions.Section.BaseText.Subtitle"></p></div>
              </header>
              <div id="rt-base-text"></div>
            </section>

            <!-- 4. Options -->
            <section class="app-section-card" aria-labelledby="question-section-options-title">
              <header class="app-section-card-head">
                <svg class="app-section-card-icon" data-icon="options" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"></svg>
                <div><h2 class="app-section-card-title" id="question-section-options-title" data-i18n="Questions.Section.Options"></h2><p class="app-section-card-subtitle" data-i18n="Questions.Section.Options.Subtitle"></p></div>
              </header>
              <div class="app-item-rows" role="radiogroup" id="question-options" aria-labelledby="question-options-label" aria-describedby="question-options-description">
                <span class="app-visually-hidden" id="question-options-label" data-i18n="Questions.Options.Correct.Label"></span>
                <p class="app-item-rows-empty" id="options-empty" hidden data-i18n="Questions.Options.Empty"></p>
                <ul class="app-item-rows-list" id="options-list" aria-labelledby="question-section-options-title"></ul>
              </div>
              <span class="app-field-description" id="question-options-description"><span class="app-field-error-text" id="options-error" hidden></span></span>
              <div class="app-options-footer">
                <span><button type="button" class="app-button app-button-outlined" id="question-option-add"><svg data-icon="add" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"></svg><span data-i18n="Questions.Options.Add"></span></button></span>
                <span class="app-options-count" id="options-count"></span>
              </div>
              <div class="app-visually-hidden" role="status" aria-live="polite" id="options-live"></div>
            </section>

            <!-- 5. Explanation -->
            <section class="app-section-card" aria-labelledby="question-section-explanation-title">
              <header class="app-section-card-head">
                <svg class="app-section-card-icon" data-icon="explanation" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"></svg>
                <div><h2 class="app-section-card-title" id="question-section-explanation-title" data-i18n="Questions.Section.Explanation"></h2><p class="app-section-card-subtitle" data-i18n="Questions.Section.Explanation.Subtitle"></p></div>
              </header>
              <div id="rt-explanation"></div>
            </section>

            <!-- AppFormActions -->
            <div class="app-form-actions">
              <button type="button" class="app-button app-button-text" id="btn-cancel" data-i18n="Common.Cancel"></button>
              <button type="button" class="app-button app-button-filled" id="btn-save"><span class="app-spinner" id="save-spinner" hidden aria-hidden="true"></span><span id="save-label" role="status"></span></button>
            </div>
          </form>

          <!-- AppFormAside -->
          <aside class="app-form-aside" aria-labelledby="app-form-aside-title">
            <h2 class="app-form-aside-title" id="app-form-aside-title" data-i18n="Questions.Form.Aside.Title"></h2>
            <dl class="app-form-aside-rows" id="aside-rows"></dl>
            <p class="app-form-aside-checklist-title" data-i18n="Questions.Form.Aside.Checklist"></p>
            <ul class="app-form-aside-checklist" id="aside-checklist"></ul>
          </aside>
        </div>

        <!-- Publication card: outside the form, Save never publishes (BR12) -->
        <div class="app-form-card mt-4">
          <section class="app-section-card" aria-labelledby="question-section-publication-title">
            <header class="app-section-card-head">
              <svg class="app-section-card-icon" data-icon="publish" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"></svg>
              <div><h2 class="app-section-card-title" id="question-section-publication-title" data-i18n="Questions.Section.Publication"></h2><p class="app-section-card-subtitle" data-i18n="Questions.Section.Publication.Subtitle"></p></div>
            </header>
            <p id="pub-save-first" class="app-muted" style="font-size:var(--app-font-sm)" data-i18n="Questions.Publication.SaveFirst" hidden></p>
            <div id="pub-saved" hidden>
              <div class="app-alert app-alert-error" role="alert" id="pub-alert" hidden><svg data-icon="error" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"></svg><span data-i18n="question.key_invalid"></span></div>
              <div class="app-publication-row"><span id="pub-chip"></span><span id="pub-sentence"></span></div>
              <div class="app-publication-actions">
                <button type="button" class="app-button app-button-outlined" id="btn-preview"><svg data-icon="view" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"></svg><span data-i18n="Questions.Action.Preview"></span></button>
                <span id="pub-publish-wrap"><button type="button" class="app-button app-button-outlined" id="btn-publish"><svg data-icon="publish" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"></svg><span data-i18n="Questions.Action.Publish"></span></button></span>
                <button type="button" class="app-button app-button-outlined" id="btn-unpublish" hidden><svg data-icon="unpublish" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"></svg><span data-i18n="Questions.Action.Unpublish"></span></button>
              </div>
              <p class="app-publication-reason" id="pub-reason" hidden></p>
            </div>
          </section>
        </div>
      </div>
    </section>

    <!-- =================================================================== -->
    <!-- KIT: AppRichTextField states (gallery section Gallery.Section.RichText) -->
    <!-- =================================================================== -->
    <section id="screen-kit" hidden>
      <header class="app-page-header">
        <div class="app-breadcrumbs"><span data-i18n="Nav.Section.Development"></span> <span aria-hidden="true">/</span> <span data-i18n="Nav.Dev.UiKit"></span></div>
        <div class="app-page-header-row"><h1 class="app-page-title" data-i18n="Gallery.Section.RichText"></h1></div>
      </header>
      <div class="app-form-card">
        <div class="kit-grid" id="kit-grid"></div>
        <p class="app-muted" style="font-size:var(--app-font-xs);margin-top:var(--app-space-4)" data-i18n="RichText.Hint.Keyboard"></p>
      </div>
    </section>
  </main>
</div>

<!-- Preview dialog (MudDialog, MaxWidth.Medium) -->
<div class="app-dialog-backdrop" id="dialog" hidden>
  <div class="app-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="app-dialog-title" id="dialog-title" data-i18n="Questions.Preview.Title"></div>
    <div class="app-dialog-content" id="dialog-content"></div>
    <div class="app-dialog-actions"><button type="button" class="app-button app-button-text" id="dialog-close" data-i18n="Common.Close"></button></div>
  </div>
</div>

<div class="app-snackbar" id="snackbar" role="status" hidden><svg data-icon="verified" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"></svg><span id="snackbar-text"></span></div>

<script>

const chip = (status) => `<span class="app-status-chip ${status === "Published" ? "app-status-chip-success" : ""}"><span class="app-status-chip-dot" aria-hidden="true"></span>${t(status === "Published" ? "Questions.Status.Published" : "Questions.Status.Draft")}</span>`;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const iconBtn = (icon, labelKey, itemName, opts) => {
  opts = opts || {}; const label = t("Common.ActionOnItem", t(labelKey), itemName); const tip = opts.disabledReason || t(labelKey);
  return `<span title="${esc(tip)}"><button type="button" class="app-icon-button ${opts.error ? "is-error" : ""}" aria-label="${esc(label)}" ${opts.disabledReason || opts.disabled ? "disabled" : ""} ${opts.id ? `id="${opts.id}"` : ""} ${opts.onclick ? `data-action="${opts.onclick}"` : ""}>${svg(icon, 20)}</button></span>`;
};
function renderList() {
  document.getElementById("block-denied").hidden = listState !== "denied";
  const screen = document.getElementById("screen-list");
  screen.hidden = false;
  screen.querySelector(".app-page-header").hidden = listState === "denied";
  screen.querySelector(".app-data-table").hidden = listState === "denied";
  document.getElementById("nav-questions").hidden = listState === "denied";
  document.getElementById("list-alert").hidden = listState !== "action-error";
  document.getElementById("list-loading").hidden = listState !== "loading";
  document.getElementById("list-error").hidden = listState !== "error";
  const isEmpty = listState.startsWith("empty");
  document.getElementById("list-empty").hidden = !isEmpty;
  document.getElementById("list-ready").hidden = !(listState === "ready" || listState === "action-error");
  document.getElementById("list-empty-action").hidden = listState !== "empty";
  document.getElementById("list-empty-text").textContent = listState === "empty-search" ? t("Questions.Empty.Search", "fotossíntese") : listState === "empty-filter" ? t("Questions.Empty.Filters") : t("Questions.Empty");
  document.getElementById("list-search").value = listState === "empty-search" ? "fotossíntese" : "";
  document.getElementById("questions-filter-status").value = listState === "empty-filter" ? "Published" : "";
  document.getElementById("list-rows").innerHTML = LIST_ROWS.map(r => {
    const name = t("Questions.Row.Name", r.excerpt.length > 60 ? r.excerpt.slice(0, 60).trim() + "…" : r.excerpt);
    const diff = r.difficulty === null ? `<span aria-hidden="true">—</span><span class="app-visually-hidden">${t("Questions.Difficulty.NotSet.Spoken")}</span>` : r.difficulty;
    const more = r.status === "Published" ? iconBtn("unpublish", "Questions.Action.Unpublish", name) : iconBtn("publish", "Questions.Action.Publish", name);
    return `<tr>
      <td><span class="app-truncate" tabindex="0" title="${r.excerpt}" lang="${r.lang}">${r.excerpt}</span></td>
      <td><span class="app-truncate app-truncate-sm" title="${r.topic}">${r.topic}</span><span class="app-cell-secondary app-truncate app-truncate-sm" title="${r.subject}">${r.subject}</span></td>
      <td class="app-cell-number">${diff}</td>
      <td><span lang="${r.lang}">${LANG_NAMES[r.lang]}</span></td>
      <td>${chip(r.status)}</td>
      <td class="app-cell-actions"><div class="app-row-actions" role="group" aria-label="${t("Common.Actions")}">${iconBtn("edit", "Common.Edit", name)}${iconBtn("delete", "Common.Delete", name, { error: true, disabledReason: r.status === "Published" ? t("Questions.Delete.DisabledPublished") : null })}${more}</div></td>
    </tr>`; }).join("");
  document.getElementById("list-pageinfo").textContent = t("Common.Table.PageInfo", 1, 6, 6);
  document.getElementById("list-live").textContent = listState === "ready" ? t("Common.Table.Results.Many", 6) : isEmpty ? t("Common.Table.Results.None") : "";
}

/* ===========================================================================
   Screen 2: form
   =========================================================================== */
const formStates = ["loading", "new", "draft", "published", "options-none", "options-max", "publish-unsaved", "saving", "success", "validation", "server", "publish-refused", "notfound", "denied", "longtext", "preview", "preview-answer"];
let formState = "draft";
let model = null; // what the form holds in the current state

function clone(q) { return JSON.parse(JSON.stringify(q)); }
function modelFor(state) {
  switch (state) {
    case "new": return { status: null, subject: "", topic: "", lang: lang, difficulty: "", statement: "", baseText: "", options: [], correct: null, explanation: "", saved: false };
    case "published": case "publish-refused": return Object.assign(clone(Q_PUBLISHED), { saved: true });
    case "options-none": return Object.assign(clone(Q_DRAFT), { options: [], correct: null, saved: true });
    case "options-max": return Object.assign(clone(Q_DRAFT), { options: Q_DRAFT.options.concat(["<p>100 m</p>"]), saved: true });
    case "publish-unsaved": return Object.assign(clone(Q_DRAFT), { saved: true, dirty: true });
    case "validation": return { status: null, subject: "Matemática", topic: "", lang: lang, difficulty: "2", statement: "<p><br></p>", baseText: "", options: ["<p>20%</p>", ""], correct: null, explanation: "", saved: false };
    case "longtext": return Object.assign(clone(Q_LONG), { saved: true });
    default: return Object.assign(clone(Q_DRAFT), { saved: true });
  }
}
const plain = (html) => (html || "").replace(/<[^>]*>/g, "").replace(/&nbsp;/g, " ").trim();

function checklist(m) {
  const texts = m.options.map(plain);
  return [
    ["Questions.Checklist.Topic", !!m.topic],
    ["Questions.Checklist.Language", !!m.lang],
    ["Questions.Checklist.Statement", plain(m.statement).length > 0],
    ["Questions.Checklist.OptionsCount", m.options.length >= 2 && m.options.length <= 5],
    ["Questions.Checklist.OptionsText", m.options.length > 0 && texts.every(x => x.length > 0)],
    ["Questions.Checklist.Key", m.correct !== null && m.correct !== undefined && m.correct < m.options.length]
  ];
}

function renderOptions(m, errors) {
  const list = document.getElementById("options-list");
  document.getElementById("options-empty").hidden = m.options.length > 0;
  list.innerHTML = m.options.map((html, i) => {
    const L = LETTERS[i], name = t("Questions.Options.Letter", L);
    const err = errors && errors.options && errors.options[i] ? t(errors.options[i]) : "";
    return `<li class="app-item-row app-option-row" id="question-option-row-${i}">
      <div class="app-item-row-content">
        <span class="app-option-letter">${L}</span>
        <span class="app-option-radio"><input type="radio" name="question-correct" value="${i}" ${m.correct === i ? "checked" : ""} aria-label="${t("Questions.Options.MarkCorrect", L)}" ${formState === "saving" ? "disabled" : ""}></span>
        ${richText({ id: `question-option-${i}`, labelKey: "Questions.Options.Field", labelArg: L, hideLabel: true, placeholderKey: "Questions.Options.Field.Placeholder", value: html, error: err, compact: true, lang: m.lang, disabled: formState === "saving" })}
      </div>
      <div class="app-item-row-actions"><div class="app-row-actions" role="group" aria-label="${t("Common.Actions")}">
        ${iconBtn("moveup", "Common.MoveUp", name, { id: `question-option-actions-${i}-move-up`, disabledReason: i === 0 ? t("Questions.Options.MoveUp.DisabledFirst") : null, onclick: "up:" + i })}
        ${iconBtn("movedown", "Common.MoveDown", name, { id: `question-option-actions-${i}-move-down`, disabledReason: i === m.options.length - 1 ? t("Questions.Options.MoveDown.DisabledLast") : null, onclick: "down:" + i })}
        ${iconBtn("delete", "Common.Delete", name, { id: `question-option-actions-${i}-delete`, error: true, onclick: "remove:" + i })}
      </div></div>
    </li>`; }).join("");
  const add = document.getElementById("question-option-add");
  add.disabled = m.options.length >= 5 || formState === "saving";
  add.parentElement.title = m.options.length >= 5 ? t("Questions.Options.Add.DisabledMax") : "";
  document.getElementById("options-count").textContent = t("Questions.Options.Count", m.options.length);
  const optErr = document.getElementById("options-error");
  optErr.hidden = !(errors && errors.section); optErr.textContent = errors && errors.section ? t(errors.section) : "";
  document.getElementById("question-options").setAttribute("aria-invalid", errors && errors.section ? "true" : "false");
}
document.getElementById("options-list").addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b) return;
  const [act, idx] = b.dataset.action.split(":"); const i = +idx; const live = document.getElementById("options-live");
  if (act === "up" && i > 0) { [model.options[i - 1], model.options[i]] = [model.options[i], model.options[i - 1]]; if (model.correct === i) model.correct = i - 1; else if (model.correct === i - 1) model.correct = i; renderOptions(model); live.textContent = t("Questions.Options.Moved", i, model.options.length); document.getElementById(`question-option-actions-${i - 1}-move-${i - 1 === 0 ? "down" : "up"}`).focus(); }
  if (act === "down" && i < model.options.length - 1) { [model.options[i + 1], model.options[i]] = [model.options[i], model.options[i + 1]]; if (model.correct === i) model.correct = i + 1; else if (model.correct === i + 1) model.correct = i; renderOptions(model); live.textContent = t("Questions.Options.Moved", i + 2, model.options.length); document.getElementById(`question-option-actions-${i + 1}-move-${i + 1 === model.options.length - 1 ? "up" : "down"}`).focus(); }
  if (act === "remove") { model.options.splice(i, 1); if (model.correct === i) model.correct = null; else if (model.correct > i) model.correct--; renderOptions(model); live.textContent = t("Questions.Options.Removed", model.options.length); (document.getElementById(`question-option-actions-${Math.min(i, model.options.length - 1)}-delete`) || document.getElementById("question-option-add")).focus(); }
  renderAside(model); renderPublication(model);
});
document.getElementById("question-option-add").addEventListener("click", () => { if (model.options.length < 5) { model.options.push(""); renderOptions(model); renderAside(model); renderPublication(model); document.getElementById(`question-option-${model.options.length - 1}`).focus(); } });
document.getElementById("question-options").addEventListener("change", e => { if (e.target.name === "question-correct") { model.correct = +e.target.value; renderAside(model); renderPublication(model); } });

function renderAside(m) {
  const row = (label, value) => `<div class="app-form-aside-row"><dt class="app-form-aside-row-label">${label}</dt><dd class="app-form-aside-row-value ${value ? "" : "app-form-aside-row-empty"}">${value || t("Common.Summary.NotFilled")}</dd></div>`;
  document.getElementById("aside-rows").innerHTML =
    row(t("Questions.Form.Aside.Status"), m.status ? t(m.status === "Published" ? "Questions.Status.Published" : "Questions.Status.Draft") : "") +
    row(t("Questions.Field.Subject"), m.subject) + row(t("Questions.Field.Topic"), m.topic) +
    row(t("Questions.Field.ContentLanguage"), m.lang ? `<span lang="${m.lang}">${LANG_NAMES[m.lang]}</span>` : "") +
    row(t("Questions.Field.Difficulty"), m.difficulty ? String(m.difficulty) : "") +
    row(t("Questions.Form.Aside.Options"), m.options.length ? String(m.options.length) : "");
  document.getElementById("aside-checklist").innerHTML = checklist(m).map(([k, done]) =>
    `<li class="${done ? "app-checklist-done" : "app-checklist-pending"}">${svg(done ? "verified" : "pending", 18)}<span>${t(k)}</span><span class="app-visually-hidden">${t(done ? "Common.Checklist.Done" : "Common.Checklist.Pending")}</span></li>`).join("");
}

function renderPublication(m) {
  document.getElementById("pub-save-first").hidden = m.saved;
  document.getElementById("pub-saved").hidden = !m.saved;
  if (!m.saved) return;
  const published = m.status === "Published";
  document.getElementById("pub-chip").innerHTML = chip(m.status);
  document.getElementById("pub-sentence").textContent = t(published ? "Questions.Publication.Published" : "Questions.Publication.Draft");
  document.getElementById("pub-publish-wrap").hidden = published;
  document.getElementById("btn-unpublish").hidden = !published;
  document.getElementById("pub-alert").hidden = formState !== "publish-refused";
  const complete = checklist(m).every(x => x[1]);
  const reason = published ? null : m.dirty ? t("Questions.Publication.Publish.DisabledUnsaved") : !complete ? t("Questions.Publication.Publish.DisabledIncomplete") : null;
  const btn = document.getElementById("btn-publish"); btn.disabled = !!reason; btn.parentElement.title = reason || "";
  const r = document.getElementById("pub-reason"); r.hidden = !reason; r.textContent = reason || "";
}

function renderForm() {
  const s = formState;
  model = model && ["draft", "preview", "preview-answer", "saving", "success", "server"].includes(s) && model.saved && model.status === "Draft" ? model : modelFor(s);
  document.getElementById("block-denied").hidden = s !== "denied";
  const screen = document.getElementById("screen-form");
  screen.hidden = false;
  screen.querySelector(".app-page-header").hidden = s === "denied";
  document.getElementById("nav-questions").hidden = s === "denied";
  document.getElementById("f-loading").hidden = s !== "loading";
  document.getElementById("f-notfound").hidden = s !== "notfound";
  document.getElementById("f-body").hidden = ["loading", "notfound", "denied"].includes(s);
  const isNew = !model.saved;
  document.getElementById("form-title").textContent = t(isNew ? "Questions.Form.AddTitle" : "Questions.Form.EditTitle");
  document.getElementById("form-crumb").textContent = t(isNew ? "Questions.Form.AddTitle" : "Questions.Form.EditTitle");

  // errors of the validation state (client-side, before anything is sent)
  const errors = s === "validation" ? { topic: "Questions.Field.Topic.Required", statement: "question.statement_required", section: "question.key_invalid", options: { 1: "question.option_text_required" } } : {};

  // classification
  document.getElementById("question-subject").value = model.subject;
  const topic = document.getElementById("question-topic"); topic.value = model.topic; topic.disabled = !model.subject;
  document.getElementById("field-topic").classList.toggle("app-field-disabled", !model.subject);
  document.getElementById("field-topic").classList.toggle("app-field-error", !!errors.topic);
  document.getElementById("topic-hint").textContent = t(model.subject ? "Questions.Field.Topic.Hint" : "Questions.Field.Topic.DisabledHint");
  document.getElementById("topic-hint").hidden = !!errors.topic;
  const te = document.getElementById("topic-error"); te.hidden = !errors.topic; te.textContent = errors.topic ? t(errors.topic) : ""; topic.setAttribute("aria-invalid", errors.topic ? "true" : "false");
  document.getElementById("question-content-language").value = model.lang || lang;
  document.getElementById("question-difficulty").value = model.difficulty === null || model.difficulty === undefined ? "" : String(model.difficulty);

  const saving = s === "saving";
  document.getElementById("rt-statement").innerHTML = richText({ id: "question-statement", labelKey: "Questions.Field.Statement", placeholderKey: "Questions.Field.Statement.Placeholder", hintKey: "Questions.Field.Statement.Hint", required: true, value: plain(model.statement) ? model.statement : "", error: errors.statement ? t(errors.statement) : "", lang: model.lang, disabled: saving });
  document.getElementById("rt-base-text").innerHTML = richText({ id: "question-base-text", labelKey: "Questions.Field.BaseText", placeholderKey: "Questions.Field.BaseText.Placeholder", hintKey: "Questions.Field.BaseText.Hint", value: model.baseText, lang: model.lang, disabled: saving });
  document.getElementById("rt-explanation").innerHTML = richText({ id: "question-explanation", labelKey: "Questions.Field.Explanation", placeholderKey: "Questions.Field.Explanation.Placeholder", hintKey: "Questions.Field.Explanation.Hint", value: model.explanation, lang: model.lang, disabled: saving });
  renderOptions(model, errors);
  renderAside(model);
  renderPublication(model);

  // error summary
  const sum = document.getElementById("question-error-summary");
  sum.hidden = s !== "validation";
  if (s === "validation") {
    document.getElementById("error-summary-list").innerHTML = [["question-topic", t("Questions.Field.Topic")], ["question-statement", t("Questions.Field.Statement")], ["question-options", t("Questions.Section.Options")]].map(([id, lbl]) => `<li><a href="#${id}" data-focus="${id}">${lbl}</a></li>`).join("");
    setTimeout(() => sum.focus(), 0);
  }
  document.getElementById("f-server-alert").hidden = s !== "server";

  // actions
  document.getElementById("save-spinner").hidden = !saving;
  document.getElementById("save-label").textContent = t(saving ? "Common.Saving" : "Common.Save");
  document.getElementById("btn-save").disabled = saving; document.getElementById("btn-cancel").disabled = saving;
  document.querySelectorAll("#question-form input, #question-form select").forEach(el => { if (el.id !== "question-topic" || model.subject) el.disabled = saving; });

  // snackbar, dialog
  const snack = document.getElementById("snackbar"); snack.hidden = s !== "success"; document.getElementById("snackbar-text").textContent = t("Questions.Saved");
  if (s === "preview" || s === "preview-answer") openPreview(s === "preview-answer"); else document.getElementById("dialog").hidden = true;
}
document.getElementById("error-summary-list").addEventListener("click", e => { const a = e.target.closest("a[data-focus]"); if (a) { e.preventDefault(); const el = document.getElementById(a.dataset.focus); el && el.focus(); } });
document.getElementById("btn-preview").addEventListener("click", () => openPreview(false));
document.getElementById("dialog-close").addEventListener("click", () => { document.getElementById("dialog").hidden = true; document.getElementById("btn-preview").focus(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("dialog").hidden) document.getElementById("dialog-close").click(); });

function openPreview(revealed) {
  const m = model; const hasKey = m.correct !== null && m.correct !== undefined && m.correct < m.options.length;
  const c = document.getElementById("dialog-content");
  c.innerHTML = `
    ${m.dirty ? `<div class="app-alert app-alert-info" role="status">${svg("info", 20)}<span>${t("Questions.Preview.UnsavedNote")}</span></div>` : ""}
    <div lang="${m.lang}">
      ${plain(m.baseText) ? `<div class="app-question-base app-question-content">${m.baseText}</div>` : ""}
      <div class="app-question-content">${m.statement}</div>
      <ol class="app-question-options" aria-label="${t("Questions.Preview.Options")}">
        ${m.options.map((o, i) => `<li class="app-question-option ${revealed && hasKey && m.correct === i ? "is-correct" : ""}"><span class="app-option-letter">${LETTERS[i]}</span><div class="app-question-option-body"><div class="app-question-content">${o}</div>${revealed && hasKey && m.correct === i ? `<span class="app-correct-label">${svg("verified", 16)}${t("Questions.Preview.CorrectAnswer")}</span>` : ""}</div></li>`).join("")}
      </ol>
    </div>
    <div class="app-preview-answer">
      <button type="button" class="app-button app-button-outlined" id="btn-show-answer" aria-expanded="${revealed}" aria-controls="preview-answer-region">${svg("view", 18)}<span>${t(revealed ? "Questions.Preview.HideAnswer" : "Questions.Preview.ShowAnswer")}</span></button>
      <div id="preview-answer-region" role="region" aria-labelledby="preview-answer-heading" aria-live="polite" ${revealed ? "" : "hidden"} style="margin-top:var(--app-space-4)">
        <p class="app-preview-heading" id="preview-answer-heading">${t("Questions.Preview.Answer")}</p>
        <p>${hasKey ? `<strong>${LETTERS[m.correct]}</strong>` : t("Questions.Preview.NoKey")}</p>
        <p class="app-preview-heading" style="margin-top:var(--app-space-3)">${t("Questions.Preview.Explanation")}</p>
        <div class="app-question-content" lang="${m.lang}">${plain(m.explanation) ? m.explanation : `<span class="app-muted">${t("Questions.Preview.NoExplanation")}</span>`}</div>
      </div>
    </div>`;
  document.getElementById("dialog").hidden = false;
  document.getElementById("btn-show-answer").addEventListener("click", () => openPreview(!revealed));
  setTimeout(() => document.getElementById("btn-show-answer").focus(), 0);
}

    panel("kit.compact", `<ul class="app-item-rows-list"><li class="app-item-row app-option-row"><div class="app-item-row-content"><span class="app-option-letter">B</span><span class="app-option-radio"><input type="radio" name="kit-correct" checked aria-label="${t("Questions.Options.MarkCorrect", "B")}"></span>${richText({ id: "kit-compact", labelKey: "Questions.Options.Field", labelArg: "B", hideLabel: true, placeholderKey: "Questions.Options.Field.Placeholder", value: "<p>20 m</p>", compact: true })}</div><div class="app-item-row-actions"><div class="app-row-actions" role="group" aria-label="${t("Common.Actions")}">${iconBtn("moveup", "Common.MoveUp", t("Questions.Options.Letter", "B"))}${iconBtn("movedown", "Common.MoveDown", t("Questions.Options.Letter", "B"))}${iconBtn("delete", "Common.Delete", t("Questions.Options.Letter", "B"), { error: true })}</div></div></li></ul>`) +
    panel("kit.longtext", richText({ id: "kit-long", labelKey: "Questions.Field.BaseText", placeholderKey: "Questions.Field.BaseText.Placeholder", hintKey: "Questions.Field.BaseText.Hint", value: longWord }));
}

const NOTES = {

  "form:published": "Published: Unpublish replaces Publish; Save runs the BR4 checks before sending (AC7).",
  "form:options-none": "0 options: a draft can be saved; the checklist shows what publishing still needs and Publish is disabled with the reason as visible text.",

  "form:publish-unsaved": "Unsaved changes: Publish is disabled (it acts on the stored version); Preview shows the saved version with a note.",

  "form:preview": "Preview as a student: base text, statement, lettered options; the answer is hidden until Show answer. Esc closes.",

  "kit:all": "AppRichTextField: empty, focused, filled, error, disabled, compact (option row) and long text. Toolbar is one tab stop (arrows move); Tab leaves the editor."
};
function renderDemoStates() {
  const states = screen === "list" ? listStates : screen === "form" ? formStates : ["all"];
  const current = screen === "list" ? listState : screen === "form" ? formState : "all";
  document.getElementById("demo-states").innerHTML = states.map(s => `<button type="button" data-state="${s}" aria-pressed="${s === current}">${s}</button>`).join("");
  document.querySelectorAll("[data-screen]").forEach(b => b.setAttribute("aria-pressed", b.dataset.screen === screen));
  document.getElementById("demo-note").textContent = NOTES[`${screen}:${current}`] || "";
}
function render() {
  document.getElementById("screen-list").hidden = screen !== "list";
  document.getElementById("screen-form").hidden = screen !== "form";
  document.getElementById("screen-kit").hidden = screen !== "kit";
  document.getElementById("block-denied").hidden = true;
  document.getElementById("nav-questions").hidden = false;
  document.getElementById("snackbar").hidden = true;
  document.getElementById("dialog").hidden = true;
  if (screen === "list") renderList(); else if (screen === "form") renderForm(); else renderKit();
  renderDemoStates();
}
document.getElementById("demo").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.screen) { screen = b.dataset.screen; render(); }
  else if (b.dataset.state) { if (screen === "list") listState = b.dataset.state; else { formState = b.dataset.state; model = null; } render(); }
  else if (b.dataset.lang) { lang = b.dataset.lang; applyLang(); }
  else if (b.dataset.themeBtn) { document.documentElement.dataset.theme = b.dataset.themeBtn; document.querySelectorAll("[data-theme-btn]").forEach(x => x.setAttribute("aria-pressed", x.dataset.themeBtn === b.dataset.themeBtn)); }
});
applyLang();
</script>
</body>
</html>
