<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-74 - Notice subjects per edition (mockup)</title>
<style>
/* ===========================================================================
   F-74 mockup:
   1. the "Notice subjects" section on /admin/exams/{examId}/editions/{id}, with its add/edit dialog
   2. the edition delete confirmation on /admin/exams/{id} (BR10, changed text)
   Visual language of the F-35 mockup. Every colour is a SimulabTheme token; no new colour.
   No identity tokens file exists yet: the tokens are SimulabTheme's (MudBlazor palette).
   No external request: no web font, no icon font, no image.
   =========================================================================== */
:root {
  --app-font-xs: 0.75rem; --app-font-sm: 0.8125rem; --app-font-md: 0.9375rem;
  --app-font-lg: 1.0625rem; --app-font-xl: 1.25rem; --app-font-xxl: 1.75rem;
  --app-space-1: 4px; --app-space-2: 8px; --app-space-3: 12px; --app-space-4: 16px; --app-space-5: 24px; --app-space-6: 32px;
  --app-radius-sm: 6px; --app-radius-md: 10px; --app-radius-lg: 14px;

  /* PaletteLight */
  --primary: #216DB5; --primary-darken: #1858A0; --primary-lighten: #EBF3FD; --primary-contrast: #FFFFFF;
  --success: #1A9E8C; --success-contrast: #19243E; --warning: #D98B1A;
  --error: #BE3737; --error-contrast: #FFFFFF;
  --background: #F2F5FB; --surface: #FFFFFF;
  --drawer: #0F3266; --drawer-text: rgba(255,255,255,0.92); --appbar: #0F3266; --appbar-text: #FFFFFF;
  --text-primary: #19243E; --text-secondary: #4A5A7A; --action-default: #4A5A7A;
  --lines-inputs: #7E8AA1; --divider: #D0D8EA;
}
[data-theme="dark"] {
  /* PaletteDark */
  --primary: #64A2E3; --primary-darken: #5096DC; --primary-lighten: #162540; --primary-contrast: #19243E;
  --success: #1A9E8C; --success-contrast: #19243E; --warning: #D98B1A;
  --error: #E06C6C; --error-contrast: #19243E;
  --background: #0E1828; --surface: #172035;
  --drawer: #091422; --drawer-text: rgba(255,255,255,0.92); --appbar: #091422; --appbar-text: #FFFFFF;
  --text-primary: #E0E8F8; --text-secondary: #7A8EB0; --action-default: #7A8EB0;
  --lines-inputs: #61718F; --divider: #263352;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: var(--app-font-md); line-height: 1.65;
  background: var(--background); color: var(--text-primary);
  display: flex; flex-direction: column;
}
svg { display: block; flex-shrink: 0; }
a { color: inherit; }
button { font: inherit; }
:is(a, button, input, select, textarea, [tabindex]):focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.app-visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }

/* ---- demo chrome (not part of the product) ---- */
.demo { display: flex; flex-direction: column; gap: var(--app-space-1); padding: var(--app-space-2) var(--app-space-4); background: var(--surface); border-bottom: 1px dashed var(--divider); }
.demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--app-space-2); }
.demo-label { font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin-right: var(--app-space-1); }
.demo button { font-size: var(--app-font-xs); font-weight: 600; padding: 3px 10px; border-radius: 20px; cursor: pointer; border: 1px solid var(--lines-inputs); background: var(--surface); color: var(--text-primary); }
.demo button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-contrast); }
.demo-note { display: inline-block; font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); border: 1px dashed var(--divider); border-radius: 20px; padding: 0 var(--app-space-2); margin-bottom: var(--app-space-2); }
.demo-note-plain { text-transform: none; letter-spacing: 0; font-weight: 600; }

/* ---- app shell ---- */
.appbar { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: var(--app-space-2); padding: 0 var(--app-space-4); background: var(--appbar); color: var(--appbar-text); }
.brand { font-weight: 700; letter-spacing: .09em; }
.spacer { flex: 1; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--success); color: var(--success-contrast); display: flex; align-items: center; justify-content: center; font-size: var(--app-font-xs); font-weight: 700; }
.lay { flex: 1; display: flex; min-height: 0; }
.drawer { width: 260px; flex-shrink: 0; background: var(--drawer); color: var(--drawer-text); padding: var(--app-space-3) var(--app-space-2); overflow-y: auto; }
.nav-section { display: block; padding: var(--app-space-4) var(--app-space-3) var(--app-space-1); font-size: var(--app-font-xs); text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
.nav-link { display: flex; align-items: center; gap: var(--app-space-3); padding: var(--app-space-2) var(--app-space-3); border-left: 3px solid transparent; border-radius: var(--app-radius-sm); font-size: var(--app-font-sm); cursor: pointer; }
.nav-link:hover { background: rgba(255,255,255,.08); }
.nav-link[aria-current="page"] { background: rgba(255,255,255,.14); border-left-color: var(--primary); font-weight: 600; }
.main { flex: 1; overflow-y: auto; padding: var(--app-space-5); }
@media (max-width: 959.98px) { .drawer { display: none; } .main { padding: var(--app-space-4); } }

/* ---- page header ---- */
.app-page-header { margin-bottom: var(--app-space-5); }
.app-breadcrumbs { font-size: var(--app-font-sm); color: var(--text-secondary); padding-bottom: var(--app-space-1); }
.app-breadcrumbs a { text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.app-page-title { font-size: var(--app-font-xxl); font-weight: 700; line-height: 1.2; }

/* ---- layout ---- */
.app-form-layout { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: var(--app-space-4); align-items: start; }
@media (max-width: 1279.98px) { .app-form-layout { grid-template-columns: minmax(0, 1fr); } }
.app-form-card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-5); }
.app-form-card + .app-form-card, .app-form-layout + .app-form-card { margin-top: var(--app-space-4); }

/* ---- AppSectionCard ---- */
.app-section-card { border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-4) var(--app-space-4) var(--app-space-3); margin-bottom: var(--app-space-4); }
.app-section-card:last-child { margin-bottom: 0; }
.app-section-card-title { display: flex; align-items: center; gap: var(--app-space-2); font-size: var(--app-font-lg); font-weight: 600; }
.app-section-card-icon { color: var(--primary); }
.app-section-card-subtitle { font-size: var(--app-font-xs); color: var(--text-secondary); margin: var(--app-space-1) 0 var(--app-space-4); }
.app-section-note { font-size: var(--app-font-sm); color: var(--text-secondary); padding: var(--app-space-2) 0 var(--app-space-1); }

/* ---- stub of the F-35 edition form ---- */
.stub-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--app-space-3) var(--app-space-4); }
.stub-field { margin-bottom: var(--app-space-1); }
.stub-value { height: 42px; display: flex; align-items: center; padding: 0 var(--app-space-3); border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-sm); font-size: var(--app-font-md); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.stub-value.empty { color: var(--text-secondary); }

/* ---- fields ---- */
.app-form-grid { display: grid; gap: var(--app-space-3) var(--app-space-4); }
.app-form-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 599.98px) { .app-form-grid-2, .stub-grid { grid-template-columns: minmax(0, 1fr); } }
.app-field { position: relative; margin-bottom: var(--app-space-4); }
.app-form-grid .app-field { margin-bottom: 0; }
.app-field-label { display: block; font-size: var(--app-font-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--app-space-1); }
.app-field-required { color: var(--error); margin-left: 3px; }
.app-field-input { display: flex; align-items: center; gap: var(--app-space-2); height: 42px; padding: 0 var(--app-space-1) 0 var(--app-space-3); border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-sm); background: var(--surface); color: var(--text-primary); }
.app-field-input:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
.app-field-input input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; color: var(--text-primary); font: inherit; font-size: var(--app-font-md); }
.app-field-input input::placeholder { color: var(--text-secondary); }
.app-field-error .app-field-input { border-color: var(--error); }
.app-field-hint, .app-field-error-text { display: block; font-size: var(--app-font-xs); line-height: 1.45; margin-top: var(--app-space-1); }
.app-field-hint { color: var(--text-secondary); }
.app-field-error-text { color: var(--error); font-weight: 600; }
.app-field-count { width: 50%; }
@media (max-width: 599.98px) { .app-field-count { width: 100%; } }

/* ---- suggestions listbox (AppLookupField look) ---- */
.app-lookup-list { position: absolute; left: 0; right: 0; top: 70px; z-index: 25; list-style: none; background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-sm); box-shadow: 0 6px 20px rgba(20,40,100,.18); max-height: 240px; overflow-y: auto; padding: var(--app-space-1) 0; }
.app-lookup-list li { padding: var(--app-space-2) var(--app-space-3); font-size: var(--app-font-sm); cursor: pointer; }
.app-lookup-list li:hover, .app-lookup-list li:focus { background: var(--primary-lighten); outline: none; }

/* ---- icon buttons + tooltip ---- */
.app-icon-button { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--action-default); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.app-icon-button:hover { background: var(--background); }
.app-icon-button[disabled] { cursor: not-allowed; opacity: .45; }
.app-icon-button.is-destructive { color: var(--error); }
.tip { position: relative; display: inline-flex; }
.tip::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--text-primary); color: var(--surface); font-size: var(--app-font-xs); line-height: 1.4; padding: 2px 8px; border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 30; }
.tip:hover::after, .tip:focus-within::after { opacity: 1; }

/* ---- AppAlert ---- */
.app-alert { display: flex; gap: var(--app-space-3); align-items: flex-start; padding: var(--app-space-3) var(--app-space-4); border-radius: var(--app-radius-sm); background: var(--error); color: var(--error-contrast); margin-bottom: var(--app-space-4); font-size: var(--app-font-sm); }

/* ---- buttons ---- */
.app-form-actions { display: flex; justify-content: flex-end; align-items: center; gap: var(--app-space-2); margin-top: var(--app-space-5); }
.app-button { font-size: var(--app-font-md); font-weight: 600; cursor: pointer; text-decoration: none; min-height: 40px; padding: 0 var(--app-space-5); border-radius: var(--app-radius-sm); display: inline-flex; align-items: center; gap: var(--app-space-2); }
.app-button-text { border: 0; background: transparent; color: var(--text-primary); }
.app-button-filled { border: 0; background: var(--primary); color: var(--primary-contrast); }
.app-button-outlined { border: 1px solid var(--primary); background: transparent; color: var(--primary); padding: 0 var(--app-space-4); }
.app-button-outlined:hover { background: var(--primary-lighten); }
.app-button-danger { border: 0; background: var(--error); color: var(--error-contrast); }
.app-button[disabled] { opacity: .45; cursor: not-allowed; }
.app-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- AppFormAside ---- */
.app-form-aside { position: sticky; top: var(--app-space-4); background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-4) var(--app-space-4) var(--app-space-3); }
.app-form-aside-title { font-size: var(--app-font-md); font-weight: 700; margin-bottom: var(--app-space-2); }
.app-aside-row { display: flex; justify-content: space-between; gap: var(--app-space-3); padding: var(--app-space-2) 0; border-bottom: 1px solid var(--divider); font-size: var(--app-font-sm); }
.app-aside-row:last-of-type { border-bottom: 0; }
.app-aside-row dt { color: var(--text-secondary); font-weight: 600; flex: none; }
.app-aside-row dd { text-align: right; overflow-wrap: anywhere; }

/* ---- AppItemRows + AppRowActions + AppStatusChip ---- */
.app-item-rows-list { list-style: none; border: 1px solid var(--divider); border-radius: var(--app-radius-sm); }
.app-item-row { display: flex; align-items: center; gap: var(--app-space-3); padding: var(--app-space-2) var(--app-space-2) var(--app-space-2) var(--app-space-3); border-bottom: 1px solid var(--divider); }
.app-item-row:last-child { border-bottom: 0; }
.app-item-row:hover { background: var(--background); }
.app-item-row-content { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--app-space-3); }
.app-item-row-label { font-weight: 600; font-size: var(--app-font-sm); }
.app-item-row-sep { color: var(--text-secondary); }
.app-item-row-meta { font-size: var(--app-font-xs); color: var(--text-secondary); }
.app-item-rows-empty { font-size: var(--app-font-sm); color: var(--text-secondary); padding: var(--app-space-4); border: 1px dashed var(--divider); border-radius: var(--app-radius-sm); text-align: center; }
.app-row-actions { display: flex; align-items: center; gap: var(--app-space-1); flex-shrink: 0; }
.app-row-actions-gap { width: 1px; height: 20px; background: var(--divider); margin: 0 var(--app-space-1); }
.app-status-chip { display: inline-flex; align-items: center; gap: var(--app-space-2); padding: 0 10px; border: 1px solid var(--divider); border-radius: 20px; background: var(--surface); color: var(--text-primary); font-size: var(--app-font-xs); font-weight: 600; line-height: 1.8; }
.app-status-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-secondary); }
.app-status-chip-success .app-status-chip-dot { background: var(--success); }

/* AppTruncatedText */
.app-truncated { min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* ---- notice subjects (composition of kit parts; no new token) ---- */
.ns-group + .ns-group { margin-top: var(--app-space-4); }
.ns-group-title { font-size: var(--app-font-sm); font-weight: 700; color: var(--text-primary); margin-bottom: var(--app-space-2); }
.ns-count { flex: none; min-width: 6.5rem; text-align: right; font-size: var(--app-font-sm); font-variant-numeric: tabular-nums; color: var(--text-secondary); }
.ns-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--app-space-3); margin-top: var(--app-space-3); }
.ns-total { font-size: var(--app-font-sm); text-align: right; }
.ns-total-sum { font-weight: 700; display: block; }
.ns-total-unstated { color: var(--text-secondary); display: block; }

/* overflow menu (MudMenu, closed in the mockup) */
.app-menu { position: absolute; right: 0; top: 36px; z-index: 40; list-style: none; min-width: 12rem; background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-sm); box-shadow: 0 6px 20px rgba(20,40,100,.18); padding: var(--app-space-1) 0; }
.app-menu li { display: flex; align-items: center; gap: var(--app-space-2); padding: var(--app-space-2) var(--app-space-3); font-size: var(--app-font-sm); cursor: pointer; }
.app-menu li:hover, .app-menu li:focus { background: var(--primary-lighten); outline: none; }
.app-menu-wrap { position: relative; display: inline-flex; }

/* ---- states ---- */
.app-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--app-space-3); padding: var(--app-space-6) var(--app-space-4); text-align: center; background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); color: var(--text-secondary); }
.app-state-inline { padding: var(--app-space-5) var(--app-space-4); border-style: dashed; }
.app-state-title { font-size: var(--app-font-xl); font-weight: 700; color: var(--text-primary); }
.app-state .is-error { color: var(--error); }

/* ---- dialogs (MudDialog / AppConfirmDialog) ---- */
.app-overlay { position: fixed; inset: 0; background: rgba(9,20,34,.55); display: flex; align-items: center; justify-content: center; z-index: 60; padding: var(--app-space-4); }
.app-overlay.is-top { z-index: 65; }
.app-dialog { width: 100%; max-width: 30rem; background: var(--surface); color: var(--text-primary); border-radius: var(--app-radius-md); padding: var(--app-space-5); box-shadow: 0 10px 40px rgba(0,0,0,.35); max-height: calc(100vh - 32px); overflow-y: auto; }
.app-dialog-wide { max-width: 38rem; }
.app-dialog-title { font-size: var(--app-font-xl); font-weight: 700; margin-bottom: var(--app-space-4); }
.app-dialog-message { font-size: var(--app-font-sm); color: var(--text-secondary); }
.app-dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: var(--app-space-2); margin-top: var(--app-space-5); }
.app-dialog-actions .app-button { min-height: 40px; padding-top: 6px; padding-bottom: 6px; text-align: left; }

/* ---- snackbar ---- */
.app-snackbar { position: fixed; right: var(--app-space-5); bottom: var(--app-space-5); z-index: 70; display: flex; align-items: center; gap: var(--app-space-2); padding: var(--app-space-3) var(--app-space-4); border-radius: var(--app-radius-sm); background: var(--success); color: var(--success-contrast); font-weight: 600; font-size: var(--app-font-sm); box-shadow: 0 4px 16px rgba(20,40,100,.25); }
</style>
</head>

const t = (key, ...args) => {
  let s = (TEXTS[S.lang] && TEXTS[S.lang][key]) || key;
  args.forEach((a, i) => { s = s.split(`{${i}}`).join(a); });
  return s;
};
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const fmt = (n) => new Intl.NumberFormat(S.lang).format(n);
const norm = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase();
const clone = (a) => a.map(r => ({ ...r }));
const itemName = (r) => r.g ? `${r.l}, ${r.g}` : r.l;

/* BR6: groups in the order of their first row; "no group" is one group */
function groupsOf(rows) {
  const out = [], map = new Map();
  rows.forEach(r => {
    const k = norm(r.g);
    if (!map.has(k)) { const grp = { key: k, label: r.g ? r.g.trim() : null, rows: [] }; map.set(k, grp); out.push(grp); }
    map.get(k).rows.push(r);
  });
  return out;
}

function setEditionState(st) {
  S.state.edition = st;
  S.load = "ready"; S.rows = clone(GROUPED); S.alert = null; S.dlg = null; S.confirm = null; S.snack = null; S.note = null;
  switch (st) {
    case "unsaved": S.load = "unsaved"; S.rows = []; break;
    case "loading": S.load = "loading"; break;
    case "loaderror": S.load = "error"; break;
    case "empty": S.rows = []; break;
    case "ungrouped": S.rows = clone(UNGROUPED); break;
    case "mixed": S.rows = clone(MIXED); break;
    case "allnone": S.rows = clone(UNGROUPED).map(r => ({ ...r, n: null })); break;
    case "moved": move(2, "up", false); break;
    case "refused": S.alert = "notice_subject.move_invalid"; break;
    case "confirm": S.confirm = { kind: "delete", id: 3 }; break;
    case "deleted": S.rows = S.rows.filter(r => r.id !== 3); S.snack = "NoticeSubjects.Deleted"; break;
    case "d-add": openDialog("add"); break;
    case "d-suggest": openDialog("add"); S.dlg.group = "con"; S.dlg.sugOpen = true; S.dlg.dirty = true; break;
    case "d-edit": openDialog("edit", 2); break;
    case "d-moved": openDialog("edit", 3); S.dlg.group = E; S.dlg.dirty = true; break;
    case "d-saving": openDialog("add"); Object.assign(S.dlg, { group: E, label: "Noções de Direito Penal", count: "5", saving: true, dirty: true }); break;
    case "d-validation": openDialog("add"); Object.assign(S.dlg, { group: B, label: "L", count: "501", dirty: true }); validateAll(); break;
    case "d-duplicate": openDialog("add"); Object.assign(S.dlg, { group: "conhecimentos basicos", label: "lingua portuguesa", count: "15", dirty: true, alert: "notice_subject.duplicate" }); break;
    case "d-server": openDialog("edit", 2); Object.assign(S.dlg, { count: "12", dirty: true, alert: "common.unexpected_error" }); break;
    case "d-discard": openDialog("add"); Object.assign(S.dlg, { group: E, label: "Direitos Humanos", dirty: true }); S.confirm = { kind: "discard" }; break;
    case "d-saved": S.rows.push({ id: 8, g: E, l: "Noções de Direito Penal", n: 5 }); S.snack = "NoticeSubjects.Saved"; break;
  }
}

/* BR6: swap with the neighbour in the same group */
function move(id, dir, announce = true) {
  const grp = groupsOf(S.rows).find(g => g.rows.some(r => r.id === id));
  const idx = grp.rows.findIndex(r => r.id === id);
  const j = dir === "up" ? idx - 1 : idx + 1;
  if (j < 0 || j >= grp.rows.length) { S.alert = "notice_subject.move_invalid"; return; }
  const a = S.rows.indexOf(grp.rows[idx]), b = S.rows.indexOf(grp.rows[j]);
  [S.rows[a], S.rows[b]] = [S.rows[b], S.rows[a]];
  S.alert = null;
  const r = S.rows[b];
  const msg = r.g ? t("NoticeSubjects.Moved", r.l, String(j + 1), String(grp.rows.length), r.g)
                  : t("NoticeSubjects.Moved.NoGroup", r.l, String(j + 1), String(grp.rows.length));
  S.note = msg;
  if (announce) { $("live").textContent = ""; setTimeout(() => { $("live").textContent = msg; }, 50); }
}

function openDialog(mode, id) {
  const r = id ? S.rows.find(x => x.id === id) : null;
  S.dlg = { mode, id: r ? r.id : null, group: r ? (r.g || "") : "", label: r ? r.l : "", count: r && r.n != null ? String(r.n) : "",
            savedGroup: r ? (r.g || "") : "", errors: {}, alert: null, saving: false, dirty: false, sugOpen: false };
}

function checkField(f) {
  const d = S.dlg;
  if (f === "label") {
    const v = d.label.trim();
    d.errors.label = v.length === 0 ? "notice_subject.label_required" : v.length < 2 ? "notice_subject.label_too_short" : v.length > 200 ? "notice_subject.label_too_long" : null;
  }
  if (f === "group") d.errors.group = d.group.trim().length > 100 ? "notice_subject.group_too_long" : null;
  if (f === "count") {
    const v = d.count.trim();
    d.errors.count = !v || (/^\d+$/.test(v) && +v >= 1 && +v <= 500) ? null : "notice_subject.question_count_invalid";
  }
}
function validateAll() { ["group", "label", "count"].forEach(checkField); return Object.values(S.dlg.errors).some(Boolean); }

function suggestions() {
  const d = S.dlg, term = norm(d.group);
  const used = []; const seen = new Set();
  S.rows.forEach(r => { if (r.g && !seen.has(norm(r.g))) { seen.add(norm(r.g)); used.push(r.g); } });
  return used.filter(g => !term || norm(g).includes(term));
}

function saveDialog() {
  const d = S.dlg;
  if (validateAll()) {
    renderDialog();
    const firstErr = ["group", "label", "count"].find(f => d.errors[f]);
    ({ group: $("notice-subject-group"), label: $("notice-subject-label"), count: $("notice-subject-question-count") })[firstErr]?.focus();
    return;
  }
  const g = d.group.trim() || null, l = d.label.trim();
  const dup = S.rows.some(r => r.id !== d.id && norm(r.g) === norm(g) && norm(r.l) === norm(l));
  if (dup) { d.alert = "notice_subject.duplicate"; renderDialog(); $("ns-dlg-alert")?.focus(); return; }
  d.alert = null; d.saving = true; renderDialog();
  setTimeout(() => {
    const n = d.count.trim() ? Number(d.count) : null;
    let id = d.id;
    if (d.mode === "add") { id = S.nextId++; insertLastInGroup({ id, g, l, n }); }
    else {
      const r = S.rows.find(x => x.id === d.id);
      if (norm(r.g) !== norm(g)) { S.rows.splice(S.rows.indexOf(r), 1); insertLastInGroup({ id, g, l, n }); } /* BR7 */
      else Object.assign(r, { g, l, n });                                                                     /* AC9: position kept */
    }
    S.dlg = null; S.snack = "NoticeSubjects.Saved"; S.note = null; S.state.edition = "d-saved";
    render(); document.querySelector(`[data-action="edit"][data-id="${id}"]`)?.focus();
  }, 1000);
}

/* BR6: a new row goes last in its group, last in the edition when the group is new */
function insertLastInGroup(row) {
  let at = -1;
  S.rows.forEach((r, i) => { if (norm(r.g) === norm(row.g)) at = i; });
  if (at < 0) S.rows.push(row); else S.rows.splice(at + 1, 0, row);
}

function closeDialog() {
  S.dlg = null; S.confirm = null; render();
  if (S.returnFocus) document.querySelector(S.returnFocus)?.focus();
}
function cancelDialog() {
  if (S.dlg.saving) return;
  if (S.dlg.dirty) { S.confirm = { kind: "discard" }; renderConfirm(); return; }
  closeDialog();
}

/* ===================================================================== */
/* Screen 2: exam page, edition delete (BR10)                             */
/* ===================================================================== */
function setExamState(st) {
  S.state.exam = st; S.editions = EDITIONS.map(e => ({ ...e })); S.dlg = null; S.confirm = null; S.snack = null;
  if (st === "confirm") S.confirm = { kind: "edition", id: 2 };
  if (st === "deleted") { S.editions = S.editions.filter(e => e.id !== 2); S.snack = "ExamEditions.Deleted"; }
}

function examHtml() {
  const chip = (s) => `<span class="app-status-chip ${s === "Published" ? "app-status-chip-success" : ""}"><span class="app-status-chip-dot" aria-hidden="true"></span>${esc(t("ExamEditions.Status." + s))}</span>`;
  return `
  <div class="app-page-header">
    <nav class="app-breadcrumbs" aria-label="Breadcrumb"><span>${esc(t("Nav.Section.Content"))}</span><span aria-hidden="true"> / </span><a tabindex="0">${esc(t("Exams.Title"))}</a><span aria-hidden="true"> / </span><span aria-current="page">${esc(EXAM.name)}</span></nav>
    <h1 class="app-page-title">${esc(t("Exams.Form.EditTitle"))}</h1>
  </div>
  <span class="demo-note">Demo: the F-35 exam page; only the delete confirmation text changes</span>
  <div class="app-form-card">
    <section class="app-section-card" aria-labelledby="exam-section-editions-title">
      <h2 class="app-section-card-title" id="exam-section-editions-title">${icon("Editions", 20, "app-section-card-icon")}<span>${esc(t("ExamEditions.Section.Title"))}</span></h2>
      <p class="app-section-card-subtitle">${esc(t("ExamEditions.Section.Subtitle"))}</p>
      <ul class="app-item-rows-list">${S.editions.map(e => `
        <li class="app-item-row">
          <div class="app-item-row-content" style="flex-wrap:wrap"><span class="app-item-row-label">${esc(e.label)}</span>${chip(e.status)}</div>
          <div class="app-row-actions" role="group" aria-label="${esc(t("Common.Actions"))}">
            ${iconBtn({ action: "noop", id: e.id, ic: "Edit", label: t("Common.Edit"), name: e.label })}
            ${iconBtn({ action: "edition-delete", id: e.id, ic: "Delete", label: t("Common.Delete"), name: e.label, destructive: true,
                disabled: e.status === "Published", tip: e.status === "Published" ? t("ExamEditions.Delete.DisabledPublished") : null })}
          </div>
        </li>`).join("")}</ul>
      <div style="margin-top:12px"><a class="app-button app-button-outlined" href="#" data-action="noop">${icon("Add", 18)}${esc(t("ExamEditions.Form.AddTitle"))}</a></div>
    </section>
  </div>`;
}

/* ===================================================================== */
/* shared                                                                 */
/* ===================================================================== */
function deniedHtml() {
  return `<div class="app-state">${icon("Error", 40)}<h1 class="app-state-title">${esc(t("NotFound.Title"))}</h1><p>${esc(t("NotFound.Message"))}</p></div>`;
}

function navHtml() {
  const link = (ic, key, current) => `<span class="nav-link" ${current ? 'aria-current="page"' : ""}>${icon(ic, 20)}<span>${esc(t(key))}</span></span>`;
  return `<span class="nav-section">${esc(t("Nav.Section.Content"))}</span>
    ${link("Exams", "Exams.Title", true)}${link("IssuingAuthorities", "IssuingAuthorities.Title")}${link("Organizers", "Organizers.Title")}
    <span class="nav-section">${esc(t("Nav.Section.Administration"))}</span>${link("Users", "Users.Title")}${link("Roles", "Roles.Title")}`;
}

function confirmHtml() {
  const c = S.confirm;
  if (!c) return "";
  let title, message, confirm;
  if (c.kind === "delete") {
    const r = S.rows.find(x => x.id === c.id);
    title = t("Common.Delete.Title");
    message = t("NoticeSubjects.Delete.Message", r.l);
    confirm = t("Common.Delete.Confirm", t("NoticeSubjects.Delete.Object", r.l));
  } else if (c.kind === "edition") {
    const e = S.editions.find(x => x.id === c.id);
    title = t("Common.Delete.Title");
    message = t("ExamEditions.Delete.Message", e.label, EXAM.name);
    confirm = t("Common.Delete.Confirm", t("ExamEditions.Delete.Object", e.label));
  } else {
    title = t("Common.Discard.Title"); message = t("Common.Discard.Message"); confirm = t("Common.Discard.Confirm");
  }
  return `<div class="app-overlay is-top">
    <div class="app-dialog" role="alertdialog" aria-modal="true" aria-labelledby="cf-title" aria-describedby="cf-message">
      <h2 class="app-dialog-title" id="cf-title">${esc(title)}</h2>
      <p class="app-dialog-message" id="cf-message">${esc(message)}</p>
      <div class="app-dialog-actions">
        <button type="button" class="app-button app-button-text" data-action="cf-cancel" id="cf-cancel">${esc(t("Common.Cancel"))}</button>
        <button type="button" class="app-button app-button-danger" data-action="cf-confirm">${esc(confirm)}</button>
      </div>
    </div>
  </div>`;
}

let snackTimer = null;
function renderSnack() {
  $("snackbar-root").innerHTML = S.snack ? `<div class="app-snackbar" role="status">${icon("Check", 18)}<span>${esc(t(S.snack))}</span></div>` : "";
  clearTimeout(snackTimer);
  if (S.snack) snackTimer = setTimeout(() => { S.snack = null; $("snackbar-root").innerHTML = ""; }, 4000);
}

function renderDemo() {
  document.querySelectorAll("[data-screen]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.screen === S.screen)));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeBtn === S.theme)));
  document.querySelectorAll("[data-rowmode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.rowmode === S.rowMode)));
  const groups = STATES[S.screen];
  ["demo-states-1", "demo-states-2"].forEach((rid, i) => {
    const g = groups[i];
    $(rid).innerHTML = g ? `<span class="demo-label">Demo &middot; ${g[0]}</span>` +
      g[1].map(([k, label]) => `<button type="button" data-state="${k}" aria-pressed="${S.state[S.screen] === k}">${label}</button>`).join("") : "";
    $(rid).hidden = !g;
  });
}

function renderDialog() { $("dialog-root").innerHTML = dialogHtml(); }
function renderConfirm() { $("confirm-root").innerHTML = confirmHtml(); if (S.confirm) $("cf-cancel")?.focus(); }
function renderSection() { const b = $("ns-body"); if (b) b.innerHTML = sectionBodyHtml(); }

function render() {
  document.documentElement.lang = S.lang;
  document.documentElement.dataset.theme = S.theme;
  renderDemo();
  $("drawer").innerHTML = navHtml();
  $("main").innerHTML = S.screen === "edition" ? editionHtml() : examHtml();
  renderDialog();
  renderConfirm();
  renderSnack();
}

function setState(st) {
  if (S.screen === "edition") setEditionState(st); else setExamState(st);
  render();
  if (S.dlg && !S.confirm) {
    if (S.state.edition === "d-validation") $("notice-subject-label")?.focus();
    else if (S.state.edition === "d-duplicate") $("ns-dlg-alert")?.focus();
    else $("notice-subject-group")?.focus();
  }
}

/* ---- events ---- */
document.addEventListener("click", (ev) => {
  const demo = ev.target.closest(".demo button");
  if (demo) {
    if (demo.dataset.screen) { S.screen = demo.dataset.screen; setState(S.state[S.screen]); return; }
    if (demo.dataset.state) { setState(demo.dataset.state); return; }
    if (demo.dataset.lang) { S.lang = demo.dataset.lang; if (S.note) S.note = null; render(); return; }
    if (demo.dataset.themeBtn) { S.theme = demo.dataset.themeBtn; render(); return; }
    if (demo.dataset.rowmode) { S.rowMode = demo.dataset.rowmode; render(); return; }
  }
  const el = ev.target.closest("[data-action]");
  if (!el) {
    if (S.dlg && S.dlg.sugOpen && !ev.target.closest("#wrap-notice-subject-group")) { S.dlg.sugOpen = false; refreshGroup(); }
    return;
  }
  ev.preventDefault();
  const a = el.dataset.action, id = Number(el.dataset.id);
  switch (a) {
    case "retry": S.load = "ready"; S.state.edition = "grouped"; render(); break;
    case "add": S.returnFocus = "#ns-add"; openDialog("add"); renderDialog(); $("notice-subject-group")?.focus(); break;
    case "edit": S.returnFocus = `[data-action="edit"][data-id="${id}"]`; openDialog("edit", id); renderDialog(); $("notice-subject-group")?.focus(); break;
    case "move-up": case "move-down": {
      const dir = a === "move-up" ? "up" : "down";
      move(id, dir); renderSection();
      const same = document.querySelector(`[data-action="${a}"][data-id="${id}"]`);
      const other = document.querySelector(`[data-action="${a === "move-up" ? "move-down" : "move-up"}"][data-id="${id}"]`);
      (same && !same.disabled ? same : other)?.focus();
      break;
    }
    case "delete": S.returnFocus = `[data-action="delete"][data-id="${id}"]`; S.confirm = { kind: "delete", id }; renderConfirm(); break;
    case "edition-delete": S.returnFocus = `[data-action="edition-delete"][data-id="${id}"]`; S.confirm = { kind: "edition", id }; renderConfirm(); break;
    case "cf-cancel":
      S.confirm = null; renderConfirm();
      if (S.dlg) $("notice-subject-group")?.focus(); else if (S.returnFocus) document.querySelector(S.returnFocus)?.focus();
      break;
    case "cf-confirm": {
      const c = S.confirm; S.confirm = null;
      if (c.kind === "discard") { closeDialog(); break; }
      if (c.kind === "delete") {
        const grpRows = S.rows; const idx = grpRows.findIndex(r => r.id === c.id);
        S.rows.splice(idx, 1); S.snack = "NoticeSubjects.Deleted"; S.note = null; S.state.edition = "deleted"; render();
        const next = S.rows[idx] || S.rows[idx - 1];
        (next ? document.querySelector(`[data-action="edit"][data-id="${next.id}"]`) : $("ns-add"))?.focus();
      } else {
        S.editions = S.editions.filter(e => e.id !== c.id); S.snack = "ExamEditions.Deleted"; S.state.exam = "deleted"; render();
      }
      break;
    }
    case "dlg-cancel": cancelDialog(); break;
    case "dlg-save": saveDialog(); break;
    case "pick-group":
      S.dlg.group = el.dataset.value; S.dlg.sugOpen = false; S.dlg.dirty = true; checkField("group"); refreshGroup(); $("notice-subject-group")?.focus(); break;
  }
});

function refreshGroup() {
  const w = $("wrap-notice-subject-group"); if (!w) return;
  const input = $("notice-subject-group"), focused = document.activeElement === input, pos = input ? input.selectionStart : null;
  w.outerHTML = groupFieldHtml();
  if (focused) { const i = $("notice-subject-group"); i.focus(); if (pos != null) i.setSelectionRange(pos, pos); }
}
function refreshField(field) {
  const map = { label: ["notice-subject-label", "NoticeSubjects.Field.Label.Hint"], count: ["notice-subject-question-count", "NoticeSubjects.Field.QuestionCount.Hint"] };
  if (field === "group") { refreshGroup(); return; }
  const [id, hint] = map[field]; const err = S.dlg.errors[field];
  $("wrap-" + id).classList.toggle("app-field-error", !!err);
  const input = $(id); if (err) input.setAttribute("aria-invalid", "true"); else input.removeAttribute("aria-invalid");
  $(id + "-description").innerHTML = describe(err, t(hint));
}

document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (!S.dlg || !el.dataset.field) return;
  S.dlg[el.dataset.field] = el.value; S.dlg.dirty = true;
  if (el.dataset.field === "group") { S.dlg.sugOpen = true; refreshGroup(); }
});
document.addEventListener("focusout", (ev) => {
  const el = ev.target;
  if (!S.dlg || !el.dataset || !el.dataset.field) return;
  if (el.dataset.field === "group" && ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest("#wrap-notice-subject-group")) return;
  checkField(el.dataset.field);
  if (el.dataset.field === "group") { S.dlg.sugOpen = false; }
  refreshField(el.dataset.field);
});

document.addEventListener("keydown", (ev) => {
  const el = ev.target;
  if (ev.key === "Escape") {
    if (S.confirm) { ev.preventDefault(); document.querySelector('[data-action="cf-cancel"]')?.click(); return; }
    if (S.dlg && S.dlg.sugOpen) { ev.preventDefault(); S.dlg.sugOpen = false; refreshGroup(); $("notice-subject-group")?.focus(); return; }
    if (S.dlg) { ev.preventDefault(); cancelDialog(); return; }
  }
  if (el.id === "notice-subject-group" && ev.key === "ArrowDown") {
    ev.preventDefault();
    if (!S.dlg.sugOpen) { S.dlg.sugOpen = true; refreshGroup(); }
    document.querySelector('#notice-subject-group-list [role="option"]')?.focus();
  }
  if (el.getAttribute && el.getAttribute("role") === "option") {
    if (ev.key === "Enter") { ev.preventDefault(); el.click(); }
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      const sib = ev.key === "ArrowDown" ? el.nextElementSibling : el.previousElementSibling;
      (sib || (ev.key === "ArrowUp" ? $("notice-subject-group") : null))?.focus();
    }
  }
  if (S.dlg && ev.key === "Enter" && el.tagName === "INPUT" && el.id !== "notice-subject-group") { ev.preventDefault(); saveDialog(); }
});

setExamState("confirm");
setEditionState("grouped");
render();
</script>
</body>
</html>
