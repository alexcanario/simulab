<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-114 - Field kinds look like what they do (mockup, /dev/ui section)</title>
<style>
/* ===========================================================================
   F-114 mockup - the new "Field kinds" section of the dev gallery /dev/ui.
   Three columns: arrow combobox (AppSelectField), magnifier lookup (AppLookupField), free text (AppTextField).
   The demo chrome switches the state of all three at once, the UI language and the theme.
   Every colour is a token of docs/design/identity.tokens.json (light and dark). No new colour.
   No external request: no web font, no icon font, no image. Icons are Material Outlined paths.
   =========================================================================== */
:root {
  --app-font-xs: 0.75rem; --app-font-sm: 0.8125rem; --app-font-md: 0.9375rem; --app-font-lg: 1.0625rem; --app-font-xl: 1.25rem; --app-font-xxl: 1.75rem;
  --app-space-1: 4px; --app-space-2: 8px; --app-space-3: 12px; --app-space-4: 16px; --app-space-5: 24px; --app-space-6: 32px;
  --app-radius: 10px;

  /* identity.tokens.json - light */
  --primary: #216DB5; --primary-darken: #1858A0; --primary-lighten: #EBF3FD; --primary-contrast: #FFFFFF;
  --success: #1A9E8C; --success-contrast: #19243E;
  --error: #BE3737; --error-contrast: #FFFFFF;
  --background: #F2F5FB; --surface: #FFFFFF;
  --drawer: #0F3266; --drawer-text: rgba(255,255,255,0.918); --appbar: #0F3266; --appbar-text: #FFFFFF;
  --text-primary: #19243E; --text-secondary: #4A5A7A; --action-default: #4A5A7A;
  --lines-inputs: #7E8AA1; --divider: #D0D8EA;
  /* MudBlazor default disabled ink (no token: DESIGN.md "Colors the theme leaves at MudBlazor's default") */
  --disabled-ink: rgba(0,0,0,0.38);
}
[data-theme="dark"] {
  --primary: #64A2E3; --primary-darken: #5096DC; --primary-lighten: #162540; --primary-contrast: #19243E;
  --success: #1A9E8C; --success-contrast: #19243E;
  --error: #E06C6C; --error-contrast: #19243E;
  --background: #0E1828; --surface: #172035;
  --drawer: #091422; --drawer-text: rgba(255,255,255,0.498); --appbar: #091422; --appbar-text: rgba(255,255,255,0.7);
  --text-primary: #E0E8F8; --text-secondary: #7A8EB0; --action-default: #7A8EB0;
  --lines-inputs: #61718F; --divider: #263352;
  --disabled-ink: rgba(255,255,255,0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: var(--app-font-md); line-height: 1.65; background: var(--background); color: var(--text-primary); display: flex; flex-direction: column; }
svg { display: block; flex-shrink: 0; fill: currentColor; }
button { font: inherit; }
:is(a, button, input, [tabindex]):focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.app-visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }
code { font-size: var(--app-font-xs); background: var(--background); border: 1px solid var(--divider); border-radius: 4px; padding: 0 4px; }

/* ---- demo chrome (not part of the product) ---- */
.demo { display: flex; flex-direction: column; gap: var(--app-space-1); padding: var(--app-space-2) var(--app-space-4); background: var(--surface); border-bottom: 1px dashed var(--divider); }
.demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--app-space-2); }
.demo-label { font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin-right: var(--app-space-1); }
.demo button { font-size: var(--app-font-xs); font-weight: 600; padding: 3px 10px; border-radius: 20px; cursor: pointer; border: 1px solid var(--lines-inputs); background: var(--surface); color: var(--text-primary); }
.demo button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-contrast); }
.demo-note { font-size: var(--app-font-xs); color: var(--text-secondary); }

/* ---- app shell ---- */
.appbar { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: var(--app-space-2); padding: 0 var(--app-space-4); background: var(--appbar); color: var(--appbar-text); }
.brand { font-weight: 700; letter-spacing: .09em; }
.spacer { flex: 1; }
.appbar .app-icon-button { color: var(--appbar-text); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--success); color: var(--success-contrast); display: flex; align-items: center; justify-content: center; font-size: var(--app-font-xs); font-weight: 700; }
.lay { flex: 1; display: flex; min-height: 0; }
.drawer { width: 260px; flex-shrink: 0; background: var(--drawer); color: var(--drawer-text); padding: var(--app-space-3) var(--app-space-2); overflow-y: auto; }
.nav-section { display: block; padding: var(--app-space-4) var(--app-space-3) var(--app-space-1); font-size: var(--app-font-xs); text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
.nav-link { display: flex; align-items: center; gap: var(--app-space-3); padding: var(--app-space-2) var(--app-space-3); border-left: 3px solid transparent; border-radius: 6px; font-size: var(--app-font-sm); cursor: pointer; }
.nav-link[aria-current="page"] { background: rgba(255,255,255,.14); border-left-color: var(--primary); font-weight: 600; }
.main { flex: 1; overflow-y: auto; padding: var(--app-space-5); }
@media (max-width: 959.98px) { .drawer { display: none; } .main { padding: var(--app-space-4); } }

/* ---- page header (AppPageHeader) ---- */
.app-page-header { margin-bottom: var(--app-space-5); display: flex; align-items: flex-end; gap: var(--app-space-4); flex-wrap: wrap; }
.app-page-header-text { flex: 1; min-width: 0; }
.app-breadcrumbs { font-size: var(--app-font-sm); color: var(--text-secondary); padding-bottom: var(--app-space-1); }
.app-page-title { font-size: var(--app-font-xxl); font-weight: 700; line-height: 1.2; }
.intro { font-size: var(--app-font-md); margin-bottom: var(--app-space-5); }

/* ---- gallery section ---- */
.gallery-section { margin-bottom: var(--app-space-6); }
.gallery-section h2 { font-size: var(--app-font-xl); font-weight: 600; line-height: 1.3; margin-bottom: var(--app-space-2); }
.gallery-hint { font-size: var(--app-font-sm); color: var(--text-primary); margin-bottom: var(--app-space-3); max-width: 70rem; }
.gallery-card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius); padding: var(--app-space-4); }
.app-form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--app-space-5); }
@media (max-width: 959.98px) { .app-form-grid { grid-template-columns: 1fr; } }
.kind { min-width: 0; }
.kind-title { font-size: var(--app-font-md); font-weight: 600; margin-bottom: var(--app-space-1); display: flex; align-items: center; gap: var(--app-space-2); }
.kind-title svg { color: var(--action-default); }
.kind-rule { font-size: var(--app-font-xs); color: var(--text-secondary); margin-bottom: var(--app-space-4); min-height: 2.9em; }
.state-caption { font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin-bottom: var(--app-space-2); display: flex; align-items: center; gap: var(--app-space-2); }
.state-caption::after { content: ""; flex: 1; border-top: 1px dashed var(--divider); }
.not-applicable { font-size: var(--app-font-sm); color: var(--text-secondary); border: 1px dashed var(--divider); border-radius: var(--app-radius); padding: var(--app-space-3); margin-bottom: var(--app-space-4); }
.kind-note { font-size: var(--app-font-xs); color: var(--text-secondary); margin-top: calc(-1 * var(--app-space-2)); margin-bottom: var(--app-space-4); }

/* ---- kit field anatomy (AppTextField / AppSelectField / AppLookupField share it) ---- */
.app-field { position: relative; margin-bottom: var(--app-space-4); }
.app-field-label { display: block; font-size: var(--app-font-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; }
.app-field-required { color: var(--error); margin-left: 3px; }
.app-input { display: flex; align-items: center; gap: var(--app-space-2); min-height: 40px; padding: 0 var(--app-space-1) 0 var(--app-space-3); border: 1px solid var(--lines-inputs); border-radius: var(--app-radius); background: transparent; color: var(--text-primary); }
.app-input:focus-within { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.app-input input { flex: 1; min-width: 0; height: 38px; border: 0; outline: none; background: transparent; color: var(--text-primary); font: inherit; font-size: var(--app-font-md); }
.app-input input::placeholder { color: var(--text-secondary); opacity: 1; }
.app-input-start { color: var(--action-default); width: 20px; height: 20px; }
.app-input-end { display: inline-flex; align-items: center; gap: 0; }
.app-input-button { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--action-default); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.app-input-button:hover { background: var(--background); }
.app-input-button svg { width: 24px; height: 24px; }
.app-input-button.is-clear svg { width: 20px; height: 20px; }
.app-input-progress { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; }
.app-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--primary); border-right-color: transparent; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.app-field-error .app-input { border-color: var(--error); }
.app-field-error .app-input:focus-within { box-shadow: inset 0 0 0 1px var(--error); border-color: var(--error); }
.app-field-description { display: block; font-size: var(--app-font-xs); line-height: 1.45; margin-top: 5px; color: var(--text-secondary); overflow-wrap: anywhere; }
.app-field-error-text { color: var(--error); font-weight: 600; }
.is-disabled .app-input { cursor: not-allowed; }
.is-disabled .app-input input, .is-disabled .app-input-start, .is-disabled .app-input-button { color: var(--disabled-ink); cursor: not-allowed; }
.is-disabled .app-input-button:hover { background: transparent; }

/* ---- the open list (MudPopover + MudList, as the kit paints it) ---- */
.app-listbox { list-style: none; position: absolute; left: 0; right: 0; top: calc(100% - 22px); z-index: 25; background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius); box-shadow: 0 6px 20px rgba(9,20,34,.22); max-height: 300px; overflow-y: auto; padding: var(--app-space-1) 0; }
.app-field.has-description .app-listbox { top: calc(100% - 22px); }
.app-option { display: flex; flex-direction: column; gap: 2px; padding: 8px var(--app-space-3); min-height: 36px; cursor: pointer; font-size: var(--app-font-md); line-height: 1.4; overflow-wrap: anywhere; }
.app-option:hover, .app-option[aria-selected="true"] { background: var(--primary-lighten); }
.app-option[aria-selected="true"] { font-weight: 600; }
.app-option.is-focused { outline: 2px solid var(--primary); outline-offset: -2px; }
.app-option-secondary { font-size: var(--app-font-xs); color: var(--text-secondary); }
.app-list-message { padding: var(--app-space-3) var(--app-space-4); font-size: var(--app-font-sm); color: var(--text-secondary); overflow-wrap: anywhere; }
.app-list-progress { display: flex; justify-content: center; padding: var(--app-space-3); }
.app-icon-button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: var(--action-default); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }

/* keeps the open list of a column above the next state below it */
.kind .app-field.is-open { z-index: 30; }
</style>
</head>

</div>

/* Sample data. Areas are UI text (AreaText.Name(L, code), as on the subject pages); issuing authorities are content and are not translated. */
const AREA_KEYS = ["Area.Law", "Area.Mathematics", "Area.HumanSciences", "Area.Administration", "Area.Portuguese", "Area.Informatics", "Area.Logic", "Area.CurrentAffairs"];
const AUTHORITIES = [

];
const LANG_OPTIONS = [["pt-BR", "Português (Brasil)"], ["pt-PT", "Português (Portugal)"], ["en", "English"]];

const STATES = ["Empty", "WithValue", "Disabled", "Error", "LongText", "Loading", "Open", "NoResults", "LeadingIcon"];
let lang = "pt-BR", state = "Empty";
const t = (key, ...args) => { let s = (TEXTS[lang] && TEXTS[lang][key]) || TEXTS.en[key] || key; args.forEach((a, i) => { s = s.split(`{${i}}`).join(a); }); return s; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

/* ---- field renderers ---- */
function fieldShell(o) {
  const cls = ["app-field", o.error ? "app-field-error" : "", o.disabled ? "is-disabled" : "", o.open ? "is-open" : "", "has-description"].join(" ");
  const req = o.required ? `<span class="app-field-required" aria-hidden="true">*</span>` : "";
  const desc = o.error ? `<span class="app-field-error-text">${esc(o.error)}</span>` : (o.hint ? esc(o.hint) : "");
  return `<div class="${cls}" data-kind="${o.kind}">
    <label class="app-field-label" id="${o.id}-label" for="${o.id}">${esc(o.label)}${req}</label>
    <div class="app-input">${o.start || ""}<input ${o.attrs} id="${o.id}" ${o.disabled ? "disabled" : ""} aria-labelledby="${o.id}-label" aria-describedby="${o.id}-description" ${o.error ? 'aria-invalid="true"' : ""} ${o.required ? 'aria-required="true"' : ""} autocomplete="off" value="${esc(o.value || "")}" placeholder="${esc(o.placeholder || "")}"><span class="app-input-end">${o.end || ""}</span></div>
    <span id="${o.id}-description" class="app-field-description">${desc}</span>
    ${o.list || ""}
  </div>`;
}

function listbox(id, items, message) {
  const rows = message ? `<li class="app-list-message" role="presentation">${message}</li>` :
    items.map((it, i) => `<li role="option" id="${id}-opt-${i}" class="app-option ${it.selected ? "" : ""} ${it.focused ? "is-focused" : ""}" aria-selected="${it.selected ? "true" : "false"}" data-index="${i}"><span>${esc(it.text)}</span>${it.secondary ? `<span class="app-option-secondary">${esc(it.secondary)}</span>` : ""}</li>`).join("");
  return `<ul class="app-listbox" role="listbox" id="${id}-list" aria-labelledby="${id}-label">${rows}</ul>`;
}

/* Arrow combobox (AppSelectField): the arrow is the library's end adornment button; the leading icon is drawn by the kit (BR5 prototype). */
function selectField(o) {
  const arrow = o.loading
    ? `<span class="app-input-progress" role="status" aria-label="${esc(t("SelectField.Loading"))}"><span class="app-spinner"></span></span>`
    : `<button type="button" class="app-input-button is-arrow" tabindex="-1" aria-label="${esc(t(o.open ? "SelectField.Collapse" : "SelectField.Expand"))}" ${o.disabled ? "disabled" : ""}>${svg(o.open ? "collapse" : "expand", 24)}</button>`;
  const attrs = `type="text" role="combobox" aria-expanded="${o.open ? "true" : "false"}" aria-autocomplete="list" aria-haspopup="listbox" aria-controls="${o.id}-list"`;
  return fieldShell({ ...o, kind: "select", attrs, start: o.leading ? svg(o.leading, 20, "app-input-start") : "", end: arrow });
}

/* Magnifier lookup (AppLookupField): unchanged anatomy - magnifier at the start, clear button at the end when a value is set. */
function lookupField(o) {
  const clear = o.value && !o.disabled ? `<button type="button" class="app-input-button is-clear" aria-label="${esc(t("Lookup.Clear"))}">${svg("close", 20)}</button>` : "";
  const attrs = `type="text" role="combobox" aria-expanded="${o.open ? "true" : "false"}" aria-autocomplete="list" aria-haspopup="listbox" aria-controls="${o.id}-list"`;
  return fieldShell({ ...o, kind: "lookup", attrs, start: svg(o.leading || "search", 20, "app-input-start"), end: clear });
}

/* Free text (AppTextField): plain; an optional decorative leading icon. */
function textField(o) {
  return fieldShell({ ...o, kind: "text", attrs: `type="text"`, start: o.leading ? svg(o.leading, 20, "app-input-start") : "", end: "" });
}

/* ---- the three columns for the current state ---- */
function areaOptions(selectedKey) {
  const all = [{ key: null, text: t("Common.Filter.All") }, { key: "none", text: t("Subjects.NoArea") }, ...AREA_KEYS.map(k => ({ key: k, text: t(k) }))];
  return all.map(a => ({ ...a, selected: a.key === selectedKey }));
}

function renderSelect(s) {
  const base = { id: "gallery-kind-select-" + s.toLowerCase(), label: t("Subjects.Field.Area"), hint: t("Subjects.Field.Area.Help"), required: false };
  switch (s) {
    case "Empty": return selectField({ ...base, value: t("Common.Filter.All"), live: true });
    case "WithValue": return selectField({ ...base, value: t("Area.Mathematics"), live: true });
    case "Disabled": return selectField({ ...base, value: t("Area.Law"), disabled: true });
    case "Error": return selectField({ ...base, value: "", error: t("subject.area_invalid") });
    case "LongText": return selectField({ ...base, value: t("Area.LongSample"), error: t("Gallery.LongError"), open: true,
      list: listbox(base.id, [{ text: t("Area.Administration") }, { text: t("Area.LongSample"), selected: true }, { text: t("Area.CurrentAffairs") }]) });
    case "Loading": return selectField({ ...base, value: "", loading: true, open: true, list: listbox(base.id, [], esc(t("SelectField.Loading"))) });
    case "Open": { const opts = areaOptions(null); opts[0].focused = true;
      return selectField({ ...base, value: t("Common.Filter.All"), open: true, list: listbox(base.id, opts) }); }
    case "NoResults": return selectField({ ...base, value: "quim", open: true, list: listbox(base.id, [], esc(t("SelectField.NoResults", "quim"))) });
    case "LeadingIcon": return selectField({ id: "gallery-kind-select-icon", label: t("Exams.Field.ContentLanguage"), value: LANG_OPTIONS.find(l => l[0] === lang)[1], leading: "language", required: true, hint: "" });
  }
}

function renderLookup(s) {
  const base = { id: "gallery-kind-lookup-" + s.toLowerCase(), label: t("Exams.Field.IssuingAuthority"), placeholder: t("Exams.Field.IssuingAuthority.Placeholder"), hint: t("Lookup.Hint.MinChars", 2), required: true };
  switch (s) {
    case "Empty": return lookupField({ ...base, value: "", live: true });
    case "WithValue": return lookupField({ ...base, value: AUTHORITIES[1].text, hint: t("Exams.Field.IssuingAuthority.Hint"), live: true });
    case "Disabled": return lookupField({ ...base, value: AUTHORITIES[1].text, disabled: true });
    case "Error": return lookupField({ ...base, value: "", error: t("exam.issuing_authority_required") });
    case "LongText": return lookupField({ ...base, value: AUTHORITIES[0].text, error: t("Gallery.LongError"), open: true,
      list: listbox(base.id, [{ ...AUTHORITIES[0], selected: true }]) });
    case "Loading": return lookupField({ ...base, value: "pre", open: true, list: `<ul class="app-listbox" role="listbox" id="${base.id}-list"><li class="app-list-progress" role="presentation"><span class="app-spinner"></span></li></ul>` });
    case "Open": { const items = AUTHORITIES.filter(a => fold(a.text).includes("fun")); items[0].focused = true;
      return lookupField({ ...base, value: "Fun", open: true, list: listbox(base.id, items) }); }
    case "NoResults": return lookupField({ ...base, value: "Zelândia", open: true, list: listbox(base.id, [], esc(t("Lookup.NoResults", "Zelândia"))) });
    case "LeadingIcon": return lookupField({ ...base, value: "", leading: "gavel" }) + `<p class="kind-note">${esc(t("Gallery.FieldKinds.Note.LookupIcon"))}</p>`;
  }
}

function renderText(s) {
  const base = { id: "gallery-kind-text-" + s.toLowerCase(), label: t("Exams.Field.Name"), placeholder: t("Exams.Field.Name.Placeholder"), hint: t("Exams.Field.Name.Hint"), required: true };
  const sample = "Concurso PMF 2026 — Guarda Municipal";
  switch (s) {
    case "Empty": return textField({ ...base, value: "" });
    case "WithValue": return textField({ ...base, value: sample });
    case "Disabled": return textField({ ...base, value: sample, disabled: true });
    case "Error": return textField({ ...base, value: "", error: t("exam.name_required") });
    case "LongText": return textField({ ...base, value: "Concurso Público para Provimento de Cargos Efetivos do Quadro Permanente da Prefeitura Municipal de Florianópolis 2026 — Guarda Municipal", error: t("Gallery.LongError") });
    case "Loading": return `<div class="not-applicable">${esc(t("Gallery.FieldKinds.State.NotApplicable"))} ${esc(t("Gallery.FieldKinds.Note.TextLoading"))}</div>`;
    case "Open": case "NoResults": return `<div class="not-applicable">${esc(t("Gallery.FieldKinds.State.NotApplicable"))}</div>`;
    case "LeadingIcon": return textField({ ...base, value: sample, leading: "exams" });

}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  const stateBar = document.getElementById("demo-states");
  stateBar.innerHTML = STATES.map(s => `<button type="button" data-state="${s}" aria-pressed="${s === state}">${esc(t("Gallery.FieldKinds.State." + s))}</button>`).join(" ");
  const caption = `<p class="state-caption">${esc(t("Gallery.FieldKinds.State." + state))}</p>`;
  const col = (titleKey, icon, ruleKey, body) => `<div class="kind"><h3 class="kind-title">${svg(icon, 20)}<span>${esc(t(titleKey))}</span></h3><p class="kind-rule">${esc(t(ruleKey))}</p>${caption}${body}</div>`;
  document.getElementById("grid").innerHTML =
    col("Gallery.FieldKinds.Select", "expand", "Gallery.FieldKinds.Rule.Select", renderSelect(state)) +
    col("Gallery.FieldKinds.Lookup", "search", "Gallery.FieldKinds.Rule.Lookup", renderLookup(state)) +
    col("Gallery.FieldKinds.Text", "exams", "Gallery.FieldKinds.Rule.Text", renderText(state));
  wireLive();
}

/* ---- live behaviour of the combobox and the lookup in "Empty" and "With value" (what the kit does) ---- */
const live = document.getElementById("live");
function announce(text) { live.textContent = ""; setTimeout(() => { live.textContent = text; }, 30); }

function wireLive() {
  if (state !== "Empty" && state !== "WithValue") return;

  /* combobox: opens on focus with the whole list (BR4), narrows when the typed text differs from the selected option, Esc closes, blur restores */
  const sel = document.querySelector('[data-kind="select"]');
  if (sel) {
    const input = sel.querySelector("input"), arrowBtn = sel.querySelector(".is-arrow");
    let selectedKey = state === "WithValue" ? "Area.Mathematics" : null, focused = 0, open = false;
    const selectedText = () => areaOptions(selectedKey).find(a => a.selected).text;
    const visible = () => { const term = input.value; if (fold(term) === fold(selectedText()) || term === "") return areaOptions(selectedKey); return areaOptions(selectedKey).filter(a => fold(a.text).includes(fold(term))); };
    const paint = () => {
      sel.querySelector(".app-listbox")?.remove();
      input.setAttribute("aria-expanded", open);
      arrowBtn.innerHTML = svg(open ? "collapse" : "expand", 24);
      arrowBtn.setAttribute("aria-label", t(open ? "SelectField.Collapse" : "SelectField.Expand"));
      sel.classList.toggle("is-open", open);
      if (!open) return;
      const items = visible().map((a, i) => ({ ...a, focused: i === focused }));
      sel.insertAdjacentHTML("beforeend", items.length ? listbox(input.id, items) : listbox(input.id, [], esc(t("SelectField.NoResults", input.value))));
      if (items.length) input.setAttribute("aria-activedescendant", `${input.id}-opt-${focused}`); else input.removeAttribute("aria-activedescendant");
      sel.querySelectorAll(".app-option").forEach(li => li.addEventListener("mousedown", e => { e.preventDefault(); pick(visible()[+li.dataset.index]); }));
    };
    const openList = () => { open = true; focused = Math.max(0, visible().findIndex(a => a.selected)); paint(); announce(t("SelectField.Results", visible().length)); };
    const closeList = (restore) => { open = false; if (restore) input.value = selectedText(); paint(); };
    const pick = (opt) => { if (!opt) return; selectedKey = opt.key; input.value = opt.text; closeList(false); };
    input.addEventListener("focus", openList);
    input.addEventListener("input", () => { open = true; focused = 0; paint(); const n = visible().length; announce(n ? t("SelectField.Results", n) : t("SelectField.NoResults", input.value)); });
    input.addEventListener("keydown", e => {
      const items = visible();
      if (e.key === "ArrowDown") { e.preventDefault(); if (!open) openList(); else { focused = Math.min(items.length - 1, focused + 1); paint(); } }
      else if (e.key === "ArrowUp") { e.preventDefault(); if (open) { focused = Math.max(0, focused - 1); paint(); } }
      else if (e.key === "Home" && open) { e.preventDefault(); focused = 0; paint(); }
      else if (e.key === "End" && open) { e.preventDefault(); focused = items.length - 1; paint(); }
      else if (e.key === "Enter" && open) { e.preventDefault(); pick(items[focused]); }
      else if (e.key === "Escape" && open) { e.preventDefault(); e.stopPropagation(); closeList(true); }
    });
    input.addEventListener("blur", () => setTimeout(() => closeList(true), 0));
    arrowBtn.addEventListener("mousedown", e => { e.preventDefault(); if (open) closeList(true); else { input.focus(); if (!open) openList(); } });
  }

  /* lookup: nothing before 2 characters; then a 300 ms debounce, a progress ring, the results or "nothing found" */
  const lk = document.querySelector('[data-kind="lookup"]');
  if (lk) {
    const input = lk.querySelector("input"); let timer, open = false, focused = 0, results = [];
    const paint = (loading) => {
      lk.querySelector(".app-listbox")?.remove(); input.setAttribute("aria-expanded", open); lk.classList.toggle("is-open", open);
      if (!open) return;
      if (loading) { lk.insertAdjacentHTML("beforeend", `<ul class="app-listbox" role="listbox" id="${input.id}-list"><li class="app-list-progress" role="presentation"><span class="app-spinner"></span></li></ul>`); return; }
      lk.insertAdjacentHTML("beforeend", results.length ? listbox(input.id, results.map((r, i) => ({ ...r, focused: i === focused }))) : listbox(input.id, [], esc(t("Lookup.NoResults", input.value))));
      lk.querySelectorAll(".app-option").forEach(li => li.addEventListener("mousedown", e => { e.preventDefault(); pick(results[+li.dataset.index]); }));
    };
    const pick = r => { input.value = r.text; open = false; paint(); render(); };
    input.addEventListener("input", () => {
      clearTimeout(timer); const term = input.value.trim();
      if (term.length < 2) { open = false; paint(); return; }
      open = true; paint(true);
      timer = setTimeout(() => { results = AUTHORITIES.filter(a => fold(a.text).includes(fold(term))); focused = 0; paint(false); announce(results.length ? t("Lookup.Results", results.length) : t("Lookup.NoResults", term)); }, 300);
    });
    input.addEventListener("keydown", e => {
      if (!open) return;
      if (e.key === "ArrowDown") { e.preventDefault(); focused = Math.min(results.length - 1, focused + 1); paint(false); }
      else if (e.key === "ArrowUp") { e.preventDefault(); focused = Math.max(0, focused - 1); paint(false); }
      else if (e.key === "Enter") { e.preventDefault(); if (results[focused]) pick(results[focused]); }
      else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); open = false; paint(); }
    });
    input.addEventListener("blur", () => setTimeout(() => { open = false; paint(); }, 0));
    lk.querySelector(".is-clear")?.addEventListener("click", () => { input.value = ""; input.focus(); state = "Empty"; render(); document.getElementById(lk.querySelector("input").id.replace("withvalue", "empty"))?.focus(); });
  }
}

/* ---- demo chrome wiring ---- */
document.getElementById("demo-states").addEventListener("click", e => { const b = e.target.closest("[data-state]"); if (b) { state = b.dataset.state; render(); } });
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; render(); }));
function setTheme(th) { document.documentElement.dataset.theme = th; document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeBtn === th)); }
document.querySelectorAll("[data-theme-btn]").forEach(b => b.addEventListener("click", () => setTheme(b.dataset.themeBtn)));
document.getElementById("theme-toggle").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
setTheme("light");
render();
</script>
