<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-35 - Exam editions back office (mockup)</title>
<style>
/* ===========================================================================
   F-35 mockup - three screens:
   1. the editions section on /admin/exams/{id}
   2. the edition page /admin/exams/{examId}/editions/new and /{id}
   3. AppDateField (new kit component) as its /dev/ui gallery entry
   Visual language of the F-43 mockup. Every colour is a SimulabTheme token; no new colour.
   No external request: no web font, no icon font, no image.
   =========================================================================== */
:root {
  --app-font-xs: 0.75rem;
  --app-font-sm: 0.8125rem;
  --app-font-md: 0.9375rem;
  --app-font-lg: 1.0625rem;
  --app-font-xl: 1.25rem;
  --app-font-xxl: 1.75rem;
  --app-space-1: 4px;
  --app-space-2: 8px;
  --app-space-3: 12px;
  --app-space-4: 16px;
  --app-space-5: 24px;
  --app-space-6: 32px;
  --app-radius-sm: 6px;
  --app-radius-md: 10px;
  --app-radius-lg: 14px;

  /* PaletteLight */
  --primary: #216DB5;
  --primary-darken: #1858A0;
  --primary-lighten: #EBF3FD;
  --primary-contrast: #FFFFFF;
  --success: #1A9E8C;
  --success-contrast: #19243E;
  --warning: #D98B1A;
  --error: #BE3737;
  --error-contrast: #FFFFFF;
  --background: #F2F5FB;
  --surface: #FFFFFF;
  --drawer: #0F3266;
  --drawer-text: rgba(255,255,255,0.92);
  --appbar: #0F3266;
  --appbar-text: #FFFFFF;
  --text-primary: #19243E;
  --text-secondary: #4A5A7A;
  --action-default: #4A5A7A;
  --lines-inputs: #7E8AA1;
  --divider: #D0D8EA;
}
[data-theme="dark"] {
  /* PaletteDark */
  --primary: #64A2E3;
  --primary-darken: #5096DC;
  --primary-lighten: #162540;
  --primary-contrast: #19243E;
  --success: #1A9E8C;
  --success-contrast: #19243E;
  --warning: #D98B1A;
  --error: #E06C6C;
  --error-contrast: #19243E;
  --background: #0E1828;
  --surface: #172035;
  --drawer: #091422;
  --drawer-text: rgba(255,255,255,0.92);
  --appbar: #091422;
  --appbar-text: #FFFFFF;
  --text-primary: #E0E8F8;
  --text-secondary: #7A8EB0;
  --action-default: #7A8EB0;
  --lines-inputs: #61718F;
  --divider: #263352;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: var(--app-font-md); line-height: 1.65;
  background: var(--background); color: var(--text-primary);
  display: flex; flex-direction: column;
}
svg { display: block; flex-shrink: 0; }
a { color: inherit; }
button { font: inherit; }
:is(a, button, input, select, textarea, [tabindex]):focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.app-visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
[hidden] { display: none !important; }

/* ---- demo chrome (not part of the product) ---- */
.demo {
  display: flex; flex-direction: column; gap: var(--app-space-1);
  padding: var(--app-space-2) var(--app-space-4);
  background: var(--surface); border-bottom: 1px dashed var(--divider);
}
.demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--app-space-2); }
.demo-label {
  font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-secondary); margin-right: var(--app-space-1);
}
.demo button {
  font-size: var(--app-font-xs); font-weight: 600;
  padding: 3px 10px; border-radius: 20px; cursor: pointer;
  border: 1px solid var(--lines-inputs); background: var(--surface); color: var(--text-primary);
}
.demo button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-contrast); }
.demo-note {
  display: inline-block; font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-secondary); border: 1px dashed var(--divider);
  border-radius: 20px; padding: 0 var(--app-space-2); margin-bottom: var(--app-space-2);
}

/* ---- app shell ---- */
.appbar {
  height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: var(--app-space-2);
  padding: 0 var(--app-space-4); background: var(--appbar); color: var(--appbar-text);
}
.brand { font-weight: 700; letter-spacing: .09em; }
.spacer { flex: 1; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--success); color: var(--success-contrast);
  display: flex; align-items: center; justify-content: center; font-size: var(--app-font-xs); font-weight: 700;
}
.lay { flex: 1; display: flex; min-height: 0; }
.drawer { width: 260px; flex-shrink: 0; background: var(--drawer); color: var(--drawer-text); padding: var(--app-space-3) var(--app-space-2); overflow-y: auto; }
.nav-section { display: block; padding: var(--app-space-4) var(--app-space-3) var(--app-space-1); font-size: var(--app-font-xs); text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
.nav-link {
  display: flex; align-items: center; gap: var(--app-space-3);
  padding: var(--app-space-2) var(--app-space-3); border-left: 3px solid transparent;
  border-radius: var(--app-radius-sm); font-size: var(--app-font-sm); cursor: pointer;
}
.nav-link:hover { background: rgba(255,255,255,.08); }
.nav-link[aria-current="page"] { background: rgba(255,255,255,.14); border-left-color: var(--primary); font-weight: 600; }
.main { flex: 1; overflow-y: auto; padding: var(--app-space-5); }
@media (max-width: 959.98px) { .drawer { display: none; } .main { padding: var(--app-space-4); } }

/* ---- page header ---- */
.app-page-header { margin-bottom: var(--app-space-5); }
.app-breadcrumbs { font-size: var(--app-font-sm); color: var(--text-secondary); padding-bottom: var(--app-space-1); }
.app-breadcrumbs a { text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.app-page-title { font-size: var(--app-font-xxl); font-weight: 700; line-height: 1.2; }
.app-page-intro { color: var(--text-secondary); font-size: var(--app-font-sm); margin-top: var(--app-space-2); }

/* ---- layout ---- */
.app-form-layout { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: var(--app-space-4); align-items: start; }
@media (max-width: 1279.98px) { .app-form-layout { grid-template-columns: minmax(0, 1fr); } }
.app-form-card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-5); }
.app-form-card + .app-form-card, .app-form-layout + .app-form-card { margin-top: var(--app-space-4); }

/* ---- AppSectionCard ---- */
.app-section-card { border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-4) var(--app-space-4) var(--app-space-3); margin-bottom: var(--app-space-4); }
.app-section-card:last-child { margin-bottom: 0; }
.app-section-card-title { display: flex; align-items: center; gap: var(--app-space-2); font-size: var(--app-font-lg); font-weight: 600; }
.app-section-card-icon { color: var(--primary); }
.app-section-card-subtitle { font-size: var(--app-font-xs); color: var(--text-secondary); margin: var(--app-space-1) 0 var(--app-space-4); }
.app-section-note { font-size: var(--app-font-sm); color: var(--text-secondary); padding: var(--app-space-2) 0 var(--app-space-1); }

/* ---- AppFormGrid ---- */
.app-form-grid { display: grid; gap: var(--app-space-3) var(--app-space-4); }
.app-form-grid + .app-form-grid { margin-top: var(--app-space-3); }
.app-form-grid-1 { grid-template-columns: minmax(0, 1fr); }
.app-form-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 599.98px) { .app-form-grid-2 { grid-template-columns: minmax(0, 1fr); } }

/* ---- fields (AppTextField, AppLookupField, AppDateField) ---- */
.app-field { position: relative; margin-bottom: var(--app-space-4); }
.app-form-grid .app-field { margin-bottom: 0; }
.app-field-label { display: block; font-size: var(--app-font-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--app-space-1); }
.app-field-required { color: var(--error); margin-left: 3px; }
.app-field-input {
  display: flex; align-items: center; gap: var(--app-space-2);
  height: 42px; padding: 0 var(--app-space-1) 0 var(--app-space-3);
  border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-sm);
  background: var(--surface); color: var(--text-primary);
}
.app-field-input:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
.app-field-input input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; color: var(--text-primary); font: inherit; font-size: var(--app-font-md); }
.app-field-input input::placeholder { color: var(--text-secondary); }
.app-field-icon { color: var(--primary); }
.app-field-error .app-field-input { border-color: var(--error); }
.app-field-disabled .app-field-input { background: var(--background); border-color: var(--divider); border-style: dashed; }
.app-field-disabled .app-field-input input { color: var(--text-secondary); cursor: not-allowed; }
.app-field-hint, .app-field-error-text { display: block; font-size: var(--app-font-xs); line-height: 1.45; margin-top: var(--app-space-1); }
.app-field-hint { color: var(--text-secondary); }
.app-field-error-text { color: var(--error); font-weight: 600; }
.app-inline-button { border: 0; background: transparent; color: var(--primary); font-weight: 600; font-size: var(--app-font-xs); cursor: pointer; text-decoration: underline; margin-left: var(--app-space-2); min-height: 24px; }

.app-icon-button {
  width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--action-default);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
}
.app-icon-button:hover { background: var(--background); }
.app-icon-button[disabled] { cursor: not-allowed; opacity: .45; }
.app-icon-button.is-destructive { color: var(--error); }

/* tooltip (MudTooltip) */
.tip { position: relative; display: inline-flex; }
.tip::after {
  content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: var(--text-primary); color: var(--surface); font-size: var(--app-font-xs); line-height: 1.4;
  padding: 2px 8px; border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 30;
}
.tip:hover::after, .tip:focus-within::after { opacity: 1; }

/* ---- AppLookupField listbox ---- */
.app-lookup-list {
  position: absolute; left: 0; right: 0; top: 70px; z-index: 25; list-style: none;
  background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-sm);
  box-shadow: 0 6px 20px rgba(20,40,100,.18); max-height: 240px; overflow-y: auto; padding: var(--app-space-1) 0;
}
.app-lookup-list li { padding: var(--app-space-2) var(--app-space-3); font-size: var(--app-font-sm); cursor: pointer; }
.app-lookup-list li:hover, .app-lookup-list li:focus { background: var(--primary-lighten); outline: none; }
.app-lookup-message { color: var(--text-secondary); cursor: default !important; }

/* ---- AppDateField calendar (MudDatePicker popover) ---- */
.app-calendar {
  position: absolute; left: 0; top: 70px; z-index: 25; width: 300px;
  background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md);
  box-shadow: 0 6px 20px rgba(20,40,100,.18); padding: var(--app-space-3);
}
.app-calendar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--app-space-2); }
.app-calendar-title { font-weight: 700; font-size: var(--app-font-sm); text-transform: capitalize; }
.app-calendar table { width: 100%; border-collapse: collapse; }
.app-calendar th { font-size: var(--app-font-xs); color: var(--text-secondary); font-weight: 600; padding-bottom: var(--app-space-1); text-transform: capitalize; }
.app-calendar td { text-align: center; padding: 1px; }
.app-day {
  width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; color: var(--text-primary);
  cursor: pointer; font-size: var(--app-font-sm);
}
.app-day:hover { background: var(--primary-lighten); }
.app-day.is-today { box-shadow: inset 0 0 0 1px var(--primary); }
.app-day[aria-pressed="true"] { background: var(--primary); color: var(--primary-contrast); font-weight: 700; }
.app-day[disabled] { color: var(--text-secondary); opacity: .45; cursor: not-allowed; background: transparent; }

/* ---- AppRadioCards ---- */
.app-radio-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--app-space-3); }
@media (max-width: 599.98px) { .app-radio-cards { grid-template-columns: minmax(0, 1fr); } }
.app-radio-card {
  display: flex; align-items: flex-start; gap: var(--app-space-2); min-height: 56px; padding: var(--app-space-3);
  border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-sm);
  background: var(--surface); color: var(--text-primary); text-align: left; cursor: pointer;
}
.app-radio-card[aria-checked="true"] { border-color: var(--primary); background: var(--primary-lighten); }
.app-radio-dot { width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--lines-inputs); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.app-radio-card[aria-checked="true"] .app-radio-dot { border-color: var(--primary); }
.app-radio-card[aria-checked="true"] .app-radio-dot::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--primary); }
.app-radio-card-text { display: block; font-size: var(--app-font-sm); font-weight: 600; }
.app-radio-card-description { display: block; font-size: var(--app-font-xs); color: var(--text-secondary); line-height: 1.4; }

/* ---- AppAlert / AppErrorSummary ---- */
.app-alert {
  display: flex; gap: var(--app-space-3); align-items: flex-start;
  padding: var(--app-space-3) var(--app-space-4); border-radius: var(--app-radius-sm);
  background: var(--error); color: var(--error-contrast); margin-bottom: var(--app-space-4); font-size: var(--app-font-sm);
}
.app-alert-title { font-weight: 700; }
.app-error-summary-list { margin: var(--app-space-1) 0 0; padding-left: var(--app-space-5); }
.app-error-summary-list a { color: inherit; cursor: pointer; }

/* ---- buttons ---- */
.app-form-actions { display: flex; justify-content: flex-end; align-items: center; gap: var(--app-space-2); margin-top: var(--app-space-5); }
.app-button {
  font-size: var(--app-font-md); font-weight: 600; cursor: pointer; text-decoration: none;
  min-height: 40px; padding: 0 var(--app-space-5); border-radius: var(--app-radius-sm);
  display: inline-flex; align-items: center; gap: var(--app-space-2);
}
.app-button-text { border: 0; background: transparent; color: var(--text-primary); }
.app-button-filled { border: 0; background: var(--primary); color: var(--primary-contrast); }
.app-button-outlined { border: 1px solid var(--primary); background: transparent; color: var(--primary); padding: 0 var(--app-space-4); }
.app-button-outlined:hover { background: var(--primary-lighten); }
.app-button-danger { border: 0; background: var(--error); color: var(--error-contrast); }
.app-button[disabled] { opacity: .45; cursor: not-allowed; }
.app-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- AppFormAside ---- */
.app-form-aside { position: sticky; top: var(--app-space-4); background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-4) var(--app-space-4) var(--app-space-3); }
.app-form-aside-title { font-size: var(--app-font-md); font-weight: 700; margin-bottom: var(--app-space-2); }
.app-aside-row { display: flex; justify-content: space-between; gap: var(--app-space-3); padding: var(--app-space-2) 0; border-bottom: 1px solid var(--divider); font-size: var(--app-font-sm); }
.app-aside-row:last-of-type { border-bottom: 0; }
.app-aside-row dt { color: var(--text-secondary); font-weight: 600; flex: none; }
.app-aside-row dd { text-align: right; overflow-wrap: anywhere; }
.app-aside-row dd.empty { color: var(--text-secondary); font-style: italic; }
.app-checklist-title { font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin: var(--app-space-4) 0 var(--app-space-2); }
.app-checklist { list-style: none; display: flex; flex-direction: column; gap: var(--app-space-2); }
.app-checklist li { display: flex; align-items: center; gap: var(--app-space-2); font-size: var(--app-font-sm); }
.app-check-done { color: var(--success); }
.app-check-pending { color: var(--text-secondary); }

/* ---- AppItemRows + AppRowActions + AppStatusChip ---- */
.app-item-rows-list { list-style: none; border: 1px solid var(--divider); border-radius: var(--app-radius-sm); }
.app-item-row { display: flex; align-items: center; gap: var(--app-space-3); padding: var(--app-space-2) var(--app-space-2) var(--app-space-2) var(--app-space-3); border-bottom: 1px solid var(--divider); }
.app-item-row:last-child { border-bottom: 0; }
.app-item-row:hover { background: var(--background); }
.app-item-row-content { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: var(--app-space-1) var(--app-space-3); }
.app-item-row-label { font-weight: 600; font-size: var(--app-font-sm); }
.app-item-row-sep { color: var(--text-secondary); }
.app-item-row-meta { font-size: var(--app-font-xs); color: var(--text-secondary); }
.app-item-rows-empty { font-size: var(--app-font-sm); color: var(--text-secondary); padding: var(--app-space-4); border: 1px dashed var(--divider); border-radius: var(--app-radius-sm); text-align: center; }
.app-row-actions { display: flex; gap: var(--app-space-1); flex-shrink: 0; }
.app-item-rows-foot { margin-top: var(--app-space-3); }
.app-status-chip {
  display: inline-flex; align-items: center; gap: var(--app-space-2); padding: 0 10px; border: 1px solid var(--divider);
  border-radius: 20px; background: var(--surface); color: var(--text-primary); font-size: var(--app-font-xs); font-weight: 600; line-height: 1.8;
}
.app-status-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-secondary); }
.app-status-chip-success .app-status-chip-dot { background: var(--success); }

/* ---- states ---- */
.app-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--app-space-3);
  padding: var(--app-space-6) var(--app-space-4); text-align: center;
  background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); color: var(--text-secondary);
}
.app-state-inline { padding: var(--app-space-5) var(--app-space-4); border-style: dashed; }
.app-state-title { font-size: var(--app-font-xl); font-weight: 700; color: var(--text-primary); }
.app-state .is-error { color: var(--error); }
.app-link { color: var(--text-primary); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

/* ---- stub of the F-43 exam form ---- */
.stub-field { margin-bottom: var(--app-space-3); }
.stub-value { height: 42px; display: flex; align-items: center; padding: 0 var(--app-space-3); border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-sm); font-size: var(--app-font-md); }
.stub-value.empty { color: var(--text-secondary); }

/* ---- dialog (AppConfirmDialog) ---- */
.app-overlay { position: fixed; inset: 0; background: rgba(9,20,34,.55); display: flex; align-items: center; justify-content: center; z-index: 60; padding: var(--app-space-4); }
.app-dialog { width: 100%; max-width: 30rem; background: var(--surface); color: var(--text-primary); border-radius: var(--app-radius-md); padding: var(--app-space-5); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.app-dialog-title { font-size: var(--app-font-xl); font-weight: 700; margin-bottom: var(--app-space-2); }
.app-dialog-message { font-size: var(--app-font-sm); color: var(--text-secondary); }
.app-dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: var(--app-space-2); margin-top: var(--app-space-5); }
.app-dialog-actions .app-button { height: auto; min-height: 40px; padding-top: 6px; padding-bottom: 6px; text-align: left; }

/* ---- snackbar ---- */
.app-snackbar {
  position: fixed; right: var(--app-space-5); bottom: var(--app-space-5); z-index: 70;
  display: flex; align-items: center; gap: var(--app-space-2); padding: var(--app-space-3) var(--app-space-4); border-radius: var(--app-radius-sm);
  background: var(--success); color: var(--success-contrast); font-weight: 600; font-size: var(--app-font-sm); box-shadow: 0 4px 16px rgba(20,40,100,.25);
}

/* ---- gallery ---- */
.gallery-section { margin-top: var(--app-space-5); }
.gallery-section h2 { font-size: var(--app-font-xl); font-weight: 700; }
.gallery-hint { font-size: var(--app-font-sm); color: var(--text-secondary); margin-bottom: var(--app-space-2); }
.gallery-paper { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-4); }
.gallery-paper .app-form-grid { row-gap: var(--app-space-5); }
</style>
</head>
<body>

<!-- ===================== demo chrome (not part of the product) ===================== -->
<div class="demo">

/* ---- dates: shown in the reader's culture, parsed from what the reader typed ---- */
const fmtDate = (v) => v ? new Intl.DateTimeFormat(S.lang, { year: "numeric", month: "numeric", day: "numeric" })
  .format(new Date(v.y, v.m - 1, v.d)) : "";
const fmtDatePadded = (v) => {
  if (!v) return "";
  const p = (n) => String(n).padStart(2, "0");
  return S.lang === "en" ? `${v.m}/${v.d}/${v.y}` : `${p(v.d)}/${p(v.m)}/${v.y}`;
};
function parseDate(text) {
  const s = (text || "").trim();
  if (!s) return { value: null, invalid: false };
  const parts = s.split(/[\/.\-]/).map(x => x.trim());
  if (parts.length !== 3 || parts.some(x => !/^\d+$/.test(x)) || parts[2].length !== 4) return { value: null, invalid: true };
  const [a, b, y] = parts.map(Number);
  const m = S.lang === "en" ? a : b, d = S.lang === "en" ? b : a;
  const dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return { value: null, invalid: true };
  return { value: { y, m, d }, invalid: false };
}
const cmpDate = (a, b) => (a.y - b.y) || (a.m - b.m) || (a.d - b.d);

function mkDate(o) {
  return Object.assign({ labelKey: "ExamEditions.Field.AppliedOn", hintKey: null, required: false, disabled: false,
    value: null, text: null, invalid: false, errorKey: null, min: null, open: false, view: null }, o);
}

function loadForm(mode, e) {
  S.form = mode === "new"
    ? { mode, board: null, boardText: "", year: "", position: "", ref: "", url: "", status: "Draft" }
    : { mode, id: e.id, board: e.board, boardText: `${e.board.name} (${e.board.acr})`, year: String(e.year),
        position: e.position, ref: e.ref || "", url: e.url || "", status: e.status };
  S.saved = mode === "new" ? null : { year: e.year, position: e.position };
  S.dates[AO] = mkDate({ labelKey: "ExamEditions.Field.AppliedOn", hintKey: "ExamEditions.Field.AppliedOn.Hint",
    value: e && e.applied ? { ...e.applied } : null });
  S.errors = {}; S.alert = null; S.summary = false; S.saving = false; S.dirty = false;
  S.lookup = { open: false, failed: false };
  syncMin();
}

function setEditionState(st) {
  S.state.edition = st;
  S.dialog = null; S.snack = null;
  const e0 = SAMPLE_EDITIONS[0];
  switch (st) {
    case "new": case "loading": case "examnotfound": case "editionnotfound": case "denied":
      loadForm("new"); break;
    case "ready": loadForm("edit", e0); break;
    case "lookup": loadForm("new"); S.form.boardText = "con"; S.lookup.open = true; break;
    case "lookupfail": loadForm("new"); S.form.boardText = "con"; S.lookup.failed = true; break;
    case "calendar": loadForm("edit", e0); S.dates[AO].open = true; S.dates[AO].view = { y: 2026, m: 6 }; break;
    case "saving": loadForm("new"); Object.assign(S.form, { board: BOARDS[0], boardText: "Instituto Consulplan (CONSULPLAN)",
      year: "2026", position: NEW_EDITION.position, ref: NEW_EDITION.ref }); S.saving = true; S.dirty = true; break;
    case "success": loadForm("edit", NEW_EDITION); S.snack = "ExamEditions.Saved"; break;
    case "validation":
      loadForm("new");
      Object.assign(S.form, { year: "2026", position: NEW_EDITION.position, url: "www.manaus.am.gov.br/edital-guarda-2026" });
      S.dates[AO].value = { y: 2025, m: 12, d: 15 };
      S.dirty = true; syncMin(); validateAll(); S.summary = true; break;
    case "duplicate":
      loadForm("new");
      Object.assign(S.form, { board: e0.board, boardText: `${e0.board.name} (${e0.board.acr})`, year: "2026",
        position: "guarda municipal de 3a classe", ref: e0.ref });
      S.dirty = true; syncMin(); S.alert = "exam_edition.duplicate"; break;
    case "server": loadForm("edit", e0); S.form.ref = "Edital nº 01/2026 - retificado"; S.dirty = true; S.alert = "common.unexpected_error"; break;
    case "discard": loadForm("edit", e0); S.form.position = "Guarda Municipal de 2ª Classe"; S.dirty = true; S.dialog = { kind: "discard" }; break;
  }
}

function yearValue() {
  const n = Number(S.form.year);
  return /^\d{4}$/.test(String(S.form.year).trim()) && n >= 1990 && n <= MAX_YEAR ? n : null;
}
function syncMin() { const y = yearValue(); if (S.dates[AO]) S.dates[AO].min = y ? { y, m: 1, d: 1 } : null; }

/* comfort checks only; the Api runs the same rules */
function checkField(f) {
  switch (f) {
    case "board": S.errors.board = S.form.board ? null : "exam_edition.organizer_required"; break;
    case "year": S.errors.year = yearValue() ? null : "exam_edition.notice_year_invalid"; break;
    case "url": {
      const u = S.form.url.trim();
      S.errors.url = !u || (u.length <= 300 && /^https?:\/\/[^\s\/]+\.[^\s]+$/i.test(u)) ? null : "exam_edition.notice_url_invalid"; break;
    }
    case "date": {
      const d = S.dates[AO];
      const y = yearValue();
      d.errorKey = !d.invalid && d.value && y && d.value.y < y ? "exam_edition.applied_on_before_notice_year" : null; break;
    }
  }
}
function validateAll() { ["board", "year", "url", "date"].forEach(checkField); return errorItems(); }
function errorItems() {
  const d = S.dates[AO];
  return [
    [S.errors.board, "edition-organizer", "ExamEditions.Field.Organizer"],
    [S.errors.year, "edition-notice-year", "ExamEditions.Field.NoticeYear"],
    [S.errors.url, "edition-notice-url", "ExamEditions.Field.NoticeUrl"],

function fieldShell({ id, labelKey, required, inner, description, error, extra = "" }) {

    ${inner}
    ${extra}
    <span id="${id}-description" class="app-field-description">${description}</span>
  </div>`;
}
function describe(errorText, hintText) {
  return errorText ? `<span class="app-field-error-text">${esc(errorText)}</span>`
                   : (hintText ? `<span class="app-field-hint">${esc(hintText)}</span>` : "");
}

function textField({ id, field, labelKey, required, placeholderKey, hintKey, hintArg, iconName, maxlength, type = "text", inputmode }) {

        ${maxlength ? `maxlength="${maxlength}"` : ""} ${inputmode ? `inputmode="${inputmode}"` : ""}
        placeholder="${esc(t(placeholderKey))}" aria-describedby="${id}-description"
        ${required ? 'aria-required="true"' : ""} ${errKey ? 'aria-invalid="true"' : ""}>
    </div>`;
  return fieldShell({ id, labelKey, required, inner, error: errKey,
    description: describe(errKey && t(errKey), hintKey && t(hintKey, hintArg)) });
}

        placeholder="${esc(t("DateField.Format"))}" aria-describedby="${id}-description"

      ${d.value && !d.required && !d.disabled ? `<span class="tip" data-tip="${esc(t("DateField.Clear"))}"><button type="button" class="app-icon-button" data-action="date-clear" data-date="${id}" aria-label="${esc(t("DateField.Clear"))}">${icon("Close", 16)}</button></span>` : ""}
      <span class="tip" data-tip="${esc(t("DateField.OpenCalendar"))}"><button type="button" class="app-icon-button" data-action="cal-toggle" data-date="${id}" id="${id}-calendar-button"
        aria-label="${esc(t("DateField.OpenCalendar"))}" aria-haspopup="dialog" aria-expanded="${d.open}" ${d.disabled ? "disabled" : ""}>${icon("Calendar", 18)}</button></span>

    ${inner}
    ${d.open ? calendarHtml(id) : ""}
    <span id="${id}-description" class="app-field-description">${describe(errText, hint)}</span>
  </div>`;
}

function calendarHtml(id) {
  const d = S.dates[id];
  const view = d.view || (d.value ? { y: d.value.y, m: d.value.m } : { y: CURRENT_YEAR, m: 9 });
  d.view = view;
  const title = new Intl.DateTimeFormat(S.lang, { month: "long", year: "numeric" }).format(new Date(view.y, view.m - 1, 1));
  const firstDow = S.lang === "pt-PT" ? 1 : 0;       /* the culture's first day of the week */
  const wd = [];
  for (let i = 0; i < 7; i++) {
    const day = new Date(2026, 1, 1 + ((i + firstDow) % 7));   /* 1 Feb 2026 is a Sunday */
    wd.push(`<th scope="col" abbr="${esc(new Intl.DateTimeFormat(S.lang, { weekday: "long" }).format(day))}">${esc(new Intl.DateTimeFormat(S.lang, { weekday: "short" }).format(day).replace(".", ""))}</th>`);
  }
  const first = new Date(view.y, view.m - 1, 1);
  const lead = (first.getDay() - firstDow + 7) % 7;
  const days = new Date(view.y, view.m, 0).getDate();
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push("<td></td>");
  const focusDay = d.value && d.value.y === view.y && d.value.m === view.m ? d.value.d : 1;
  for (let n = 1; n <= days; n++) {
    const v = { y: view.y, m: view.m, d: n };
    const selected = d.value && cmpDate(d.value, v) === 0;
    const disabled = d.min && cmpDate(v, d.min) < 0;
    const today = view.y === 2026 && view.m === 9 && n === 28;
    const label = new Intl.DateTimeFormat(S.lang, { dateStyle: "full" }).format(new Date(view.y, view.m - 1, n));
    cells.push(`<td><button type="button" class="app-day ${today ? "is-today" : ""}" data-action="cal-pick" data-date="${id}" data-day="${n}"
      aria-label="${esc(label)}" aria-pressed="${!!selected}" tabindex="${n === focusDay ? 0 : -1}" ${disabled ? "disabled" : ""}>${n}</button></td>`);
  }
  while (cells.length % 7) cells.push("<td></td>");
  const rows = [];
  for (let i = 0; i < cells.length; i += 7) rows.push(`<tr>${cells.slice(i, i + 7).join("")}</tr>`);
  return `
    <div class="app-calendar" role="dialog" aria-label="${esc(t(d.labelKey))}" data-calendar="${id}">
      <div class="app-calendar-head">
        <span class="tip" data-tip="${esc(t("DateField.PreviousMonth"))}"><button type="button" class="app-icon-button" data-action="cal-prev" data-date="${id}" aria-label="${esc(t("DateField.PreviousMonth"))}">${icon("ChevronLeft", 20)}</button></span>
        <span class="app-calendar-title" aria-live="polite">${esc(title)}</span>
        <span class="tip" data-tip="${esc(t("DateField.NextMonth"))}"><button type="button" class="app-icon-button" data-action="cal-next" data-date="${id}" aria-label="${esc(t("DateField.NextMonth"))}">${icon("ChevronRight", 20)}</button></span>
      </div>
      <table role="grid"><thead><tr>${wd.join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>
    </div>`;
}

function refreshDate(id, focus) {

  renderDemo();
  $("drawer").innerHTML = navHtml();
  $("main").innerHTML = S.screen === "exam" ? examHtml() : S.screen === "edition" ? editionHtml() : galleryHtml();
  $("dialog-root").innerHTML = dialogHtml();
  renderSnack();
  if (S.dialog) $("dlg-cancel")?.focus();
}

function setState(st) {
  if (S.screen === "exam") setExamState(st);
  else if (S.screen === "edition") setEditionState(st);
  else setGalleryState(st);
  render();
  if (S.screen === "edition" && S.state.edition === "validation") $("edition-error-summary")?.focus();
}

/* ---- events ---- */
document.addEventListener("click", (ev) => {
  const demo = ev.target.closest(".demo button");
  if (demo) {
    if (demo.dataset.screen) { S.screen = demo.dataset.screen; setState(S.state[S.screen]); return; }
    if (demo.dataset.state) { setState(demo.dataset.state); return; }
    if (demo.dataset.lang) { S.lang = demo.dataset.lang; S.dates[AO] && (S.dates[AO].text = null); render(); return; }
    if (demo.dataset.themeBtn) { S.theme = demo.dataset.themeBtn; render(); return; }
  }
  const el = ev.target.closest("[data-action]");
  if (!el) {
    /* a click outside closes an open calendar or list */
    let changed = false;
    Object.entries(S.dates).forEach(([id, d]) => { if (d.open && !ev.target.closest(`#wrap-${id}`)) { d.open = false; changed = true; refreshDate(id); } });
    if (S.lookup.open && !ev.target.closest("#wrap-edition-organizer")) { S.lookup.open = false; refreshLookup(); }
    return;
  }
  const a = el.dataset.action;
  if (a !== "focus-field") ev.preventDefault();
  switch (a) {
    case "retry-editions": setState("ready"); break;
    case "add-edition": S.screen = "edition"; setEditionState("new"); render(); $("edition-organizer")?.focus(); break;
    case "edit-edition": {
      const e = S.editions.find(x => x.id === Number(el.dataset.id));
      S.screen = "edition"; S.state.edition = "ready"; S.dialog = null; S.snack = null; loadForm("edit", e); render(); break;
    }
    case "delete-edition": S.dialog = { kind: "delete", id: Number(el.dataset.id) }; S.lastTrigger = el.dataset.id; render(); break;
    case "dlg-cancel": {
      const kind = S.dialog.kind; S.dialog = null; render();
      if (kind === "delete") document.querySelector(`[data-action="delete-edition"][data-id="${S.lastTrigger}"]`)?.focus();
      break;
    }
    case "dlg-confirm":
      if (S.dialog.kind === "delete") {
        const e = S.editions.find(x => x.id === S.dialog.id);
        S.dialog = null;
        if (e.status === "Published") { S.sectionAlert = "exam_edition.published"; S.state.exam = "refused"; render(); }
        else {
          const idx = S.editions.indexOf(e);
          S.editions.splice(idx, 1); S.sectionAlert = null; S.snack = "ExamEditions.Deleted"; S.state.exam = "deleted"; render();
          const next = S.editions[idx] || null;
          (next ? document.querySelector(`[data-action="edit-edition"][data-id="${next.id}"]`) : $("add-edition-link"))?.focus();
        }
      } else { S.dialog = null; S.screen = "exam"; setExamState("ready"); render(); }
      break;
    case "go-exam": case "cancel":
      if (S.screen === "edition" && S.dirty && a === "cancel") { S.dialog = { kind: "discard" }; render(); }
      else { S.screen = "exam"; setExamState("ready"); render(); }
      break;
    case "pick-board": {
      const b = BOARDS[Number(el.dataset.idx)];
      S.form.board = b; S.form.boardText = `${b.name} (${b.acr})`; S.lookup.open = false; S.errors.board = null; S.dirty = true;
      rerenderField("wrap-edition-organizer", lookupField()); $("edition-organizer")?.focus(); refreshAside(); break;
    }
    case "clear-board":
      S.form.board = null; S.form.boardText = ""; S.dirty = true;
      rerenderField("wrap-edition-organizer", lookupField()); $("edition-organizer")?.focus(); refreshAside(); break;
    case "lookup-retry":
      S.lookup.failed = false; S.lookup.open = true; rerenderField("wrap-edition-organizer", lookupField()); $("edition-organizer")?.focus(); break;
    case "pick-status": selectStatus(el.dataset.value); break;
    case "focus-field": ev.preventDefault(); $(el.dataset.target)?.focus(); break;
    case "save": save(); break;
    case "cal-toggle": {
      const d = S.dates[el.dataset.date]; d.open = !d.open;
      if (d.open) d.view = d.value ? { y: d.value.y, m: d.value.m } : (d.min ? { y: d.min.y, m: 1 } : { y: CURRENT_YEAR, m: 9 });
      refreshDate(el.dataset.date, d.open ? "day" : "button"); break;
    }
    case "cal-prev": case "cal-next": {
      const d = S.dates[el.dataset.date]; let { y, m } = d.view; m += a === "cal-next" ? 1 : -1;
      if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } d.view = { y, m };
      refreshDate(el.dataset.date); document.querySelector(`[data-calendar="${el.dataset.date}"] [data-action="${a}"]`)?.focus(); break;
    }
    case "cal-pick": {
      const id = el.dataset.date, d = S.dates[id];
      d.value = { y: d.view.y, m: d.view.m, d: Number(el.dataset.day) }; d.text = null; d.invalid = false; d.open = false;
      if (id === AO) { S.dirty = true; checkField("date"); }
      refreshDate(id, "input"); break;
    }
    case "date-clear": {
      const id = el.dataset.date, d = S.dates[id];
      d.value = null; d.text = null; d.invalid = false; d.errorKey = null;
      if (id === AO) S.dirty = true;
      refreshDate(id, "input"); break;
    }
  }
});

function rerenderField(wrapId, html) { const w = $(wrapId); if (w) w.outerHTML = html; }
function refreshLookup() {
  const input = $("edition-organizer");
  const pos = input ? input.selectionStart : null;
  const focused = document.activeElement === input;
  rerenderField("wrap-edition-organizer", lookupField());
  if (focused) { const i = $("edition-organizer"); i.focus(); if (pos != null) i.setSelectionRange(pos, pos); }
}
function selectStatus(v) {
  S.form.status = v; S.dirty = true;
  rerenderField("wrap-edition-status", statusCards());
  $("edition-status-" + v)?.focus(); refreshAside();
}

function setFieldError(id, errText, hintText) {
  const wrap = $("wrap-" + id), input = $(id);
  if (!wrap || !input) return;
  wrap.classList.toggle("app-field-error", !!errText);
  if (errText) input.setAttribute("aria-invalid", "true"); else input.removeAttribute("aria-invalid");
  $(id + "-description").innerHTML = describe(errText, hintText);
}

document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset.field) {
    S.form[el.dataset.field] = el.value; S.dirty = true;
    if (el.dataset.field === "boardText") {
      S.form.board = null; S.lookup.open = true; S.lookup.failed = false; refreshLookup();
      const n = BOARDS.filter(b => el.value.trim().length >= 2 && (b.name.toLowerCase().includes(el.value.trim().toLowerCase()) || b.acr.toLowerCase().includes(el.value.trim().toLowerCase()))).length;
      $("live").textContent = el.value.trim().length >= 2 ? (n ? t("Lookup.Results", n) : t("Lookup.NoResults", el.value.trim())) : "";
    }
    if (el.dataset.field === "year") syncMin();
    refreshAside();
  }
  if (el.dataset.date) { S.dates[el.dataset.date].text = el.value; if (el.dataset.date === AO) S.dirty = true; }
});

document.addEventListener("focusout", (ev) => {
  const el = ev.target;
  if (S.screen === "edition" && el.dataset.field) {
    const map = { year: ["edition-notice-year", "year", "ExamEditions.Field.NoticeYear.Hint", String(MAX_YEAR)],
                  url: ["edition-notice-url", "url", "ExamEditions.Field.NoticeUrl.Hint"] };
    const m = map[el.dataset.field];
    if (m) {
      checkField(m[1]);
      setFieldError(m[0], S.errors[m[1]] && t(S.errors[m[1]]), t(m[2], m[3]));
      if (m[1] === "year") { checkField("date"); refreshDateDescription(AO); }
    }
  }
  if (el.dataset.date) {
    const id = el.dataset.date, d = S.dates[id];
    if (d.text != null) {
      const p = parseDate(d.text);
      d.invalid = p.invalid; d.value = p.value; if (!p.invalid) d.text = null;
      if (id === AO) checkField("date");
      refreshDateDescription(id);
      if (!p.invalid && p.value) el.value = fmtDatePadded(p.value);
      if (S.screen === "edition") refreshAside();
    }
  }
});

function refreshDateDescription(id) {
  const d = S.dates[id];
  if (!d) return;
  const errText = d.invalid ? t("DateField.Invalid", t("DateField.Format")) : (d.errorKey ? t(d.errorKey) : null);
  setFieldError(id, errText, d.hintKey ? t(d.hintKey) : t("DateField.Hint.Format", t("DateField.Format")));
}

document.addEventListener("keydown", (ev) => {
  const el = ev.target;
  if (ev.key === "Escape") {
    if (S.dialog) { ev.preventDefault(); const kind = S.dialog.kind; S.dialog = null; render(); return; }
    const cal = el.closest && el.closest("[data-calendar]");
    if (cal) { const id = cal.dataset.calendar; S.dates[id].open = false; refreshDate(id, "button"); return; }
    if (S.lookup.open) { S.lookup.open = false; refreshLookup(); return; }
  }
  /* calendar grid: arrows move the day, Enter picks it (MudDatePicker behaviour) */
  if (el.classList && el.classList.contains("app-day")) {
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[ev.key];
    if (step) {
      ev.preventDefault();
      const all = [...el.closest("table").querySelectorAll(".app-day")];
      const target = all[Math.min(all.length - 1, Math.max(0, all.indexOf(el) + step))];
      all.forEach(b => b.tabIndex = -1); target.tabIndex = 0; target.focus();
    }
  }
  /* lookup: arrow down enters the list, Enter picks */
  if (el.id === "edition-organizer" && ev.key === "ArrowDown") {
    const first = document.querySelector('#edition-organizer-list [data-action="pick-board"]');
    if (first) { ev.preventDefault(); first.focus(); }
  }
  if (el.getAttribute && el.getAttribute("role") === "option") {
    if (ev.key === "Enter") { ev.preventDefault(); el.click(); }
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      const sib = ev.key === "ArrowDown" ? el.nextElementSibling : el.previousElementSibling;
      (sib || (ev.key === "ArrowUp" ? $("edition-organizer") : null))?.focus();
    }
  }
  /* radio cards: one tab stop, arrows move, Space and Enter select */
  if (el.getAttribute && el.getAttribute("role") === "radio" && el.dataset.value) {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(ev.key)) { ev.preventDefault(); selectStatus(el.dataset.value === "Draft" ? "Published" : "Draft"); }
    if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); selectStatus(el.dataset.value); }
  }
  if (el.matches && el.matches("a[tabindex], .app-link") && ev.key === "Enter") el.click();
});

function save() {
  /* the date typed but not yet left is parsed first, as the blur would */
  const d = S.dates[AO];
  if (d.text != null) { const p = parseDate(d.text); d.invalid = p.invalid; d.value = p.value; if (!p.invalid) d.text = null; }
  const items = validateAll();
  if (items.length) { S.summary = true; S.alert = null; render(); $("edition-error-summary")?.focus(); return; }
  S.summary = false; S.alert = null; S.saving = true; S.state.edition = "saving"; render();
  setTimeout(() => {
    S.saving = false; S.dirty = false;
    S.form.mode = "edit";
    S.saved = { year: Number(S.form.year), position: S.form.position.trim() };
    S.snack = "ExamEditions.Saved"; S.state.edition = "success"; render();
  }, 1200);
}

setExamState("ready");
setEditionState("ready");
setGalleryState("default");
render();
</script>
</body>
</html>
