<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-43 - Exam form (reference screen)</title>
<style>
/* ===========================================================================
   F-43 mockup - /admin/exams/new and /admin/exams/{id}
   Every colour is a SimulabTheme token (src/Hosts/Simulab.Web/Theme/SimulabTheme.cs).
   The scale tokens below are the ones BR5 puts on :root in app.css.
   No external request: no web font, no icon font, no image.
   =========================================================================== */
:root {
  /* Type scale */
  --app-font-xs: 0.75rem;
  --app-font-sm: 0.8125rem;
  --app-font-md: 0.9375rem;
  --app-font-lg: 1.0625rem;
  --app-font-xl: 1.25rem;
  --app-font-xxl: 1.75rem;
  /* Spacing scale */
  --app-space-1: 4px;
  --app-space-2: 8px;
  --app-space-3: 12px;
  --app-space-4: 16px;
  --app-space-5: 24px;
  --app-space-6: 32px;
  /* Radius scale */
  --app-radius-sm: 6px;
  --app-radius-md: 10px;
  --app-radius-lg: 14px;

  /* PaletteLight */
  --primary: #216DB5;
  --primary-darken: #1858A0;
  --primary-lighten: #EBF3FD;
  --success: #1A9E8C;
  --success-contrast: #19243E;
  --warning: #D98B1A;
  --error: #BE3737;
  --error-contrast: #FFFFFF;
  --background: #F2F5FB;
  --surface: #FFFFFF;
  --drawer: #0F3266;
  --drawer-text: rgba(255,255,255,0.92);
  --appbar: #0F3266;
  --appbar-text: #FFFFFF;
  --text-primary: #19243E;
  --text-secondary: #4A5A7A;
  --action-default: #4A5A7A;
  --lines-inputs: #7E8AA1;
  --divider: #D0D8EA;
}
[data-theme="dark"] {
  /* PaletteDark */
  --primary: #64A2E3;
  --primary-darken: #5096DC;
  --primary-lighten: #162540;
  --success: #1A9E8C;
  --success-contrast: #19243E;
  --warning: #D98B1A;
  --error: #E06C6C;
  --error-contrast: #19243E;
  --background: #0E1828;
  --surface: #172035;
  --drawer: #091422;
  /* BR7 fixes the drawer's dim text; the mockup shows the readable value. */
  --drawer-text: rgba(255,255,255,0.92);
  --appbar: #091422;
  --appbar-text: #FFFFFF;
  --text-primary: #E0E8F8;
  --text-secondary: #7A8EB0;
  --action-default: #7A8EB0;
  --lines-inputs: #61718F;
  --divider: #263352;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: var(--app-font-md);
  line-height: 1.65;
  background: var(--background);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
}
svg { display: block; flex-shrink: 0; }
a { color: inherit; }
:is(a, button, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.app-visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---- demo chrome (not part of the product) ---- */
.demo {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--app-space-2);
  padding: var(--app-space-2) var(--app-space-4);
  background: var(--surface); border-bottom: 1px dashed var(--divider);
}
.demo-label {
  font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-secondary); margin-right: var(--app-space-1);
}
.demo button {
  font: inherit; font-size: var(--app-font-xs); font-weight: 600;
  padding: 4px 10px; border-radius: 20px; cursor: pointer;
  border: 1px solid var(--lines-inputs); background: var(--surface); color: var(--text-primary);
}
.demo button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--surface); }
[data-theme="dark"] .demo button[aria-pressed="true"] { color: #19243E; }

/* ---- app shell ---- */
.appbar {
  height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: var(--app-space-2);
  padding: 0 var(--app-space-4); background: var(--appbar); color: var(--appbar-text);
}
.brand { font-weight: 700; letter-spacing: .09em; }
.spacer { flex: 1; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--success);
  color: var(--success-contrast); display: flex; align-items: center; justify-content: center;
  font-size: var(--app-font-xs); font-weight: 700;
}
.lay { flex: 1; display: flex; min-height: 0; }
.drawer {
  width: 260px; flex-shrink: 0; background: var(--drawer); color: var(--drawer-text);
  padding: var(--app-space-3) var(--app-space-2); overflow-y: auto;
}
.nav-section {
  display: block; padding: var(--app-space-4) var(--app-space-3) var(--app-space-1);
  font-size: var(--app-font-xs); text-transform: uppercase; letter-spacing: .06em; opacity: .7;
}
.nav-link {
  display: flex; align-items: center; gap: var(--app-space-3);
  padding: var(--app-space-2) var(--app-space-3); border-left: 3px solid transparent;
  border-radius: var(--app-radius-sm); font-size: var(--app-font-sm); cursor: pointer;
}
.nav-link:hover { background: rgba(255,255,255,.08); }
.nav-link[aria-current="page"] {
  background: rgba(255,255,255,.14); border-left-color: var(--primary); font-weight: 600;
}
.main { flex: 1; overflow-y: auto; padding: var(--app-space-5); }
@media (max-width: 959.98px) { .drawer { display: none; } .main { padding: var(--app-space-4); } }

/* ---- page header ---- */
.app-page-header { margin-bottom: var(--app-space-5); }
.app-breadcrumbs { font-size: var(--app-font-sm); color: var(--text-secondary); padding-bottom: var(--app-space-1); }
.app-breadcrumbs a { text-decoration: underline; text-underline-offset: 2px; }
.app-page-title { font-size: var(--app-font-xxl); font-weight: 700; line-height: 1.2; }

/* ---- page layout: form + read-only aside (BR4) ---- */
.app-form-layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 20rem;
  gap: var(--app-space-4); align-items: start;
}
@media (max-width: 1279.98px) { .app-form-layout { grid-template-columns: minmax(0, 1fr); } }

.app-form-card {
  background: var(--surface); border: 1px solid var(--divider);
  border-radius: var(--app-radius-md); padding: var(--app-space-5);
}

/* ---- AppSectionCard: same shape as the existing .app-permission-group ---- */
.app-section-card {
  border: 1px solid var(--divider); border-radius: var(--app-radius-md);
  padding: var(--app-space-4) var(--app-space-4) var(--app-space-3);
  margin-bottom: var(--app-space-4);
}
.app-section-card-title {
  display: flex; align-items: center; gap: var(--app-space-2);
  font-size: var(--app-font-lg); font-weight: 600; color: var(--text-primary);
}
/* BR3, place 1 of 4: the section card's icon and title carry the accent. */
.app-section-card-icon { color: var(--primary); }
.app-section-card-subtitle {
  font-size: var(--app-font-xs); color: var(--text-secondary);
  margin: var(--app-space-1) 0 var(--app-space-4);
}

/* ---- AppFormGrid ---- */
.app-form-grid { display: grid; gap: var(--app-space-3) var(--app-space-4); }
.app-form-grid-1 { grid-template-columns: minmax(0, 1fr); }
.app-form-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.app-form-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 599.98px) {
  .app-form-grid-2, .app-form-grid-3 { grid-template-columns: minmax(0, 1fr); }
}

/* ---- fields ---- */
.app-field { margin-bottom: var(--app-space-4); }
.app-form-grid .app-field { margin-bottom: 0; }
.app-field-label {
  display: block; font-size: var(--app-font-xs); font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--app-space-1);
}
.app-field-required { color: var(--error); margin-left: 3px; }
.app-field-input {
  display: flex; align-items: center; gap: var(--app-space-2);
  height: 42px; padding: 0 var(--app-space-3);
  border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-sm);
  background: var(--surface); color: var(--text-primary);
}
.app-field-input:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
.app-field-input input, .app-field-input select {
  flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent;
  color: var(--text-primary); font: inherit; font-size: var(--app-font-md);
}
.app-field-input select { cursor: pointer; }
.app-field-input input::placeholder { color: var(--text-secondary); }
/* BR3, place 3 of 4: the field's leading icon. */
.app-field-icon { color: var(--primary); }
.app-field-error .app-field-input { border-color: var(--error); }
/* BR6: the hint reads in text-secondary (6.92:1 light, 4.89:1 dark on the surface). */
.app-field-hint, .app-field-error-text {
  display: block; font-size: var(--app-font-xs); line-height: 1.45; margin-top: var(--app-space-1);
}
.app-field-hint { color: var(--text-secondary); }
.app-field-error-text { color: var(--error); font-weight: 600; }

/* ---- AppRadioCards ---- */
.app-radio-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--app-space-3); }
@media (max-width: 899.98px) { .app-radio-cards { grid-template-columns: minmax(0, 1fr); } }
.app-radio-card {
  display: flex; align-items: flex-start; gap: var(--app-space-2);
  min-height: 56px; padding: var(--app-space-3);
  border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-sm);
  background: var(--surface); color: var(--text-primary); text-align: left; cursor: pointer; font: inherit;
}
.app-radio-card[aria-checked="true"] { border-color: var(--primary); background: var(--primary-lighten); }
.app-radio-dot {
  width: 18px; height: 18px; margin-top: 2px; border-radius: 50%;
  border: 2px solid var(--lines-inputs); display: flex; align-items: center; justify-content: center;
}
.app-radio-card[aria-checked="true"] .app-radio-dot { border-color: var(--primary); }
.app-radio-card[aria-checked="true"] .app-radio-dot::after {
  content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--primary);
}
.app-radio-card-text { font-size: var(--app-font-sm); font-weight: 600; }
.app-radio-card-description { font-size: var(--app-font-xs); color: var(--text-secondary); line-height: 1.4; }

/* ---- AppConditionalField ---- */
.app-conditional-field { margin-top: var(--app-space-4); max-width: 22rem; }
.app-conditional-field[hidden] { display: none; }

/* ---- AppErrorSummary / AppAlert (filled, kit) ---- */
.app-alert {
  display: flex; gap: var(--app-space-3); align-items: flex-start;
  padding: var(--app-space-3) var(--app-space-4); border-radius: var(--app-radius-sm);
  background: var(--error); color: var(--error-contrast); margin-bottom: var(--app-space-4);
  font-size: var(--app-font-sm);
}
.app-alert[hidden] { display: none; }
.app-alert-title { font-weight: 700; }
.app-error-summary-list { margin: var(--app-space-1) 0 0; padding-left: var(--app-space-5); }
.app-error-summary-list a { color: inherit; }

/* ---- AppFormActions (BR4: bottom right of the form card) ---- */
.app-form-actions {
  display: flex; justify-content: flex-end; align-items: center;
  gap: var(--app-space-2); margin-top: var(--app-space-5);
}
.app-button {
  font: inherit; font-size: var(--app-font-md); font-weight: 600; cursor: pointer;
  min-height: 40px; padding: 0 var(--app-space-5); border-radius: var(--app-radius-sm);
  display: inline-flex; align-items: center; gap: var(--app-space-2);
}
.app-button-text { border: 0; background: transparent; color: var(--text-primary); }
.app-button-filled { border: 0; background: var(--primary); color: var(--surface); }
[data-theme="dark"] .app-button-filled { color: #19243E; }
.app-button[disabled] { opacity: .45; cursor: not-allowed; }
.app-spinner {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid currentColor; border-top-color: transparent; animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- AppFormAside (read-only, no button) ---- */
.app-form-aside {
  position: sticky; top: var(--app-space-4);
  background: var(--surface); border: 1px solid var(--divider);
  border-radius: var(--app-radius-md); padding: var(--app-space-4) var(--app-space-4) var(--app-space-3);
}
.app-form-aside-title { font-size: var(--app-font-md); font-weight: 700; margin-bottom: var(--app-space-2); }
.app-aside-row {
  display: flex; justify-content: space-between; gap: var(--app-space-3);
  padding: var(--app-space-2) 0; border-bottom: 1px solid var(--divider); font-size: var(--app-font-sm);
}
.app-aside-row:last-of-type { border-bottom: 0; }
.app-aside-row-label { color: var(--text-secondary); font-weight: 600; flex: none; }
.app-aside-row-value { text-align: right; }
.app-aside-row-value.empty { color: var(--text-secondary); font-style: italic; }
.app-checklist-title {
  font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-secondary); margin: var(--app-space-4) 0 var(--app-space-2);
}
.app-checklist { list-style: none; display: flex; flex-direction: column; gap: var(--app-space-2); }
.app-checklist li { display: flex; align-items: center; gap: var(--app-space-2); font-size: var(--app-font-sm); }
.app-check-done { color: var(--success); }
.app-check-pending { color: var(--text-secondary); }

/* ---- states ---- */
.app-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--app-space-3); padding: var(--app-space-6) var(--app-space-4); text-align: center;
  background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md);
  color: var(--text-secondary);
}
.app-state-title { font-size: var(--app-font-xl); font-weight: 700; color: var(--text-primary); }
.app-link { color: var(--text-primary); text-decoration: underline; text-underline-offset: 2px; }

/* ---- snackbar ---- */
.app-snackbar {
  position: fixed; right: var(--app-space-5); bottom: var(--app-space-5); z-index: 50;
  display: flex; align-items: center; gap: var(--app-space-2);
  padding: var(--app-space-3) var(--app-space-4); border-radius: var(--app-radius-sm);
  background: var(--success); color: var(--success-contrast); font-weight: 600;
  font-size: var(--app-font-sm); box-shadow: 0 4px 16px rgba(20,40,100,.25);
}
.app-snackbar[hidden] { display: none; }

/* ---- AppStatusChip: not used by this screen; shown in the demo strip (open question 1) ---- */
.kit-strip {
  margin-top: var(--app-space-5); padding: var(--app-space-3) var(--app-space-4);
  border: 1px dashed var(--divider); border-radius: var(--app-radius-md);
  display: flex; align-items: center; flex-wrap: wrap; gap: var(--app-space-3);
  font-size: var(--app-font-xs); color: var(--text-secondary);
}
/* BR3, place 2 of 4: the status chip. Text is text-primary on the surface; the dot carries the state
   colour, so the chip is never colour alone. */
.app-status-chip {
  display: inline-flex; align-items: center; gap: var(--app-space-2);
  padding: 2px 10px; border: 1px solid var(--divider); border-radius: 20px;
  background: var(--surface); color: var(--text-primary); font-size: var(--app-font-xs); font-weight: 600;
}
.app-status-chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--text-secondary); }
.app-status-chip.is-success::before { background: var(--success); }
.app-status-chip.is-warning::before { background: var(--warning); }
[hidden] { display: none !important; }
</style>
</head>
<body>

<!-- ===================== demo chrome (not part of the product) ===================== -->
<div class="demo">
  <span class="demo-label">Demo &middot; state</span>
  <button type="button" data-state="loading">Loading</button>
  <button type="button" data-state="new" aria-pressed="true">New (empty)</button>
  <button type="button" data-state="ready">Ready (edit)</button>
  <button type="button" data-state="saving">Saving</button>
  <button type="button" data-state="success">Success</button>
  <button type="button" data-state="validation">Validation error</button>
  <button type="button" data-state="server">Server error</button>
  <button type="button" data-state="notfound">Not found</button>
  <button type="button" data-state="denied">Permission denied</button>
  <span class="demo-label">Demo &middot; language</span>
  <button type="button" data-lang="pt-BR" aria-pressed="true">pt-BR</button>
  <button type="button" data-lang="pt-PT">pt-PT</button>
  <button type="button" data-lang="en">en</button>
  <span class="demo-label">Demo &middot; theme</span>
  <button type="button" data-theme-btn="light" aria-pressed="true">Light</button>
  <button type="button" data-theme-btn="dark">Dark</button>
</div>

<header class="appbar">
  <span class="brand">SIMULAB</span>
  <span class="spacer"></span>
  <span class="avatar">AC</span>
</header>

<div class="lay">
  <nav class="drawer" aria-label="Main">
    <span class="nav-section" data-i18n="Nav.Section.Content"></span>
    <span class="nav-link" aria-current="page">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11zM8 12h8v2H8v-2zm0 4h8v2H8v-2z"/></svg>
      <span data-i18n="Exams.Title"></span>
    </span>
    <span class="nav-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 8v2h20V8L12 3zm0 2.2 5.6 2.8H6.4L12 5.2zM4 11v8H2v2h20v-2h-2v-8h-2v8h-3v-8h-2v8H8v-8H4z"/></svg>
      <span data-i18n="IssuingAuthorities.Title"></span>
    </span>
    <span class="nav-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 8v2h20V8L12 3zM6 12v6h2v-6H6zm5 0v6h2v-6h-2zm5 0v6h2v-6h-2zM2 20v2h20v-2H2z"/></svg>
      <span data-i18n="Organizers.Title"></span>
    </span>
    <span class="nav-section" data-i18n="Nav.Section.Administration"></span>
    <span class="nav-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0-6a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm0 8c-3.3 0-8 1.7-8 4v2h16v-2c0-2.3-4.7-4-8-4zm-6 4c.2-.7 3.1-2 6-2s5.8 1.3 6 2H6z"/></svg>
      <span data-i18n="Users.Title"></span>
    </span>
    <span class="nav-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3zm6 9c0 4-2.6 7.8-6 8.9C8.6 18.8 6 15 6 11V6.3l6-2.2 6 2.2V11z"/></svg>
      <span data-i18n="Roles.Title"></span>
    </span>
  </nav>

  <main class="main" id="main">

    <!-- S9 permission denied: exactly the page that does not exist (F-2 BR7) -->
    <div id="block-denied" hidden>
      <div class="app-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 15h2v2h-2v-2zm0-8h2v6h-2V7zm1-5C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8z"/></svg>
        <h1 class="app-state-title" data-i18n="NotFound.Title"></h1>
        <p data-i18n="NotFound.Message"></p>
      </div>
    </div>

    <div id="block-page">
      <div class="app-page-header">
        <div class="app-breadcrumbs">
          <span data-i18n="Nav.Section.Content"></span>
          <span aria-hidden="true"> / </span>
          <a href="#" data-i18n="Exams.Title"></a>
          <span aria-hidden="true"> / </span>
          <span id="crumb-current"></span>
        </div>
        <h1 class="app-page-title" id="page-title"></h1>
      </div>

      <!-- S1 loading -->
      <div id="block-loading" hidden>
        <div class="app-state" role="status">
          <span class="app-spinner" style="color:var(--primary)" aria-hidden="true"></span>
          <span data-i18n="Common.Loading"></span>
        </div>
      </div>

      <!-- S8 not found -->
      <div id="block-notfound" hidden>
        <div class="app-form-card">
          <div class="app-alert" role="alert">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 15h2v2h-2v-2zm0-8h2v6h-2V7zm1-5C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/></svg>
            <span data-i18n="exam.not_found"></span>
          </div>
          <a class="app-link" href="#" data-i18n="Exams.BackToList"></a>
        </div>
      </div>

      <!-- the screen -->

/* Sample data: a municipal exam of Prefeitura Municipal de Fortaleza. */
const SAMPLE = {
  authority: "Prefeitura Municipal de Fortaleza (PMF)",
  name: "Concurso Público PMF 2026 - Guarda Municipal",
  type: "PublicServiceExam",
  scope: "Municipal",
  scopeDetail: "Fortaleza/CE",
  language: "pt-BR"
};

let lang = "pt-BR";
let state = "new";
let scope = null;

const $ = (id) => document.getElementById(id);
const t = (key) => (TEXTS[lang] && TEXTS[lang][key]) || key;

function applyLanguage() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-ph]").forEach(el => { el.placeholder = t(el.dataset.ph); });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("save-label").textContent = state === "saving" ? t("Common.Saving") : t("Common.Save");
  $("crumb-current").textContent = state === "new" || state === "validation"
    ? t("Exams.Form.AddTitle") : SAMPLE.name;
  $("page-title").textContent = state === "new" || state === "validation"
    ? t("Exams.Form.AddTitle") : t("Exams.Form.EditTitle");
  $("scope-detail-label").textContent = scope === "Municipal" ? t("Exams.Field.Municipality") : t("Exams.Field.State");
  $("exam-scope-detail").placeholder = scope === "Municipal"
    ? t("Exams.Field.Municipality.Placeholder") : t("Exams.Field.State.Placeholder");
  refreshAside();
  /* the error summary lists field labels, so it follows the language too */
  if (!$("error-summary").hidden) {
    $("error-summary-list").innerHTML = validate()
      .map(([id, label]) => `<li><a href="#${id}">${label}</a></li>`).join("");
  }
}

/* ---- AppRadioCards + AppConditionalField ---- */
function setScope(value, announce) {
  scope = value;
  document.querySelectorAll("#exam-scope .app-radio-card").forEach(card => {
    const selected = card.dataset.scope === value;
    card.setAttribute("aria-checked", String(selected));
    card.tabIndex = selected ? 0 : -1;
  });
  if (!document.querySelector('#exam-scope .app-radio-card[aria-checked="true"]')) {
    document.querySelector("#exam-scope .app-radio-card").tabIndex = 0;
  }
  const needsDetail = value === "State" || value === "Municipal";
  $("scope-detail-wrap").hidden = !needsDetail;
  if (needsDetail) {
    $("scope-detail-label").textContent = value === "Municipal" ? t("Exams.Field.Municipality") : t("Exams.Field.State");
    $("exam-scope-detail").placeholder = value === "Municipal"
      ? t("Exams.Field.Municipality.Placeholder") : t("Exams.Field.State.Placeholder");
    if (announce) {
      $("live").textContent = t("Exams.ScopeDetail.Shown").replace("{0}", $("scope-detail-label").textContent);
    }
  } else {
    /* Leaving State or Municipal clears the detail and its message (AC4). */
    $("exam-scope-detail").value = "";
    setFieldError("field-scope-detail", false);
  }
  if (value) { $("scope-error").hidden = true; }
  refreshAside();
}

document.querySelectorAll("#exam-scope .app-radio-card").forEach((card, index, all) => {
  card.addEventListener("click", () => setScope(card.dataset.scope, true));
  card.addEventListener("keydown", (e) => {
    const step = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1
               : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
    if (!step) { return; }
    e.preventDefault();
    const next = all[(index + step + all.length) % all.length];
    setScope(next.dataset.scope, true);
    next.focus();
  });
});

/* ---- fields -> aside ---- */
function typeLabel(value) {
  return value ? t("Exams.AssessmentType." + value) : "";
}
function languageLabel(value) {
  const option = $("exam-content-language").querySelector('option[value="' + value + '"]');
  return option ? option.textContent : "";
}
function scopeLabel() {
  if (!scope) { return ""; }
  const detail = $("exam-scope-detail").value.trim();
  return t("Exams.Scope." + scope) + (detail ? " · " + detail : "");
}
function asideValue(node, value) {
  node.textContent = value || t("Common.Summary.NotFilled");
  node.classList.toggle("empty", !value);
}
function refreshAside() {
  asideValue($("sum-authority"), $("exam-authority").value.trim());
  asideValue($("sum-name"), $("exam-name").value.trim());
  asideValue($("sum-type"), typeLabel($("exam-assessment-type").value));
  asideValue($("sum-scope"), scopeLabel());
  asideValue($("sum-language"), languageLabel($("exam-content-language").value));

  const items = [
    ["Exams.Field.IssuingAuthority", !!$("exam-authority").value.trim()],
    ["Exams.Field.Name", $("exam-name").value.trim().length >= 2],
    ["Exams.Field.AssessmentType", !!$("exam-assessment-type").value],
    ["Exams.Field.Scope", !!scope],
    ["Exams.Field.ContentLanguage", !!$("exam-content-language").value]
  ];
  if (scope === "State" || scope === "Municipal") {
    items.splice(4, 0, [scope === "Municipal" ? "Exams.Field.Municipality" : "Exams.Field.State",
                        !!$("exam-scope-detail").value.trim()]);
  }
  $("checklist").innerHTML = items.map(([key, done]) => `
    <li>
      <span class="${done ? "app-check-done" : "app-check-pending"}" aria-hidden="true">
        ${done
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm-1.3-5.5L7.9 11.7l-1.4 1.4 4.2 4.2 7-7-1.4-1.4-5.6 5.6z"/></svg>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>'}
      </span>
      <span>${t(key)}</span>
      <span class="app-visually-hidden">${done ? t("Common.Checklist.Done") : t("Common.Checklist.Pending")}</span>
    </li>`).join("");
}

["exam-authority", "exam-name", "exam-scope-detail"].forEach(id => {
  $(id).addEventListener("input", refreshAside);
});
["exam-assessment-type", "exam-content-language"].forEach(id => {
  $(id).addEventListener("change", refreshAside);
});

/* ---- validation ---- */
function setFieldError(fieldId, on) {
  const field = $(fieldId);
  field.classList.toggle("app-field-error", on);
  const hint = field.querySelector(".app-field-hint");
  const error = field.querySelector(".app-field-error-text");
  if (hint) { hint.hidden = on; }
  if (error) { error.hidden = !on; }
  const input = field.querySelector("input, select");
  if (input) { input.setAttribute("aria-invalid", on ? "true" : "false"); }
}

function validate() {
  const missing = [];
  const checks = [
    ["field-authority", "exam-authority", !$("exam-authority").value.trim(), "Exams.Field.IssuingAuthority"],
    ["field-name", "exam-name", $("exam-name").value.trim().length < 2, "Exams.Field.Name"],
    ["field-type", "exam-assessment-type", !$("exam-assessment-type").value, "Exams.Field.AssessmentType"]
  ];
  checks.forEach(([fieldId, inputId, bad, labelKey]) => {
    setFieldError(fieldId, bad);
    if (bad) { missing.push([inputId, t(labelKey)]); }
  });

  const scopeBad = !scope;
  $("scope-error").hidden = !scopeBad;
  if (scopeBad) { missing.push(["exam-scope", t("Exams.Field.Scope")]); }

  if (scope === "State" || scope === "Municipal") {
    const bad = !$("exam-scope-detail").value.trim();
    setFieldError("field-scope-detail", bad);
    if (bad) {
      missing.push(["exam-scope-detail", scope === "Municipal" ? t("Exams.Field.Municipality") : t("Exams.Field.State")]);
    }
  }
  return missing;
}

function showErrorSummary(missing) {
  $("error-summary-list").innerHTML = missing
    .map(([id, label]) => `<li><a href="#${id}">${label}</a></li>`).join("");
  $("error-summary").hidden = missing.length === 0;
  if (missing.length) { $("error-summary").focus(); }
}

$("error-summary-list").addEventListener("click", (e) => {
  const link = e.target.closest("a");
  if (!link) { return; }
  e.preventDefault();
  const target = document.querySelector(link.getAttribute("href"));
  if (target) { target.focus(); }
});

$("btn-save").addEventListener("click", () => {
  const missing = validate();
  showErrorSummary(missing);
  if (missing.length) { return; }
  setState("saving");
  setTimeout(() => setState("success"), 1200);
});

/* ---- states ---- */
function fill(data) {
  $("exam-authority").value = data ? data.authority : "";
  $("exam-name").value = data ? data.name : "";
  $("exam-assessment-type").value = data ? data.type : "";
  $("exam-content-language").value = data ? data.language : "pt-BR";
  setScope(data ? data.scope : null, false);
  if (data) { $("exam-scope-detail").value = data.scopeDetail; }
  ["field-authority", "field-name", "field-type", "field-scope-detail"].forEach(id => setFieldError(id, false));
  $("scope-error").hidden = true;
  $("error-summary").hidden = true;
  $("server-alert").hidden = true;
  refreshAside();
}

function setState(next) {
  state = next;
  document.querySelectorAll("[data-state]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.state === next)));

  $("block-denied").hidden = next !== "denied";
  $("block-page").hidden = next === "denied";
  $("block-loading").hidden = next !== "loading";
  $("block-notfound").hidden = next !== "notfound";
  $("block-form").hidden = next === "loading" || next === "notfound";
  $("snackbar").hidden = next !== "success";

  const saving = next === "saving";
  $("save-spinner").hidden = !saving;
  $("btn-save").disabled = saving;
  $("btn-cancel").disabled = saving;

  if (next === "new" || next === "validation") {
    fill(null);
  } else if (next === "ready" || next === "saving" || next === "success" || next === "server") {
    fill(SAMPLE);
  }

  if (next === "validation") {
    /* a half-filled form the Admin tried to save: name missing, scope State without its detail */
    $("exam-authority").value = SAMPLE.authority;
    $("exam-assessment-type").value = SAMPLE.type;
    setScope("State", false);
    refreshAside();
    showErrorSummary(validate());
  }
  if (next === "server") { $("server-alert").hidden = false; }
  if (next === "success") { setTimeout(() => { if (state === "success") { $("snackbar").hidden = true; } }, 4000); }

  applyLanguage();
}

document.querySelectorAll("[data-state]").forEach(b => b.addEventListener("click", () => setState(b.dataset.state)));
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; applyLanguage(); }));
document.querySelectorAll("[data-theme-btn]").forEach(b => b.addEventListener("click", () => {
  document.documentElement.setAttribute("data-theme", b.dataset.themeBtn);
  document.querySelectorAll("[data-theme-btn]").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
}));

setState("new");
</script>
