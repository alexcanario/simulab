<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-75 - Map notice subjects to the canonical taxonomy (mockup)</title>
<style>
/* ===========================================================================
   F-75 mockup - only the deltas on screens that F-74 and F-79 own:
   1. edition page, "Notice subjects" section: chips under each row, "Not mapped" marker, footer count
   2. NoticeSubjectDialog: the new field "Covers" (AppMultiPickField + AppChip, new kit parts)
   3. /admin/subjects and /admin/subjects/{id}: delete disabled with the in-use reason (BR10)
   Visual language of the F-74 mockup. Every colour is a SimulabTheme token; no new colour.
   No identity tokens file exists yet: the tokens are SimulabTheme's (MudBlazor palette).
   No external request: no web font, no icon font, no image.
   =========================================================================== */
:root {
  --app-font-xs: 0.75rem; --app-font-sm: 0.8125rem; --app-font-md: 0.9375rem;
  --app-font-lg: 1.0625rem; --app-font-xl: 1.25rem; --app-font-xxl: 1.75rem;
  --app-space-1: 4px; --app-space-2: 8px; --app-space-3: 12px; --app-space-4: 16px; --app-space-5: 24px; --app-space-6: 32px;
  --app-radius-sm: 6px; --app-radius-md: 10px; --app-radius-lg: 14px;

  /* PaletteLight */
  --primary: #216DB5; --primary-darken: #1858A0; --primary-lighten: #EBF3FD; --primary-contrast: #FFFFFF;
  --success: #1A9E8C; --success-contrast: #19243E; --warning: #D98B1A;
  --error: #BE3737; --error-contrast: #FFFFFF;
  --background: #F2F5FB; --surface: #FFFFFF;
  --drawer: #0F3266; --drawer-text: rgba(255,255,255,0.92); --appbar: #0F3266; --appbar-text: #FFFFFF;
  --text-primary: #19243E; --text-secondary: #4A5A7A; --action-default: #4A5A7A;
  --lines-inputs: #7E8AA1; --divider: #D0D8EA;
}
[data-theme="dark"] {
  /* PaletteDark */
  --primary: #64A2E3; --primary-darken: #5096DC; --primary-lighten: #162540; --primary-contrast: #19243E;
  --success: #1A9E8C; --success-contrast: #19243E; --warning: #D98B1A;
  --error: #E06C6C; --error-contrast: #19243E;
  --background: #0E1828; --surface: #172035;
  --drawer: #091422; --drawer-text: rgba(255,255,255,0.92); --appbar: #091422; --appbar-text: #FFFFFF;
  --text-primary: #E0E8F8; --text-secondary: #7A8EB0; --action-default: #7A8EB0;
  --lines-inputs: #61718F; --divider: #263352;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: var(--app-font-md); line-height: 1.65;
  background: var(--background); color: var(--text-primary);
  display: flex; flex-direction: column;
}
svg { display: block; flex-shrink: 0; }
a { color: inherit; }
button { font: inherit; }
:is(a, button, input, select, textarea, [tabindex]):focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.app-visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }

/* ---- demo chrome (not part of the product) ---- */
.demo { display: flex; flex-direction: column; gap: var(--app-space-1); padding: var(--app-space-2) var(--app-space-4); background: var(--surface); border-bottom: 1px dashed var(--divider); }
.demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--app-space-2); }
.demo-label { font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin-right: var(--app-space-1); }
.demo button { font-size: var(--app-font-xs); font-weight: 600; padding: 3px 10px; border-radius: 20px; cursor: pointer; border: 1px solid var(--lines-inputs); background: var(--surface); color: var(--text-primary); }
.demo button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-contrast); }
.demo-note { display: inline-block; font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); border: 1px dashed var(--divider); border-radius: 20px; padding: 0 var(--app-space-2); margin-bottom: var(--app-space-2); }
.demo-note-plain { text-transform: none; letter-spacing: 0; font-weight: 600; border-radius: var(--app-radius-sm); }

/* ---- app shell ---- */
.appbar { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: var(--app-space-2); padding: 0 var(--app-space-4); background: var(--appbar); color: var(--appbar-text); }
.brand { font-weight: 700; letter-spacing: .09em; }
.spacer { flex: 1; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--success); color: var(--success-contrast); display: flex; align-items: center; justify-content: center; font-size: var(--app-font-xs); font-weight: 700; }
.lay { flex: 1; display: flex; min-height: 0; }
.drawer { width: 260px; flex-shrink: 0; background: var(--drawer); color: var(--drawer-text); padding: var(--app-space-3) var(--app-space-2); overflow-y: auto; }
.nav-section { display: block; padding: var(--app-space-4) var(--app-space-3) var(--app-space-1); font-size: var(--app-font-xs); text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
.nav-link { display: flex; align-items: center; gap: var(--app-space-3); padding: var(--app-space-2) var(--app-space-3); border-left: 3px solid transparent; border-radius: var(--app-radius-sm); font-size: var(--app-font-sm); cursor: pointer; }
.nav-link:hover { background: rgba(255,255,255,.08); }
.nav-link[aria-current="page"] { background: rgba(255,255,255,.14); border-left-color: var(--primary); font-weight: 600; }
.main { flex: 1; overflow-y: auto; padding: var(--app-space-5); }
@media (max-width: 959.98px) { .drawer { display: none; } .main { padding: var(--app-space-4); } }

/* ---- page header ---- */
.app-page-header { margin-bottom: var(--app-space-5); display: flex; align-items: flex-end; gap: var(--app-space-4); flex-wrap: wrap; }
.app-page-header-text { flex: 1; min-width: 0; }
.app-breadcrumbs { font-size: var(--app-font-sm); color: var(--text-secondary); padding-bottom: var(--app-space-1); }
.app-breadcrumbs a { text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.app-page-title { font-size: var(--app-font-xxl); font-weight: 700; line-height: 1.2; }

/* ---- layout ---- */
.app-form-card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-5); }
.app-form-card + .app-form-card { margin-top: var(--app-space-4); }
.stub-card { padding: var(--app-space-4) var(--app-space-5); color: var(--text-secondary); font-size: var(--app-font-sm); }

/* ---- AppSectionCard ---- */
.app-section-card { border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-4) var(--app-space-4) var(--app-space-3); }
.app-section-card-title { display: flex; align-items: center; gap: var(--app-space-2); font-size: var(--app-font-lg); font-weight: 600; }
.app-section-card-icon { color: var(--primary); }
.app-section-card-subtitle { font-size: var(--app-font-xs); color: var(--text-secondary); margin: var(--app-space-1) 0 var(--app-space-4); }

/* ---- fields ---- */
.app-field { position: relative; margin-bottom: var(--app-space-4); }
.app-field-label { display: block; font-size: var(--app-font-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--app-space-1); }
.app-field-required { color: var(--error); margin-left: 3px; }
.app-field-input { display: flex; align-items: center; gap: var(--app-space-2); height: 42px; padding: 0 var(--app-space-1) 0 var(--app-space-3); border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-sm); background: var(--surface); color: var(--text-primary); }
.app-field-input:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
.app-field-input svg { color: var(--action-default); }
.app-field-input input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; color: var(--text-primary); font: inherit; font-size: var(--app-font-md); }
.app-field-input input::placeholder { color: var(--text-secondary); }
.app-field-input input:disabled { cursor: not-allowed; }
.app-field-error .app-field-input { border-color: var(--error); }
.app-field-hint, .app-field-error-text { display: block; font-size: var(--app-font-xs); line-height: 1.45; margin-top: var(--app-space-1); }
.app-field-hint { color: var(--text-secondary); }
.app-field-error-text { color: var(--error); font-weight: 600; }
.app-field-status { display: flex; align-items: center; gap: var(--app-space-2); }
.app-field-count { width: 50%; }
@media (max-width: 599.98px) { .app-field-count { width: 100%; } }
.app-select { height: 42px; padding: 0 var(--app-space-3); border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-sm); background: var(--surface); color: var(--text-primary); font: inherit; font-size: var(--app-font-md); min-width: 220px; }

/* ---- icon buttons + tooltip ---- */
.app-icon-button { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--action-default); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.app-icon-button:hover { background: var(--background); }
.app-icon-button[disabled] { cursor: not-allowed; opacity: .45; }
.app-icon-button.is-destructive { color: var(--error); }
.tip { position: relative; display: inline-flex; }
.tip::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); right: 0; background: var(--text-primary); color: var(--surface); font-size: var(--app-font-xs); line-height: 1.4; padding: 2px 8px; border-radius: 4px; white-space: normal; width: max-content; max-width: 22rem; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 30; }
.tip:hover::after, .tip:focus-within::after { opacity: 1; }
.tip.is-shown::after { opacity: 1; }

/* ---- AppAlert ---- */
.app-alert { display: flex; gap: var(--app-space-3); align-items: flex-start; padding: var(--app-space-3) var(--app-space-4); border-radius: var(--app-radius-sm); background: var(--error); color: var(--error-contrast); margin-bottom: var(--app-space-4); font-size: var(--app-font-sm); }

/* ---- buttons ---- */
.app-button { font-size: var(--app-font-md); font-weight: 600; cursor: pointer; text-decoration: none; min-height: 40px; padding: 0 var(--app-space-5); border-radius: var(--app-radius-sm); display: inline-flex; align-items: center; gap: var(--app-space-2); }
.app-button-text { border: 0; background: transparent; color: var(--text-primary); }
.app-button-filled { border: 0; background: var(--primary); color: var(--primary-contrast); }
.app-button-outlined { border: 1px solid var(--primary); background: transparent; color: var(--primary); padding: 0 var(--app-space-4); }
.app-button-outlined:hover { background: var(--primary-lighten); }
.app-button-danger { border: 0; background: var(--error); color: var(--error-contrast); }
.app-button-small { min-height: 28px; padding: 0 var(--app-space-2); font-size: var(--app-font-xs); color: var(--primary); }
.app-button-small:hover { background: var(--primary-lighten); }
.app-button[disabled] { opacity: .45; cursor: not-allowed; }
.app-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin .9s linear infinite; }
.app-spinner-sm { width: 12px; height: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- AppItemRows + AppRowActions + AppStatusChip ---- */
.app-item-rows-list { list-style: none; border: 1px solid var(--divider); border-radius: var(--app-radius-sm); }
.app-item-row { display: flex; align-items: center; gap: var(--app-space-3); padding: var(--app-space-2) var(--app-space-2) var(--app-space-2) var(--app-space-3); border-bottom: 1px solid var(--divider); }
.app-item-row:last-child { border-bottom: 0; }
.app-item-row:hover { background: var(--background); }
.app-item-row-content { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--app-space-3); }
.app-item-row-label { font-weight: 600; font-size: var(--app-font-sm); }
.app-item-rows-empty { font-size: var(--app-font-sm); color: var(--text-secondary); padding: var(--app-space-4); border: 1px dashed var(--divider); border-radius: var(--app-radius-sm); text-align: center; }
.app-row-actions { display: flex; align-items: center; gap: var(--app-space-1); flex-shrink: 0; }
.app-row-actions-gap { width: 1px; height: 20px; background: var(--divider); margin: 0 var(--app-space-1); }
.app-status-chip { display: inline-flex; align-items: center; gap: var(--app-space-2); padding: 0 10px; border: 1px solid var(--divider); border-radius: 20px; background: var(--surface); color: var(--text-primary); font-size: var(--app-font-xs); font-weight: 600; line-height: 1.8; }
.app-status-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-secondary); }
.app-status-chip-warning .app-status-chip-dot { background: var(--warning); }
.app-truncated { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.app-muted { color: var(--text-secondary); }

/* ---- AppChip (new kit component) ---- */
.app-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; max-width: 100%; padding: 2px 10px; border: 1px solid var(--divider); border-radius: var(--app-radius-lg); background: var(--surface); color: var(--text-primary); font-size: var(--app-font-xs); line-height: 1.35; }
.app-chip > svg { color: var(--text-secondary); }
.app-chip-text { min-width: 0; overflow-wrap: anywhere; }
.app-chip-secondary { color: var(--text-secondary); }
.app-chip.is-removable { padding-right: 2px; }
.app-chip-remove { width: 24px; height: 24px; border: 0; border-radius: 50%; background: transparent; color: var(--action-default); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.app-chip-remove:hover { background: var(--background); }
.app-chip-remove[disabled] { cursor: not-allowed; opacity: .45; }
.app-chip.is-marked { border-color: var(--error); border-width: 2px; }
.app-chip-mark { color: var(--error); font-weight: 700; }

/* ---- notice subjects (composition of kit parts; no new token) ---- */
.ns-group + .ns-group { margin-top: var(--app-space-4); }
.ns-group-title { font-size: var(--app-font-sm); font-weight: 700; color: var(--text-primary); margin-bottom: var(--app-space-2); }
.ns-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--app-space-1); }
.ns-covers { list-style: none; display: flex; flex-wrap: wrap; gap: var(--app-space-1) 6px; }
.ns-count { flex: none; min-width: 6.5rem; text-align: right; font-size: var(--app-font-sm); font-variant-numeric: tabular-nums; color: var(--text-secondary); align-self: flex-start; padding-top: 1px; }
.ns-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--app-space-3); margin-top: var(--app-space-3); }
.ns-total { font-size: var(--app-font-sm); text-align: right; }
.ns-total-sum { font-weight: 700; display: block; }
.ns-total-line { color: var(--text-secondary); display: block; }

/* ---- AppMultiPickField (new kit component) ---- */
.app-mp-list { position: absolute; left: 0; right: 0; top: 70px; z-index: 25; background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-sm); box-shadow: 0 6px 20px rgba(20,40,100,.18); max-height: 300px; overflow-y: auto; padding: var(--app-space-1) 0; }
.app-mp-group + .app-mp-group { border-top: 1px solid var(--divider); }
.app-mp-option { display: flex; align-items: flex-start; gap: var(--app-space-2); min-height: 36px; padding: 7px var(--app-space-3); cursor: pointer; font-size: var(--app-font-sm); line-height: 1.4; }
.app-mp-option.is-topic { padding-left: 40px; }
.app-mp-option.is-whole .app-mp-option-name { font-weight: 700; }
.app-mp-option:hover, .app-mp-option:focus { background: var(--primary-lighten); }
.app-mp-option:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.app-mp-option[aria-selected="true"] { background: var(--primary-lighten); }
.app-mp-option[aria-disabled="true"] { cursor: not-allowed; color: var(--text-secondary); }
.app-mp-option[aria-disabled="true"]:hover, .app-mp-option[aria-disabled="true"]:focus { background: transparent; }
.app-mp-check { width: 18px; height: 18px; flex: none; margin-top: 1px; border: 2px solid var(--lines-inputs); border-radius: 3px; display: flex; align-items: center; justify-content: center; color: var(--primary-contrast); }
.app-mp-option[aria-selected="true"] .app-mp-check { background: var(--primary); border-color: var(--primary); }
.app-mp-option[aria-disabled="true"] .app-mp-check { border-style: dashed; }
.app-mp-option-text { flex: 1; min-width: 0; }
.app-mp-option-secondary { display: block; font-size: var(--app-font-xs); color: var(--text-secondary); }
.app-mp-empty { padding: var(--app-space-3); font-size: var(--app-font-sm); color: var(--text-secondary); }
.app-mp-countline { display: flex; justify-content: space-between; align-items: center; gap: var(--app-space-2); margin-top: var(--app-space-2); font-size: var(--app-font-xs); color: var(--text-secondary); min-height: 28px; }
.app-mp-chips { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--app-space-1); }
.app-mp-none { font-size: var(--app-font-sm); color: var(--text-secondary); margin-top: var(--app-space-1); }

/* ---- AppDataTable (look) ---- */
.app-table-card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); overflow: hidden; }
.app-table-toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--app-space-4); padding: var(--app-space-4); }
.app-table-toolbar .app-field { margin-bottom: 0; min-width: 260px; }
.app-table { width: 100%; border-collapse: collapse; font-size: var(--app-font-sm); }
.app-table th { text-align: left; font-size: var(--app-font-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); padding: var(--app-space-2) var(--app-space-4); border-bottom: 1px solid var(--divider); }
.app-table td { padding: var(--app-space-2) var(--app-space-4); border-bottom: 1px solid var(--divider); }
.app-table tbody tr:hover td { background: var(--background); }
.app-table .is-number { text-align: right; font-variant-numeric: tabular-nums; }
.app-table .is-actions { width: 1%; white-space: nowrap; }
.app-link { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-weight: 600; }

/* ---- states ---- */
.app-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--app-space-3); padding: var(--app-space-6) var(--app-space-4); text-align: center; background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); color: var(--text-secondary); }
.app-state-inline { padding: var(--app-space-5) var(--app-space-4); border-style: dashed; }
.app-state-title { font-size: var(--app-font-xl); font-weight: 700; color: var(--text-primary); }
.app-state .is-error { color: var(--error); }

/* ---- dialogs ---- */
.app-overlay { position: fixed; inset: 0; background: rgba(9,20,34,.55); display: flex; align-items: center; justify-content: center; z-index: 60; padding: var(--app-space-4); }
.app-overlay.is-top { z-index: 65; }
.app-dialog { width: 100%; max-width: 30rem; background: var(--surface); color: var(--text-primary); border-radius: var(--app-radius-md); padding: var(--app-space-5); box-shadow: 0 10px 40px rgba(0,0,0,.35); max-height: calc(100vh - 32px); overflow-y: auto; }
.app-dialog-wide { max-width: 38rem; }
.app-dialog-title { font-size: var(--app-font-xl); font-weight: 700; margin-bottom: var(--app-space-4); }
.app-dialog-message { font-size: var(--app-font-sm); color: var(--text-secondary); }
.app-dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: var(--app-space-2); margin-top: var(--app-space-5); }

/* ---- snackbar ---- */
.app-snackbar { position: fixed; right: var(--app-space-5); bottom: var(--app-space-5); z-index: 70; display: flex; align-items: center; gap: var(--app-space-2); padding: var(--app-space-3) var(--app-space-4); border-radius: var(--app-radius-sm); background: var(--success); color: var(--success-contrast); font-weight: 600; font-size: var(--app-font-sm); box-shadow: 0 4px 16px rgba(20,40,100,.25); }
</style>
</head>
<body>

<!-- ===================== demo chrome (not part of the product) ===================== -->
<div class="demo">
  <div class="demo-row">
    <span class="demo-label">Demo &middot; screen</span>
    <button type="button" data-screen="edition">1-2 &middot; Edition page: notice subjects + dialog</button>
    <button type="button" data-screen="subjects">3a &middot; Subjects list (F-79)</button>
    <button type="button" data-screen="topics">3b &middot; Subject page, topics (F-79)</button>
  </div>
  <div class="demo-row" id="demo-states-1"></div>
  <div class="demo-row" id="demo-states-2"></div>
  <div class="demo-row">
    <span class="demo-label">Demo &middot; language</span>
    <button type="button" data-lang="pt-BR">pt-BR</button>
    <button type="button" data-lang="pt-PT">pt-PT</button>
    <button type="button" data-lang="en">en</button>
    <span class="demo-label" style="margin-left:12px">Demo &middot; theme</span>
    <button type="button" data-theme-btn="light">Light</button>
    <button type="button" data-theme-btn="dark">Dark</button>
  </div>
</div>

<header class="appbar"><span class="brand">SIMULAB</span><span class="spacer"></span><span class="avatar">AC</span></header>

<div class="lay">
  <nav class="drawer" aria-label="Main" id="drawer"></nav>
  <main class="main" id="main"></main>
</div>

<div id="dialog-root"></div>

  tax.forEach(s => { const i = s.topics.findIndex(x => x.id === topicId); if (i >= 0) moved = s.topics.splice(i, 1)[0]; });
  tax.find(s => s.id === toSid).topics.push(moved);
  return sortTax(tax);
}

/* ===========================================================================
   Picks: resolved against the current taxonomy (BR8: a topic counts under its current subject)
   =========================================================================== */
function findSubject(tax, sid) { return tax.find(s => s.id === sid) || null; }
function findTopic(tax, topicId) {
  for (const s of tax) { const x = s.topics.find(y => y.id === topicId); if (x) return { subject: s, topic: x }; }
  return null;
}
function info(p, tax = S.tax) {
  if (p.k === "s") {
    const s = findSubject(tax, p.id);
    return { whole: true, subjectId: p.id, subject: s ? s.name : p.sName, topic: null, gone: !s };
  }
  const r = findTopic(tax, p.id);
  return r ? { whole: false, subjectId: r.subject.id, subject: r.subject.name, topic: r.topic.name, gone: false }
           : { whole: false, subjectId: null, subject: p.sName, topic: p.tName, gone: true };
}
function spoken(i) { return i.whole ? `${i.subject}, ${t("NoticeSubjects.Covers.WholeMarker")}` : t("NoticeSubjects.Covers.Topic.Spoken", i.subject, i.topic); }
function sortPicks(picks, tax = S.tax) {
  return [...picks].sort((a, b) => {
    const x = info(a, tax), y = info(b, tax);
    const c = norm(x.subject).localeCompare(norm(y.subject)); if (c) return c;
    if (x.whole !== y.whole) return x.whole ? -1 : 1;
    return norm(x.topic).localeCompare(norm(y.topic));
  });
}

/* AppChip: read-only, or with a remove button; marked when the Api refused it */
function chipHtml(p, { removable = false, mark = null, index = 0, disabled = false } = {}) {
  const i = info(p);
  const body = i.whole
    ? `${icon("Subjects", 14)}<span class="app-chip-text">${esc(i.subject)}<span aria-hidden="true"> · </span><span class="app-visually-hidden">, </span><span class="app-chip-secondary">${esc(t("NoticeSubjects.Covers.WholeMarker"))}</span></span>`
    : `${icon("Topics", 14)}<span class="app-chip-text"><span aria-hidden="true">${esc(t("NoticeSubjects.Covers.Topic", i.subject, i.topic))}</span><span class="app-visually-hidden">${esc(spoken(i))}</span></span>`;
  const markHtml = mark ? `<span class="app-chip-mark"><span class="app-visually-hidden">, </span>${esc(t(mark))}</span>` : "";
  const remove = removable
    ? `<span class="tip" data-tip="${esc(t("Common.RemoveItem", spoken(i)))}"><button type="button" class="app-chip-remove" data-action="chip-remove" data-key="${keyOf(p)}" data-index="${index}"
         aria-label="${esc(t("Common.RemoveItem", spoken(i)))}" ${disabled ? "disabled" : ""}>${icon("Close", 16)}</button></span>` : "";
  return `<li class="app-chip ${removable ? "is-removable" : ""} ${mark ? "is-marked" : ""}">${body}${markHtml}${remove}</li>`;
}

function totalHtml() {
  const stated = S.rows.filter(r => r.n != null);
  const sum = stated.reduce((a, r) => a + r.n, 0);
  const unstated = S.rows.length - stated.length;
  const unmapped = S.rows.filter(r => !r.m || r.m.length === 0).length;
  const first = stated.length ? t(sum === 1 ? "NoticeSubjects.Total.One" : "NoticeSubjects.Total.Many", fmt(sum)) : t("NoticeSubjects.Total.None");
  const second = stated.length && unstated ? t(unstated === 1 ? "NoticeSubjects.Total.Unstated.One" : "NoticeSubjects.Total.Unstated.Many", fmt(unstated)) : "";
  /* F-75: the not-mapped count, only when above zero (AC10) */
  const third = unmapped ? t(unmapped === 1 ? "NoticeSubjects.Total.Unmapped.One" : "NoticeSubjects.Total.Unmapped.Many", fmt(unmapped)) : "";
  return `<p class="ns-total"><span class="ns-total-sum">${esc(first)}</span>${second ? `<span class="ns-total-line">${esc(second)}</span>` : ""}${third ? `<span class="ns-total-line">${esc(third)}</span>` : ""}</p>`;
}

function openDialog(mode, id) {
  const r = id ? S.rows.find(x => x.id === id) : null;
  S.dlg = { mode, id: r ? r.id : null, group: r ? (r.g || "") : "", label: r ? r.l : "", count: r && r.n != null ? String(r.n) : "",
            picks: r ? r.m.map(p => ({ ...p })) : [], saved: r ? r.m.map(p => ({ ...p })) : [],
            tax: "ready", open: false, term: "", covErr: null, errors: {}, alert: null, saving: false, dirty: false };
}

/* comfort checks, compared with the saved mapping like BR4 (an overlap that already existed is never blocked) */
function savedOverlapOf(sid) {
  const d = S.dlg;
  return d.saved.some(p => p.k === "s" && p.id === sid) && d.saved.some(p => p.k === "t" && info(p).subjectId === sid);
}
function isPicked(k, id) { return S.dlg.picks.some(p => p.k === k && p.id === id); }
function optionState(k, sid, id) {
  const d = S.dlg, picked = isPicked(k, id);
  if (picked) return { picked, reason: null, disabled: false };
  if (k === "s" && d.picks.some(p => p.k === "t" && info(p).subjectId === sid) && !savedOverlapOf(sid))
    return { picked, disabled: true, reason: "NoticeSubjects.Covers.WholeBlocked" };
  if (k === "t" && isPicked("s", sid) && !savedOverlapOf(sid))
    return { picked, disabled: true, reason: "NoticeSubjects.Covers.CoveredByWhole" };
  if (d.picks.length >= LIMIT) return { picked, disabled: true, reason: null };
  return { picked, disabled: false, reason: null };
}

function visibleGroups() {
  const term = norm(S.dlg.term);
  return S.tax.map(s => {
    if (!term || norm(s.name).includes(term)) return { s, topics: s.topics };
    const topics = s.topics.filter(x => norm(x.name).includes(term));
    return topics.length ? { s, topics } : null;
  }).filter(Boolean);
}
const optionCount = (groups) => groups.reduce((a, g) => a + 1 + g.topics.length, 0);

function optionHtml(k, sid, id, name, secondaryDefault) {
  const st = optionState(k, sid, id);
  const secondary = st.reason ? t(st.reason) : secondaryDefault;
  const oid = `covers-opt-${k}-${id}`;
  return `<div role="option" id="${oid}" tabindex="-1" class="app-mp-option ${k === "s" ? "is-whole" : "is-topic"}" data-key="${k}:${id}" data-sid="${sid}"
      aria-selected="${st.picked}" ${st.disabled ? 'aria-disabled="true"' : ""} ${secondary ? `aria-describedby="${oid}-sec"` : ""}>
    <span class="app-mp-check" aria-hidden="true">${st.picked ? icon("Check", 14) : ""}</span>
    <span class="app-mp-option-text"><span class="app-mp-option-name">${esc(name)}</span>${secondary ? `<span class="app-mp-option-secondary" id="${oid}-sec">${esc(secondary)}</span>` : ""}</span>
  </div>`;
}

function listHtml() {
  const d = S.dlg;
  if (!d.open || d.tax !== "ready") return "";
  const groups = visibleGroups();
  const body = groups.length === 0
    ? `<div class="app-mp-empty" role="presentation">${esc(t("Lookup.NoResults", d.term))}</div>`
    : groups.map(g => `<div role="group" class="app-mp-group" aria-label="${esc(g.s.name)}">
        ${optionHtml("s", g.s.id, g.s.id, g.s.name, t("NoticeSubjects.Covers.WholeMarker"))}
        ${g.topics.map(x => optionHtml("t", g.s.id, x.id, x.name, null)).join("")}
      </div>`).join("");

}

function markOf(p) {
  const d = S.dlg, i = info(p);
  if (i.gone) return "NoticeSubjects.Covers.Gone";
  if (d.covErr === "notice_subject.mapping_overlap" && !i.whole && isPicked("s", i.subjectId)) return "NoticeSubjects.Covers.Overlaps";
  return null;
}

/* re-render only the Covers field, then put the focus back where it was */
function refreshCovers(focus) {
  const w = $("wrap-notice-subject-covers"); if (!w) return;
  const active = document.activeElement;
  const was = focus || (active && active.id === "notice-subject-covers" ? { input: true, pos: active.selectionStart }
            : active && active.dataset && active.dataset.key && active.getAttribute("role") === "option" ? { option: active.dataset.key } : null);
  w.outerHTML = coversFieldHtml();
  if (!was) return;
  if (was.input) { const i = $("notice-subject-covers"); if (i && !i.disabled) { i.focus(); if (was.pos != null) i.setSelectionRange(was.pos, was.pos); } }
  else if (was.option) document.querySelector(`#notice-subject-covers-list [data-key="${was.option}"]`)?.focus();
  else if (was.chip != null) {
    const btns = [...document.querySelectorAll('[data-action="chip-remove"]')];
    (btns[Math.min(was.chip, btns.length - 1)] || $("notice-subject-covers"))?.focus();
  }
}

function toggle(el) {
  const d = S.dlg;
  if (el.getAttribute("aria-disabled") === "true" || d.saving) return;
  const [k, id] = el.dataset.key.split(":");
  const sid = el.dataset.sid;
  const s = findSubject(S.tax, sid);
  let p;
  if (isPicked(k, id)) {
    p = d.picks.find(x => x.k === k && x.id === id);
    d.picks = d.picks.filter(x => x !== p);
    announce(t("NoticeSubjects.Covers.Removed", spoken(info(p))));
  } else {
    p = k === "s" ? { k, id, sName: s.name } : { k, id, sName: s.name, tName: s.topics.find(x => x.id === id).name };
    d.picks.push(p);
    announce(t("NoticeSubjects.Covers.Added", spoken(info(p))));
  }
  d.dirty = true; d.covErr = null;
  refreshCovers({ option: el.dataset.key });
}

function saveDialog() {
  const d = S.dlg;
  d.errors.label = d.label.trim() ? null : "notice_subject.label_required";
  if (d.errors.label) { renderDialog(); $("notice-subject-label")?.focus(); return; }
  /* what the Api would answer (the screen also checks for comfort) */
  const gone = d.picks.some(p => info(p).gone);
  const newOverlap = d.picks.some(p => p.k === "t" && isPicked("s", info(p).subjectId) && !savedOverlapOf(info(p).subjectId));
  if (d.picks.length > LIMIT) d.covErr = "notice_subject.mapping_too_many";
  else if (gone) d.covErr = "notice_subject.mapping_target_not_found";
  else if (newOverlap) d.covErr = "notice_subject.mapping_overlap";
  if (d.covErr) { d.open = false; renderDialog(); $("notice-subject-covers")?.focus(); return; }
  d.saving = true; d.open = false; renderDialog();
  setTimeout(() => {
    let id = d.id;
    if (d.mode === "add") { id = S.nextId++; S.rows.push({ id, g: d.group.trim() || null, l: d.label.trim(), n: d.count ? Number(d.count) : null, m: d.picks }); }
    else Object.assign(S.rows.find(r => r.id === d.id), { g: d.group.trim() || null, l: d.label.trim(), n: d.count ? Number(d.count) : null, m: d.picks });
    S.dlg = null; S.note = null; S.snack = "NoticeSubjects.Saved"; S.changedRow = id;
    render(); document.querySelector(`[data-action="edit"][data-id="${id}"]`)?.focus();
  }, 900);
}

function closeDialog() {
  S.dlg = null; S.confirm = null; S.note = null; render();
  if (S.returnFocus) document.querySelector(S.returnFocus)?.focus();
}
function cancelDialog() {
  if (S.dlg.saving) return;
  if (S.dlg.dirty) { S.confirm = { kind: "discard" }; renderConfirm(); return; }
  closeDialog();
}

            ${iconBtn({ action: "noop", id: x.id, ic: "Edit", label: t("Common.Edit"), name: x.name })}
            ${iconBtn({ action: "noop", id: x.id, ic: "Delete", label: t("Common.Delete"), name: x.name, destructive: true,
                disabled: x.inUse, tip: x.inUse ? t("Topics.Delete.DisabledInUse") : null })}
          </div>
        </li>`).join("")}</ul>
      <div style="margin-top:12px"><button type="button" class="app-button app-button-outlined" data-action="noop">${icon("Add", 18)}${esc(t("Topics.Dialog.AddTitle"))}</button></div>
    </section>
  </div>`;
}

/* ===================================================================== */
/* shared                                                                 */
/* ===================================================================== */
function navHtml() {
  const link = (ic, key, current) => `<span class="nav-link" ${current ? 'aria-current="page"' : ""}>${icon(ic, 20)}<span>${esc(t(key))}</span></span>`;
  const onSubjects = S.screen !== "edition";
  return `<span class="nav-section">${esc(t("Nav.Section.Content"))}</span>
    ${link("Exams", "Exams.Title", !onSubjects)}${link("Subjects", "Subjects.Title", onSubjects)}${link("IssuingAuthorities", "IssuingAuthorities.Title")}${link("Organizers", "Organizers.Title")}
    <span class="nav-section">${esc(t("Nav.Section.Administration"))}</span>${link("Users", "Users.Title")}${link("Roles", "Roles.Title")}`;
}

function confirmHtml() {
  if (!S.confirm) return "";
  return `<div class="app-overlay is-top">
    <div class="app-dialog" role="alertdialog" aria-modal="true" aria-labelledby="cf-title" aria-describedby="cf-message">
      <h2 class="app-dialog-title" id="cf-title">${esc(t("Common.Discard.Title"))}</h2>
      <p class="app-dialog-message" id="cf-message">${esc(t("Common.Discard.Message"))}</p>
      <div class="app-dialog-actions">
        <button type="button" class="app-button app-button-text" data-action="cf-cancel" id="cf-cancel">${esc(t("Common.Cancel"))}</button>
        <button type="button" class="app-button app-button-danger" data-action="cf-confirm">${esc(t("Common.Discard.Confirm"))}</button>
      </div>
    </div>
  </div>`;
}

let snackTimer = null;
function renderSnack() {
  $("snackbar-root").innerHTML = S.snack ? `<div class="app-snackbar" role="status">${icon("Check", 18)}<span>${esc(t(S.snack))}</span></div>` : "";
  clearTimeout(snackTimer);
  if (S.snack) snackTimer = setTimeout(() => { S.snack = null; $("snackbar-root").innerHTML = ""; }, 4000);
}

function renderDemo() {
  document.querySelectorAll("[data-screen]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.screen === S.screen)));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeBtn === S.theme)));
  const groups = STATES[S.screen];
  ["demo-states-1", "demo-states-2"].forEach((rid, i) => {
    const g = groups[i];
    $(rid).innerHTML = g ? `<span class="demo-label">Demo &middot; ${g[0]}</span>` +
      g[1].map(([k, label]) => `<button type="button" data-state="${k}" aria-pressed="${S.state[S.screen] === k}">${label}</button>`).join("") : "";
    $(rid).hidden = !g;
  });
}

function renderDialog() { $("dialog-root").innerHTML = dialogHtml(); }
function renderConfirm() { $("confirm-root").innerHTML = confirmHtml(); if (S.confirm) $("cf-cancel")?.focus(); }

function render() {
  document.documentElement.lang = S.lang;
  document.documentElement.dataset.theme = S.theme;
  renderDemo();
  $("drawer").innerHTML = navHtml();
  $("main").innerHTML = S.screen === "edition" ? editionHtml() : S.screen === "subjects" ? subjectsHtml() : topicsHtml();
  renderDialog();
  renderConfirm();
  renderSnack();
}

function setState(st) {
  if (S.screen === "edition") setEditionState(st);
  else if (S.screen === "subjects") setSubjectsState(st);
  else setTopicsState(st);
  render();
  if (S.dlg && !S.confirm) {
    if (S.dlg.covErr || S.dlg.open) $("notice-subject-covers")?.focus();
    else $("notice-subject-group")?.focus();
  }
}

/* ---- events ---- */
document.addEventListener("click", (ev) => {
  const demo = ev.target.closest(".demo button");
  if (demo) {
    if (demo.dataset.screen) { S.screen = demo.dataset.screen; setState(S.state[S.screen]); return; }
    if (demo.dataset.state) { setState(demo.dataset.state); return; }
    if (demo.dataset.lang) { S.lang = demo.dataset.lang; render(); return; }
    if (demo.dataset.themeBtn) { S.theme = demo.dataset.themeBtn; render(); return; }
  }
  const opt = ev.target.closest('[role="option"]');
  if (opt && S.dlg) { toggle(opt); return; }
  const el = ev.target.closest("[data-action]");
  if (!el) {
    if (!document.contains(ev.target)) return;   /* the field was redrawn under the pointer */
    if (S.dlg && S.dlg.open && !ev.target.closest("#wrap-notice-subject-covers")) { S.dlg.open = false; refreshCovers(); }
    return;
  }
  ev.preventDefault();
  const a = el.dataset.action, id = Number(el.dataset.id);
  switch (a) {
    case "retry": S.load = "ready"; S.state.edition = "mapped"; render(); break;
    case "add": S.returnFocus = "#ns-add"; openDialog("add"); renderDialog(); $("notice-subject-group")?.focus(); break;
    case "edit": S.returnFocus = `[data-action="edit"][data-id="${id}"]`; openDialog("edit", id); renderDialog(); $("notice-subject-group")?.focus(); break;
    case "tax-retry": S.dlg.tax = "ready"; S.tax = sortTax(baseTax()); refreshCovers({ input: true }); break;
    case "chip-remove": {
      const d = S.dlg; const p = d.picks.find(x => keyOf(x) === el.dataset.key);
      d.picks = d.picks.filter(x => x !== p); d.dirty = true; d.covErr = null;
      announce(t("NoticeSubjects.Covers.Removed", spoken(info(p))));
      refreshCovers({ chip: Number(el.dataset.index) });
      break;
    }
    case "covers-clear":
      S.dlg.picks = []; S.dlg.dirty = true; S.dlg.covErr = null; announce(t("NoticeSubjects.Covers.Cleared")); refreshCovers({ input: true }); break;
    case "cf-cancel": S.confirm = null; renderConfirm(); $("notice-subject-group")?.focus(); break;
    case "cf-confirm": closeDialog(); break;
    case "dlg-cancel": cancelDialog(); break;
    case "dlg-save": saveDialog(); break;
  }
});

let resultsTimer = null;
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (!S.dlg) return;
  if (el.dataset.covers === "input") {
    S.dlg.term = el.value; S.dlg.open = true; refreshCovers({ input: true, pos: el.selectionStart });
    clearTimeout(resultsTimer);
    resultsTimer = setTimeout(() => {
      const n = optionCount(visibleGroups());
      announce(n ? t("Lookup.Results", fmt(n)) : t("Lookup.NoResults", S.dlg.term));
    }, 400);
    return;
  }
  if (el.dataset.field) { S.dlg[el.dataset.field] = el.value; S.dlg.dirty = true; }
});

/* the list opens on a click in the input, on typing or on Arrow down - not on focus alone, so a field error
   under the input stays visible when Save moves the focus there */
document.addEventListener("mousedown", (ev) => {
  const el = ev.target;
  if (S.dlg && el.dataset && el.dataset.covers === "input" && !S.dlg.open && S.dlg.tax === "ready" && !el.disabled) {
    S.dlg.open = true; setTimeout(() => refreshCovers({ input: true, pos: el.value.length }), 0);
  }
});

document.addEventListener("keydown", (ev) => {
  const el = ev.target;
  const isOption = el.getAttribute && el.getAttribute("role") === "option";
  const options = () => [...document.querySelectorAll('#notice-subject-covers-list [role="option"]')];
  if (ev.key === "Escape") {
    if (S.confirm) { ev.preventDefault(); document.querySelector('[data-action="cf-cancel"]')?.click(); return; }
    if (S.dlg && S.dlg.open) { ev.preventDefault(); S.dlg.open = false; refreshCovers({ input: true }); return; }
    if (S.dlg) { ev.preventDefault(); cancelDialog(); return; }
  }
  if (el.id === "notice-subject-covers" && ev.key === "Tab" && S.dlg.open) {
    S.dlg.open = false;
    setTimeout(() => { $("notice-subject-covers-list")?.remove(); el.setAttribute("aria-expanded", "false"); }, 0);
  }
  if (el.id === "notice-subject-covers" && ev.key === "ArrowDown") {
    ev.preventDefault();
    if (!S.dlg.open) { S.dlg.open = true; refreshCovers({ input: true }); }
    options()[0]?.focus();
    return;
  }
  if (isOption) {
    const list = options(), i = list.indexOf(el);
    if (ev.key === "ArrowDown") { ev.preventDefault(); list[Math.min(i + 1, list.length - 1)]?.focus(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); (i === 0 ? $("notice-subject-covers") : list[i - 1])?.focus(); }
    else if (ev.key === "Home") { ev.preventDefault(); list[0]?.focus(); }
    else if (ev.key === "End") { ev.preventDefault(); list[list.length - 1]?.focus(); }
    else if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); toggle(el); }
    else if (ev.key === "Tab") {
      /* close without redrawing, so the focus lands on the next control */
      S.dlg.open = false;
      setTimeout(() => { $("notice-subject-covers-list")?.remove(); $("notice-subject-covers")?.setAttribute("aria-expanded", "false"); }, 0);
    }
    else if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey) { $("notice-subject-covers")?.focus(); }
    return;
  }
  if (S.dlg && ev.key === "Enter" && el.tagName === "INPUT" && el.id !== "notice-subject-covers") { ev.preventDefault(); saveDialog(); }
});

setSubjectsState("ready");
setTopicsState("ready");
setEditionState("mapped");
render();
</script>
</body>
</html>
