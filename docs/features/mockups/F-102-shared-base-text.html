<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-102 - Shared base text (mockup)</title>
<style>
/* ===========================================================================
   F-102 mockup - /admin/base-texts, /admin/base-texts/new|{id}, the question form's
   Base text section, the delete confirmation and the transcription screen (F-99).
   Every colour is a token of docs/design/identity.tokens.json (light and dark); the
   white on a filled info alert is MudBlazor's default contrast text (DESIGN.md, Info).
   Classes mirror the kit (app.css): app-page-header, app-data-table, app-row-actions,
   app-section-card, app-form-grid, app-field, app-lookup, app-rich-text, app-alert,
   app-error-summary, app-form-actions, app-form-aside, app-status-chip, app-disclosure,
   app-link, app-state. No new kit component, no new colour, no new icon.
   No external request: no web font, no icon font, no image.
   =========================================================================== */
:root {
  --app-font-xs: 0.75rem; --app-font-sm: 0.8125rem; --app-font-md: 0.9375rem;
  --app-font-lg: 1.0625rem; --app-font-xl: 1.25rem; --app-font-xxl: 1.75rem;
  --app-space-1: 4px; --app-space-2: 8px; --app-space-3: 12px; --app-space-4: 16px; --app-space-5: 24px; --app-space-6: 32px;
  --app-radius-md: 10px; --app-radius-pill: 999px;

  /* tokens, light */
  --primary: #216DB5; --primary-darken: #1858A0; --primary-lighten: #EBF3FD; --primary-contrast: #FFFFFF;
  --success: #1A9E8C; --success-contrast: #19243E;
  --warning: #D98B1A; --warning-contrast: #19243E;
  --info: #2478C5; --info-contrast: #FFFFFF;
  --error: #BE3737; --error-contrast: #FFFFFF;
  --background: #F2F5FB; --surface: #FFFFFF;
  --drawer: #0F3266; --drawer-text: rgba(255,255,255,0.918); --appbar: #0F3266; --appbar-text: #FFFFFF;
  --text-primary: #19243E; --text-secondary: #4A5A7A; --action-default: #4A5A7A;
  --lines-inputs: #7E8AA1; --table-lines: #D0D8EA; --divider: #D0D8EA;
}
[data-theme="dark"] {
  --primary: #64A2E3; --primary-darken: #5096DC; --primary-lighten: #162540; --primary-contrast: #19243E;
  --success: #1A9E8C; --success-contrast: #19243E;
  --warning: #D98B1A; --warning-contrast: #19243E;
  --info: #2478C5; --info-contrast: #FFFFFF;
  --error: #E06C6C; --error-contrast: #19243E;
  --background: #0E1828; --surface: #172035;
  --drawer: #091422; --drawer-text: rgba(255,255,255,0.498); --appbar: #091422; --appbar-text: rgba(255,255,255,0.7);
  --text-primary: #E0E8F8; --text-secondary: #7A8EB0; --action-default: #7A8EB0;
  --lines-inputs: #61718F; --table-lines: #263352; --divider: #263352;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: var(--app-font-md); line-height: 1.65;
  background: var(--background); color: var(--text-primary);
  display: flex; flex-direction: column;
}
svg { display: inline-block; flex-shrink: 0; vertical-align: middle; fill: currentColor; }
button { font: inherit; color: inherit; }
:is(a, button, input, select, textarea, [tabindex], [contenteditable]):focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.app-visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }

/* ---- demo chrome (not part of the product) ---- */
.demo { display: flex; flex-wrap: wrap; align-items: center; gap: var(--app-space-2); padding: var(--app-space-2) var(--app-space-4);
  background: var(--surface); border-bottom: 1px dashed var(--divider); font-size: var(--app-font-xs); }
.demo-label { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin-left: var(--app-space-2); }
.demo button { font-size: var(--app-font-xs); font-weight: 600; padding: 3px 10px; border-radius: 20px; cursor: pointer;
  border: 1px solid var(--lines-inputs); background: var(--surface); color: var(--text-primary); }
.demo button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-contrast); }
.demo-states { display: contents; }
.demo-note { width: 100%; color: var(--text-secondary); }

/* ---- app shell (F-2) ---- */
.appbar { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: var(--app-space-3); padding: 0 var(--app-space-4); background: var(--appbar); color: var(--appbar-text); }
.brand { font-weight: 700; letter-spacing: .09em; }
.spacer { flex: 1; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--success); color: var(--success-contrast); display: flex; align-items: center; justify-content: center; font-size: var(--app-font-xs); font-weight: 700; }
.lay { flex: 1; display: flex; min-height: 0; }
.drawer { width: 260px; flex-shrink: 0; background: var(--drawer); color: var(--drawer-text); padding: var(--app-space-3) var(--app-space-2); }
.nav-section { display: block; padding: var(--app-space-4) var(--app-space-3) var(--app-space-1); font-size: var(--app-font-xs); text-transform: uppercase; letter-spacing: .06em; opacity: .8; }
.nav-link { display: flex; align-items: center; gap: var(--app-space-3); padding: var(--app-space-2) var(--app-space-3); border-left: 3px solid transparent; border-radius: 6px; font-size: var(--app-font-sm); cursor: pointer; color: inherit; text-decoration: none; }
.nav-link:hover { background: rgba(255,255,255,.08); }
.nav-link[aria-current="page"] { background: rgba(255,255,255,.14); border-left-color: var(--primary); font-weight: 600; }
.main { flex: 1; overflow-y: auto; padding: var(--app-space-5); min-width: 0; }
@media (max-width: 959.98px) { .drawer { display: none; } .main { padding: var(--app-space-4); } }

/* ---- AppLink (B-6): text colour of the surface, underlined ---- */
.app-link { color: var(--text-primary); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.app-link:hover { text-decoration-thickness: 2px; }
.app-link svg { vertical-align: text-bottom; }

/* ---- AppPageHeader ---- */
.app-page-header { margin-bottom: var(--app-space-5); }
.app-breadcrumbs { font-size: var(--app-font-sm); color: var(--text-secondary); padding-bottom: var(--app-space-1); overflow-wrap: anywhere; }
.app-breadcrumbs .app-link { color: var(--text-secondary); }
.app-page-header-row { display: flex; align-items: center; justify-content: space-between; gap: var(--app-space-3); flex-wrap: wrap; }
.app-page-title { font-size: var(--app-font-xxl); font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; min-width: 0; }

/* ---- buttons (MudButton variants) ---- */
.app-button { font-size: var(--app-font-sm); font-weight: 600; cursor: pointer; min-height: 38px; padding: 0 var(--app-space-4); border-radius: var(--app-radius-md);
  display: inline-flex; align-items: center; gap: var(--app-space-2); border: 1px solid transparent; background: transparent; text-transform: none; }
.app-button-filled { background: var(--primary); color: var(--primary-contrast); }
.app-button-filled:hover { background: var(--primary-darken); }
.app-button-outlined { border-color: var(--primary); color: var(--primary); }
.app-button-outlined:hover { background: var(--primary-lighten); }
.app-button-outlined-error { border-color: var(--error); color: var(--error); }
.app-button-text { color: var(--text-primary); }
.app-button-text:hover { background: var(--primary-lighten); }
.app-button-error { background: var(--error); color: var(--error-contrast); }
.app-button[disabled] { opacity: .45; cursor: not-allowed; }
.app-icon-button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: var(--action-default); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.app-icon-button:hover { background: var(--primary-lighten); }
.app-icon-button.is-error { color: var(--error); }
.app-icon-button[disabled] { opacity: .4; cursor: not-allowed; }
.app-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin .9s linear infinite; }
.app-spinner-lg { width: 36px; height: 36px; border-width: 3px; color: var(--primary); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- AppDataTable ---- */
.app-data-table { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); overflow: hidden; }
.app-section-card .app-data-table { border-radius: var(--app-radius-md); }
.app-table-toolbar { display: flex; align-items: flex-end; gap: var(--app-space-3); padding: var(--app-space-3) var(--app-space-4); flex-wrap: wrap; }
.app-table-search { flex: 1 1 18rem; margin: 0 !important; }
.app-table-filters { display: flex; gap: var(--app-space-3); flex-wrap: wrap; }
.app-table-filters .app-field { width: 15rem; margin: 0; }
.app-table-wrap { overflow-x: auto; }
.app-table { width: 100%; border-collapse: collapse; font-size: var(--app-font-sm); }
.app-table th { text-align: left; font-size: var(--app-font-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); padding: var(--app-space-2) var(--app-space-4); border-bottom: 1px solid var(--table-lines); }
.app-table td { padding: var(--app-space-2) var(--app-space-4); border-bottom: 1px solid var(--table-lines); vertical-align: middle; }
.app-table tbody tr:hover { background: var(--primary-lighten); }
.app-cell-number, th.app-cell-number { text-align: right; font-variant-numeric: tabular-nums; }
.app-cell-actions { text-align: right; white-space: nowrap; width: 1%; }
.app-cell-secondary { display: block; color: var(--text-secondary); font-size: var(--app-font-xs); }
.app-truncate { display: inline-block; max-width: 26rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
.app-truncate-title { max-width: 32rem; }
.app-truncate-sm { max-width: 16rem; }
.app-row-actions { display: inline-flex; gap: 2px; }
.app-pager { display: flex; justify-content: flex-end; align-items: center; gap: var(--app-space-4); padding: var(--app-space-2) var(--app-space-4); font-size: var(--app-font-xs); color: var(--text-secondary); }
.app-pager select { font: inherit; color: inherit; background: transparent; border: 0; }

/* ---- AppStatusChip ---- */
.app-status-chip { display: inline-flex; align-items: center; gap: var(--app-space-2); padding: 2px 10px; border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-pill); background: var(--surface); color: var(--text-primary); font-size: var(--app-font-xs); font-weight: 600; white-space: nowrap; }
.app-status-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-secondary); }
.app-status-chip-success .app-status-chip-dot { background: var(--success); }
.app-status-chip-error .app-status-chip-dot { background: var(--error); }

/* ---- states ---- */
.app-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--app-space-3); padding: var(--app-space-6) var(--app-space-4); text-align: center; color: var(--text-secondary); }
.app-state-card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); }
.app-state-title { font-size: var(--app-font-xl); font-weight: 700; color: var(--text-primary); }
.app-state-error svg { color: var(--error); }

/* ---- AppAlert (MudAlert, Filled, Dense) / AppErrorSummary ---- */
.app-alert { display: flex; gap: var(--app-space-3); align-items: flex-start; padding: var(--app-space-3) var(--app-space-4); border-radius: var(--app-radius-md); margin-bottom: var(--app-space-4); font-size: var(--app-font-sm); overflow-wrap: anywhere; }
.app-alert-content { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: var(--app-space-2); }
.app-alert-error { background: var(--error); color: var(--error-contrast); }
.app-alert-info { background: var(--info); color: var(--info-contrast); }
.app-alert-warning { background: var(--warning); color: var(--warning-contrast); }
.app-alert-success { background: var(--success); color: var(--success-contrast); }
.app-alert .app-button-text { color: inherit; min-height: 28px; text-decoration: underline; }
.app-alert-title { font-weight: 700; }
.app-error-summary-list { margin: var(--app-space-1) 0 0; padding-left: var(--app-space-5); }
.app-error-summary-list a { color: inherit; }

/* ---- form layout ---- */
.app-form-layout { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: var(--app-space-4); align-items: start; }
@media (max-width: 1279.98px) { .app-form-layout { grid-template-columns: minmax(0, 1fr); } }
.app-form-card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-5); min-width: 0; display: block; }
.mt-4 { margin-top: var(--app-space-4); }
.mb-4 { margin-bottom: var(--app-space-4); }
.app-section-card { border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-4); min-width: 0; }
.app-section-card + .app-section-card { margin-top: var(--app-space-4); }
.app-section-card-head { display: flex; align-items: flex-start; gap: var(--app-space-3); margin-bottom: var(--app-space-4); }
.app-section-card-icon { color: var(--primary); margin-top: 3px; }
.app-section-card-title { font-size: var(--app-font-lg); font-weight: 600; color: var(--primary); }
.app-section-card-subtitle { font-size: var(--app-font-xs); color: var(--text-secondary); margin-top: var(--app-space-1); }
.app-form-grid { display: grid; gap: var(--app-space-3) var(--app-space-4); margin-bottom: var(--app-space-4); }
.app-form-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 599.98px) { .app-form-grid-2 { grid-template-columns: minmax(0, 1fr); } }

/* ---- fields ---- */
.app-field { margin-bottom: var(--app-space-4); min-width: 0; }
.app-form-grid .app-field { margin-bottom: 0; }
.app-field-label { display: block; font-size: var(--app-font-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--app-space-1); }
.app-field-required { color: var(--error); margin-left: 3px; }
.app-field-input { display: flex; align-items: center; gap: var(--app-space-2); height: 40px; padding: 0 var(--app-space-2) 0 var(--app-space-3); border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-md); background: var(--surface); color: var(--text-primary); }
.app-field-input:focus-within { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.app-field-input input, .app-field-input select { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; color: var(--text-primary); font: inherit; font-size: var(--app-font-md); text-overflow: ellipsis; }
.app-field-input select option { background: var(--surface); color: var(--text-primary); }
.app-field-input input::placeholder { color: var(--text-secondary); }
.app-field-icon { color: var(--primary); display: inline-flex; }
.app-field-error .app-field-input { border-color: var(--error); }
.app-field-disabled .app-field-input { opacity: .55; }
.app-field-description { display: block; font-size: var(--app-font-xs); line-height: 1.45; margin-top: var(--app-space-1); min-height: 1.1em; overflow-wrap: anywhere; }
.app-field-hint { color: var(--text-secondary); }
.app-field-error-text { color: var(--error); font-weight: 600; }

/* ---- AppLookupField (MudAutocomplete) ---- */
.app-lookup { position: relative; }
.app-field-clear { width: 28px; height: 28px; }
.app-lookup-list { position: absolute; left: 0; right: 0; z-index: 20; margin-top: 2px; list-style: none; padding: var(--app-space-1) 0; max-height: 19rem; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); box-shadow: 0 6px 20px rgba(10,20,40,.22); }
.app-lookup-option { display: block; padding: 6px var(--app-space-3); cursor: pointer; }
.app-lookup-option:hover, .app-lookup-option[aria-selected="true"] { background: var(--primary-lighten); }
.app-lookup-option-text { display: block; overflow-wrap: anywhere; }
.app-lookup-option-secondary { display: block; font-size: var(--app-font-xs); color: var(--text-secondary); }
.app-lookup-message { padding: var(--app-space-2) var(--app-space-3); color: var(--text-secondary); font-size: var(--app-font-sm); }
.app-lookup-retry { min-height: 24px; padding: 0 var(--app-space-2); color: var(--error); text-decoration: underline; }

/* ---- AppRichTextField (F-95) ---- */
.app-rich-text-frame { border: 1px solid var(--lines-inputs); border-radius: var(--app-radius-md); background: var(--surface); overflow: hidden; }
.app-rich-text-frame:focus-within { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.app-field-error .app-rich-text-frame { border-color: var(--error); }
.app-rt-toolbar { display: flex; flex-wrap: wrap; gap: 2px; padding: var(--app-space-1) var(--app-space-2); border-bottom: 1px solid var(--divider); }
.app-rt-btn { width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--action-default); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.app-rt-btn:hover { background: var(--primary-lighten); }
.app-rt-sep { width: 1px; background: var(--divider); margin: 4px var(--app-space-1); }
.app-rt-editor { padding: var(--app-space-2) var(--app-space-3); min-height: 9rem; outline: none; font-size: var(--app-font-md); overflow-wrap: anywhere; }
.app-rt-editor.is-empty::before { content: attr(data-placeholder); color: var(--text-secondary); }
.app-rt-editor p + p, .app-question-content p + p { margin-top: var(--app-space-2); }
.app-rt-editor table, .app-question-content table { border-collapse: collapse; margin-top: var(--app-space-2); }
.app-rt-editor th, .app-rt-editor td, .app-question-content th, .app-question-content td { border: 1px solid var(--divider); padding: 2px 8px; }
.app-rt-editor th, .app-question-content th { color: var(--text-secondary); font-size: var(--app-font-sm); }
.app-question-content { overflow-wrap: anywhere; }
.app-question-content a, .app-rt-editor a { color: var(--text-primary); }

/* ---- AppDisclosure (F-76) ---- */
.app-disclosure-button { display: inline-flex; align-items: center; gap: var(--app-space-1); min-height: 32px; padding: 0 var(--app-space-2); border: 0; border-radius: var(--app-radius-md); background: transparent; color: var(--text-primary); font-size: var(--app-font-sm); font-weight: 600; cursor: pointer; }
.app-disclosure-button:hover { background: var(--primary-lighten); }
.app-disclosure-icon { display: inline-flex; transition: transform .15s; }
.app-disclosure-icon.is-open { transform: rotate(180deg); }

/* ---- base text section (F-102): kit pieces arranged in the section ---- */
.app-base-text-links { display: flex; flex-wrap: wrap; align-items: center; gap: var(--app-space-2) var(--app-space-5); margin-top: calc(-1 * var(--app-space-2)); margin-bottom: var(--app-space-2); font-size: var(--app-font-sm); }
.app-base-text-preview { border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-3) var(--app-space-4); margin-bottom: var(--app-space-3); font-size: var(--app-font-sm); max-height: 22rem; overflow-y: auto; }
.app-base-text-note { display: block; margin-top: var(--app-space-3); font-size: var(--app-font-xs); }
.app-base-text-create { margin-top: var(--app-space-3); padding-top: var(--app-space-3); border-top: 1px solid var(--divider); font-size: var(--app-font-sm); }
.app-base-text-create-help { font-size: var(--app-font-xs); color: var(--text-secondary); margin-top: var(--app-space-1); }

/* ---- delete card ---- */
.app-danger-row { display: flex; align-items: center; gap: var(--app-space-3); flex-wrap: wrap; }
.app-publication-row { display: flex; align-items: center; gap: var(--app-space-3); flex-wrap: wrap; font-size: var(--app-font-sm); }
.app-publication-actions { display: flex; gap: var(--app-space-2); margin-top: var(--app-space-4); flex-wrap: wrap; }
.app-publication-reason { font-size: var(--app-font-xs); color: var(--text-secondary); margin-top: var(--app-space-2); }

/* ---- AppFormActions ---- */
.app-form-actions { display: flex; justify-content: flex-end; align-items: center; gap: var(--app-space-2); margin-top: var(--app-space-5); }

/* ---- AppFormAside ---- */
.app-form-aside { position: sticky; top: var(--app-space-4); background: var(--surface); border: 1px solid var(--divider); border-radius: var(--app-radius-md); padding: var(--app-space-4) var(--app-space-4) var(--app-space-3); }
.app-form-aside-title { font-size: var(--app-font-md); font-weight: 700; margin-bottom: var(--app-space-2); }
.app-form-aside-row { display: flex; justify-content: space-between; gap: var(--app-space-3); padding: var(--app-space-2) 0; border-bottom: 1px solid var(--divider); font-size: var(--app-font-sm); }
.app-form-aside-row:last-of-type { border-bottom: 0; }
.app-form-aside-row-label { color: var(--text-secondary); font-weight: 600; flex: none; }
.app-form-aside-row-value { text-align: right; overflow-wrap: anywhere; min-width: 0; }
.app-form-aside-row-empty { color: var(--text-secondary); font-style: italic; }

/* ---- transcription header (F-99) ---- */
.app-transcribe-edition { font-size: var(--app-font-lg); font-weight: 600; }
.app-transcribe-counter { font-size: var(--app-font-sm); color: var(--text-secondary); }

/* ---- dialog (MudDialog via IConfirmService) ---- */
.app-dialog-backdrop { position: fixed; inset: 0; background: rgba(14,24,40,.55); display: flex; align-items: flex-start; justify-content: center; padding: 15vh var(--app-space-4) var(--app-space-4); z-index: 40; }
.app-dialog { background: var(--surface); color: var(--text-primary); border-radius: var(--app-radius-md); width: 100%; max-width: 30rem; box-shadow: 0 8px 32px rgba(10,20,40,.35); }

function listData() {
  let data = BASE_TEXTS.filter(b => !deletedIds.includes(b.id));
  if (state === "long") data = data.concat([LONG_TEXT]);
  if (state === "emptyFilter") data = data.filter(b => b.lang !== "pt-PT");
  if (state === "refused") data = data.map(b => b.id === 3 ? Object.assign({}, b, { count: 1 }) : b);
  return byTitle(data);
}
function listBody() {
  if (state === "loading") return loadingState(false);
  if (state === "error") return errorState(false);
  if (state === "empty") return emptyState(t("BaseTexts.Empty"), t("Common.Add"));
  const term = listTerm.trim().toLowerCase();
  const rows = listData().filter(b => (!listLang || b.lang === listLang) && (!term || b.title.toLowerCase().includes(term)));
  if (!rows.length) return emptyState(term ? t("BaseTexts.Empty.Search", listTerm.trim()) : t("BaseTexts.Empty.Filters"), t("Common.Add"));
  const body = rows.map(b => {
    const name = t("BaseTexts.Row.Name", cut(b.title, 60));
    return `<tr><td><span class="app-truncate app-truncate-title" title="${esc(b.title)}" lang="${b.lang}">${esc(b.title)}</span></td>` +
      `<td><span lang="${b.lang}">${esc(LANG_NAMES[b.lang])}</span></td>` +
      `<td class="app-cell-number">${fmtNum(b.count)}</td>` +
      `<td class="app-cell-actions">${rowActions(name, { editTo: "form:" + (b.count > 0 ? "editInUse" : "editFree"), withDelete: true, deleteId: b.id, deleteReason: b.count > 0 ? t("BaseTexts.Delete.DisabledInUse", fmtNum(b.count)) : null })}</td></tr>`;

}

  return h;

function renderForm() {
  if (state === "denied") return deniedState();
  const m = formModel();
  const title = m.isNew ? t("BaseTexts.Form.AddTitle") : t("BaseTexts.Form.EditTitle");
  let h = pageHeader([{ text: t("Nav.Section.Content") }, { text: t("BaseTexts.Title"), link: true }, { text: title }], title, null);
  if (state === "loading") return h + loadingState(true);
  if (state === "loadError") return h + errorState(true);
  if (state === "notFound") return h + `<div class="app-form-card">${alertBox("error", t("base_text.not_found"))}<a href="#" class="app-link" data-go="list:ready">${esc(t("BaseTexts.BackToList"))}</a></div>`;
  const locked = !m.isNew && m.count > 0;
  let form = `<form class="app-form-card" novalidate>`;
  if (m.summary) {
    const items = [];
    if (m.titleError) items.push({ id: "base-text-title", label: t("BaseTexts.Field.Title") });
    if (m.langError) items.push({ id: "base-text-content-language", label: t("BaseTexts.Field.ContentLanguage") });
    if (m.textError) items.push({ id: "base-text-text", label: t("BaseTexts.Field.Text") });
    form += errorSummary("base-text-error-summary", items);
  }
  if (m.topError) form += alertBox("error", m.topError);
  let fields = `<div class="app-form-grid app-form-grid-2">` +
    textField({ id: "base-text-title", label: t("BaseTexts.Field.Title"), required: true, value: m.title, placeholder: t("BaseTexts.Field.Title.Placeholder"), hint: t("BaseTexts.Field.Title.Hint"), error: m.titleError, maxlength: 200, lang: m.lang }) +
    selectField({ id: "base-text-content-language", label: t("BaseTexts.Field.ContentLanguage"), required: true, options: langOptions(), value: m.lang, icon: "language", disabled: locked,
      hint: locked ? t("BaseTexts.Field.ContentLanguage.Locked", fmtNum(m.count)) : t("BaseTexts.Field.ContentLanguage.Hint"), error: m.langError }) + `</div>`;
  if (locked) fields += alertBox("info", t("BaseTexts.Versions.Notice"));
  fields += richText({ id: "base-text-text", label: t("BaseTexts.Field.Text"), required: true, value: m.html, placeholder: t("BaseTexts.Field.Text.Placeholder"), hint: t("BaseTexts.Field.Text.Hint"), error: m.textError, lang: m.lang });
  form += sectionCard("base-text-section-text", "basetext", t("BaseTexts.Section.Text"), t("BaseTexts.Section.Text.Subtitle"), fields);
  form += formActions(state === "saving") + `</form>`;
  h += form;
  if (!m.isNew) h += linkedQuestionsCard(m.count) + deleteCard(m.count);
  return h;
}

/* ===========================================================================
   Screen 3 - the question form, section Base text (and Screen 5, transcription)
   =========================================================================== */
function pickerOptions() {
  if (state === "noResults") return [];
  return byTitle(BASE_TEXTS.filter(b => b.lang === qLang)).map(b => ({ id: b.id, text: b.title, lang: b.lang, secondary: t("Questions.BaseText.Option.Secondary", fmtNum(b.count), fmtDate(b.updated)) }));
}
function baseTextSection(transcribing) {
  const annulled = state === "annulled";
  const chosen = qChosen ? findText(qChosen) : null;
  const open = state === "open" || state === "noResults";
  const error = state === "notFound" ? t("question.base_text_not_found") : state === "mismatch" ? t("question.base_text_language_mismatch") : null;
  const hint = transcribing && chosen ? t("Questions.BaseText.Kept") : t("Questions.Field.BaseText.Hint", LANG_NAMES[qLang]);
  let body = "";
  if (qCleared) body += alertBox("info", t("Questions.BaseText.Cleared", qCleared.title, LANG_NAMES[qCleared.from], LANG_NAMES[qCleared.to]));
  body += lookupField({ id: "question-base-text", label: t("Questions.Field.BaseText"), placeholder: t("Questions.Field.BaseText.Placeholder"), value: chosen ? chosen.title : "", valueLang: chosen ? chosen.lang : null,
    hint: hint, error: error, disabled: annulled, open: open, options: open ? pickerOptions() : [], term: state === "noResults" ? "geologia" : "", searchFailed: state === "searchFailed" });
  if (chosen) {
    body += `<div class="app-base-text-links"><a class="app-link" href="#" target="_blank" rel="noopener" aria-label="${esc(t("Common.LinkOpensNewTab", t("Questions.BaseText.Open")))}">${esc(t("Questions.BaseText.Open"))} ${ic("openinnew", 16)}</a>` +
      `<div class="app-disclosure"><button type="button" class="app-disclosure-button" id="question-base-text-preview-button" aria-expanded="${qExpanded}" aria-controls="question-base-text-preview" data-toggle-preview><span class="app-disclosure-icon${qExpanded ? " is-open" : ""}">${ic("expand")}</span><span>${esc(t(qExpanded ? "Questions.BaseText.Hide" : "Questions.BaseText.Show"))}</span></button></div></div>`;
    body += `<div id="question-base-text-preview" class="app-base-text-preview"${qExpanded ? "" : " hidden"}>${qExpanded ? `<div class="app-question-content" lang="${chosen.lang}">${chosen.html}</div><span class="app-field-hint app-base-text-note">${esc(t("Questions.BaseText.ReadOnlyNote"))}</span>` : ""}</div>`;
  }
  if (!annulled) {
    body += `<div class="app-base-text-create"><span>${esc(t("Questions.BaseText.Create.Lead"))}</span> <a class="app-link" href="#" target="_blank" rel="noopener" aria-label="${esc(t("Common.LinkOpensNewTab", t("Questions.BaseText.Create")))}" aria-describedby="question-base-text-create-help">${esc(t("Questions.BaseText.Create"))} ${ic("openinnew", 16)}</a>` +
      `<p class="app-base-text-create-help" id="question-base-text-create-help">${esc(t("Questions.BaseText.Create.Help"))}</p></div>`;
  }
  return sectionCard("question-section-base-text", "basetext", t("Questions.Section.BaseText"), t("Questions.Section.BaseText.Subtitle"), body);
}
/* blank: the transcription screen after "Save and continue" (F-99 AC3: subject, topic and difficulty are cleared) */
function classificationSection(annulled, blank) {
  return sectionCard("question-section-classification", "topics", t("Questions.Section.Classification"), t("Questions.Section.Classification.Subtitle"),
    `<div class="app-form-grid app-form-grid-2">` +
    lookupField({ id: "question-subject", label: t("Questions.Field.Subject"), required: true, value: blank ? "" : "Língua Portuguesa", placeholder: "", hint: "", disabled: annulled, options: [] }) +
    lookupField({ id: "question-topic", label: t("Questions.Field.Topic"), required: true, value: blank ? "" : "Interpretação de texto", placeholder: "", hint: "", disabled: annulled || blank, options: [] }) +
    selectField({ id: "question-content-language", label: t("Questions.Field.ContentLanguage"), required: true, options: langOptions(), value: qLang, icon: "language", disabled: annulled, hint: t("Questions.Field.ContentLanguage.Hint") }) +
    selectField({ id: "question-difficulty", label: t("Questions.Field.Difficulty"), options: [{ value: "", text: t("Questions.Difficulty.NotSet") }].concat([1, 2, 3, 4, 5].map(n => ({ value: String(n), text: fmtNum(n) }))), value: blank ? "" : "3", disabled: annulled, hint: "" }) +
    `</div>`);
}
function questionAside(status, transcribing) {
  const chosen = qChosen ? findText(qChosen) : null;
  return aside([
    [t("Questions.Form.Aside.Status"), transcribing ? null : t("Questions.Status." + status)],
    [t("Questions.Field.Subject"), transcribing ? null : "Língua Portuguesa"],
    [t("Questions.Field.Topic"), transcribing ? null : "Interpretação de texto"],
    [t("Questions.Field.ContentLanguage"), LANG_NAMES[qLang], qLang],
    [t("Questions.Form.Aside.Source"), SOURCE_LINE],
    [t("Questions.Field.BaseText"), chosen ? chosen.title : null, chosen ? chosen.lang : null]
  ]);
}
const hasChanges = () => qChosen !== savedChosen || qLang !== "pt-BR";
function renderQuestion() {
  if (state === "denied") return deniedState();
  const annulled = state === "annulled";
  const status = annulled ? "Annulled" : "Draft";
  let h = pageHeader([{ text: t("Nav.Section.Content") }, { text: t("Questions.Title"), link: true }, { text: t("Questions.Form.EditTitle") }], t("Questions.Form.EditTitle"), null);
  let form = `<form class="app-form-card" novalidate>`;
  if (state === "notFound" || state === "mismatch") form += errorSummary("question-error-summary", [{ id: "question-base-text", label: t("Questions.Field.BaseText") }]);
  if (annulled) form += alertBox("warning", t("Questions.Annulled.Alert"));
  form += classificationSection(annulled);
  form += sectionCard("question-section-statement", "questions", t("Questions.Section.Statement"), t("Questions.Section.Statement.Subtitle"),
    richText({ id: "question-statement", label: t("Questions.Field.Statement"), required: true, value: "<p>De acordo com o texto, a construção da barragem de Três Marias teve como objetivo principal</p>", placeholder: t("Questions.Field.Statement.Placeholder"), hint: t("Questions.Field.Statement.Hint"), lang: qLang, disabled: annulled }));
  form += baseTextSection(false);
  if (!annulled) form += formActions(false);
  form += `</form>`;
  h += `<div class="app-form-layout">${form}${questionAside(status, false)}</div>`;
  const unsaved = hasChanges();
  const publication = `<div class="app-publication-row">${chip(status)}<span>${esc(t(annulled ? "Questions.Publication.Annulled" : "Questions.Publication.Draft"))}</span></div>` +
    `<div class="app-publication-actions"><button type="button" class="app-button app-button-outlined">${ic("view")}<span>${esc(t("Questions.Action.Preview"))}</span></button>` +
    (annulled ? "" : `<button type="button" class="app-button app-button-outlined"${unsaved ? ' disabled aria-describedby="question-publication-reason"' : ""}>${ic("publish")}<span>${esc(t("Questions.Action.Publish"))}</span></button>`) + `</div>` +
    (!annulled && unsaved ? `<p class="app-publication-reason" id="question-publication-reason">${esc(t("Questions.Publication.Publish.DisabledUnsaved"))}</p>` : "");
  h += `<div class="app-form-card mt-4">${sectionCard("question-section-publication", "publish", t("Questions.Section.Publication"), "", publication)}</div>`;
  return h;
}
function renderTranscribe() {
  let h = pageHeader([{ text: t("Nav.Section.Content") }, { text: t("Questions.Title"), link: true }, { text: t("Questions.Transcribe.Title") }], t("Questions.Transcribe.Title"), null);
  h += `<div class="app-form-card mb-4" id="question-transcribe-header">${state === "kept" ? alertBox("success", t("Questions.Transcribe.Saved")) : ""}` +
    `<p class="app-transcribe-edition">${esc(SOURCE_LINE)}</p><p class="app-transcribe-counter">${esc(t("Questions.Transcribe.Counter", 4))}</p>` +
    `<div class="app-form-actions" style="margin-top:var(--app-space-3)"><button type="button" class="app-button app-button-outlined">${esc(t("Questions.Transcribe.Finish"))}</button></div></div>`;
  let form = `<form class="app-form-card" novalidate>`;
  form += classificationSection(false, true);
  form += sectionCard("question-section-origin", "editions", t("Questions.Section.Origin"), "",
    `<div class="app-form-grid app-form-grid-2">` +
    lookupField({ id: "question-edition", label: t("Questions.Field.Edition"), value: SOURCE_LINE, placeholder: "", hint: t("Questions.Transcribe.EditionLocked"), disabled: true, options: [] }) +
    textField({ id: "question-paper-number", label: t("Questions.Field.PaperNumber"), required: true, value: "15", placeholder: "", hint: "", maxlength: 3 }) + `</div>`);
  form += sectionCard("question-section-statement", "questions", t("Questions.Section.Statement"), t("Questions.Section.Statement.Subtitle"),
    richText({ id: "question-statement", label: t("Questions.Field.Statement"), required: true, value: "", placeholder: t("Questions.Field.Statement.Placeholder"), hint: t("Questions.Field.Statement.Hint"), lang: qLang }));
  form += baseTextSection(true);
  form += formActions(false, t("Questions.Transcribe.SaveAndContinue")) + `</form>`;
  h += `<div class="app-form-layout">${form}${questionAside("Draft", true)}</div>`;
  return h;
}

/* ===========================================================================
   render
   =========================================================================== */
function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-screen]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.screen === screen)));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("demo-states").innerHTML = STATES[screen].map(s => `<button type="button" data-state="${s[0]}" aria-pressed="${s[0] === state}">${esc(s[1])}</button>`).join("");
  document.getElementById("demo-note").textContent = NOTES[screen];

  const denied = state === "denied";
  const navQuestions = document.getElementById("nav-questions"), navBase = document.getElementById("nav-base-texts");
  navQuestions.hidden = denied; navBase.hidden = denied;
  navQuestions.toggleAttribute("aria-current", false); navBase.toggleAttribute("aria-current", false);
  if (screen === "list" || screen === "form") navBase.setAttribute("aria-current", "page"); else navQuestions.setAttribute("aria-current", "page");

  const main = document.getElementById("main");
  main.innerHTML = { list: renderList, form: renderForm, question: renderQuestion, transcribe: renderTranscribe }[screen]();

  let overlay = "";
  if (screen === "list" && state === "confirmDelete") {
    const target = findText(pendingDelete);
    overlay = confirmDialog(t("Common.Delete.Title"), t("BaseTexts.Delete.Message", target.title), t("Common.Delete.Confirm", t("BaseTexts.Delete.Object")), "delete");
  }
  if (screen === "form" && state === "confirmDelete") overlay = confirmDialog(t("Common.Delete.Title"), t("BaseTexts.Delete.Message", findText(3).title), t("Common.Delete.Confirm", t("BaseTexts.Delete.Object")), "delete");
  if (screen === "form" && state === "unsaved") overlay = confirmDialog(t("Common.Discard.Title"), t("Common.Discard.Message"), t("Common.Discard.Confirm"), "discard");
  if (screen === "list" && state === "deleted") overlay = snack(t("BaseTexts.Deleted"));
  if (screen === "form" && state === "saved") overlay = snack(t("BaseTexts.Saved"));
  document.getElementById("overlay").innerHTML = overlay;
  const confirmButton = document.querySelector("[data-dlg='confirm']");
  if (confirmButton) confirmButton.focus();
}

/* ===========================================================================
   events
   =========================================================================== */
document.querySelectorAll("svg[data-icon]").forEach(el => { el.innerHTML = `<path d="${ICONS[el.dataset.icon]}"/>`; });

document.addEventListener("click", e => {
  const el = e.target.closest("[data-screen],[data-state],[data-lang],[data-theme-btn],[data-delete],[data-form-delete],[data-dlg],[data-toggle-preview],[data-pick],[data-go],#question-base-text,#question-base-text-clear,#page-primary,a[href='#']");
  if (!el) return;
  if (el.matches("a[href='#']") && !el.dataset.go) { e.preventDefault(); return; }
  if (el.dataset.screen) { screen = el.dataset.screen; setState(STATES[screen][0][0]); return; }
  if (el.dataset.state) { setState(el.dataset.state); return; }
  if (el.dataset.lang) { lang = el.dataset.lang; render(); return; }
  if (el.dataset.themeBtn) {
    document.documentElement.dataset.theme = el.dataset.themeBtn;
    document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", String(b === el)));
    return;
  }
  if (el.dataset.go) { e.preventDefault(); const p = el.dataset.go.split(":"); screen = p[0]; setState(p[1]); return; }
  if (el.id === "page-primary") { screen = "form"; setState("new"); return; }
  if (el.dataset.delete) { pendingDelete = Number(el.dataset.delete); state = "confirmDelete"; render(); return; }
  if (el.hasAttribute("data-form-delete")) { setState("confirmDelete"); return; }
  if (el.dataset.dlg) {
    const confirmed = el.dataset.dlg === "confirm";
    if (screen === "list") { if (confirmed) deletedIds.push(pendingDelete); state = confirmed ? "deleted" : "ready"; render(); return; }
    if (state === "unsaved") { if (confirmed) { screen = "list"; setState("ready"); } else setState("editInUse"); return; }
    if (confirmed) { screen = "list"; deletedIds = [3]; state = "deleted"; render(); } else setState("editFree");
    return;
  }
  if (el.hasAttribute("data-toggle-preview")) { qExpanded = !qExpanded; render(); document.getElementById("question-base-text-preview-button").focus(); return; }
  if (el.dataset.pick) {
    qChosen = Number(el.dataset.pick); qCleared = null; qExpanded = false;
    state = screen === "transcribe" ? state : (qChosen === savedChosen ? "chosen" : "unsaved");
    render(); return;
  }
  if (el.id === "question-base-text-clear") { qChosen = null; qExpanded = false; render(); document.getElementById("question-base-text").focus(); return; }
  if (el.id === "question-base-text" && screen === "question" && !qChosen && state !== "open" && state !== "annulled") { state = "open"; render(); const input = document.getElementById("question-base-text"); input.focus(); return; }
});

document.addEventListener("input", e => {
  if (e.target.id === "base-texts-search") { listTerm = e.target.value; document.getElementById("list-body").innerHTML = listBody(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "base-texts-filter-language") { listLang = e.target.value; document.getElementById("list-body").innerHTML = listBody(); }
  if (e.target.id === "question-content-language") {
    const next = e.target.value;
    const chosen = qChosen ? findText(qChosen) : null;
    if (chosen && chosen.lang !== next) {
      /* BR13 (and the same on the regular form): a text in another language is not kept */
      qCleared = { title: chosen.title, from: chosen.lang, to: next };
      qChosen = null; qExpanded = false;
      if (screen === "question") state = "cleared";
    } else if (!chosen) {
      qCleared = null;
    }
    qLang = next;
    render();
    document.getElementById("question-content-language").focus();
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.querySelector(".app-dialog-backdrop")) { const c = document.querySelector("[data-dlg='cancel']"); if (c) c.click(); return; }
  if (screen === "question" && (state === "open" || state === "noResults")) { state = savedChosen ? "chosen" : "none"; render(); }
});

render();
</script>
</body>
</html>
